<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>知序 · 学习复习工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23146c60'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='36' font-family='sans-serif' fill='white'%3E知%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --page-bg: #f1eadf;
    --surface: #fffdf7;
    --surface-soft: #f8f2e7;
    --ink: #282723;
    --muted: #6f655b;
    --primary: #315c50;
    --primary-dark: #24453d;
    --primary-soft: #e6eee6;
    --accent: #a86938;
    --accent-soft: #fbf1e2;
    --danger: #b4433c;
    --danger-soft: #faece9;
    --border: #e5d9c8;
    --border-strong: #d5c6b1;
    --shadow: 0 8px 26px rgba(56, 38, 21, .07);
    --radius: 14px;
    --sidebar: 260px;
    --drawer: 360px;
    --font: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-width: 1280px;
    height: 100vh;
    overflow: hidden;
    background: var(--page-bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, p { margin: 0; }
  button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: var(--primary); text-decoration: none; }
  input, select, textarea {
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    padding: 9px 12px;
    min-height: 40px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(20, 108, 96, .12);
  }
  textarea { resize: vertical; min-height: 84px; line-height: 1.7; }
  input[type="file"] { padding: 6px 9px; background: var(--surface-soft); min-height: 0; cursor: pointer; }
  input[type="radio"], input[type="checkbox"] { width: 16px; height: 16px; min-height: 0; accent-color: var(--primary); vertical-align: -3px; margin: 0 6px 0 0; padding: 0; }
  ::placeholder { color: #96a29d; }
  .hidden, [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace; }
  .hint { font-size: 12.5px; color: var(--muted); line-height: 1.75; }
  .inline-error {
    margin-top: 12px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 13px;
    overflow-wrap: anywhere;
  }

  /* ---------- shell ---------- */
  .app { height: 100vh; display: flex; flex-direction: column; min-width: 1280px; }
  .topbar {
    flex: 0 0 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 10px; }
  .brand:hover { background: var(--surface-soft); }
  .brand-mark {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .brand-name { font-size: 19px; font-weight: 750; letter-spacing: .08em; }
  .topbar-sep { width: 1px; height: 22px; background: var(--border); }
  .zone-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    max-width: 380px;
    padding: 5px 13px;
    border-radius: 999px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 13px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .zone-chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex: 0 0 auto; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .model-state {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .model-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
  .model-state.ok { color: var(--primary-dark); }
  .model-state.ok::before { background: var(--primary); }
  .model-state.off { color: var(--danger); }
  .model-state.off::before { background: var(--danger); }
  .app-body { flex: 1; display: flex; min-height: 0; }

  .sidebar {
    width: var(--sidebar);
    flex: 0 0 var(--sidebar);
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 16px 12px 12px;
    background: var(--surface);
    border-right: 1px solid var(--border);
  }
  .new-conv { width: 100%; min-height: 44px; border-radius: 10px; }
  .conv-list { flex: 1; overflow: auto; margin: 14px -4px 0; padding: 0 4px; min-height: 0; }
  .side-empty { padding: 14px 10px; font-size: 12.5px; color: var(--muted); line-height: 1.85; }
  .conv-item {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    padding: 10px 10px 10px 11px;
    margin-bottom: 3px;
    border-radius: 10px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .conv-item:hover { background: var(--surface-soft); }
  .conv-item.active { background: var(--primary-soft); border-color: #cfe3dc; }
  .conv-main { flex: 1; min-width: 0; }
  .conv-title { font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-meta { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-del {
    width: 24px; height: 24px;
    flex: 0 0 24px;
    display: none;
    place-items: center;
    border-radius: 7px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
  }
  .conv-item:hover .conv-del { display: grid; }
  .conv-del:hover { background: var(--danger-soft); color: var(--danger); }
  .sidebar-divider { height: 1px; background: var(--border); margin: 10px 4px; flex: 0 0 auto; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; padding: 2px 0 4px; flex: 0 0 auto; }
  .side-nav button {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 40px;
    padding: 8px 12px;
    border-radius: 9px;
    color: #43534d;
    font-weight: 650;
    text-align: left;
  }
  .side-nav button:hover { background: var(--surface-soft); }
  .side-nav button.active { background: var(--primary-soft); color: var(--primary-dark); }
  .nav-ico { display: grid; place-items: center; color: var(--primary); width: 18px; }

  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .page { overflow: auto; padding: 22px 26px 34px; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .page-head h2 { font-size: 22px; font-weight: 750; letter-spacing: .01em; }
  .page-sub { margin-top: 3px; font-size: 13px; color: var(--muted); }
  .page-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .inline-field { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .inline-field select { min-height: 36px; padding: 6px 10px; }

  /* ---------- buttons / cards / badges ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 40px;
    padding: 8px 16px;
    border-radius: 9px;
    border: 1px solid transparent;
    font-weight: 650;
    background: var(--surface);
    white-space: nowrap;
    transition: background .15s, border-color .15s, color .15s, filter .15s;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(20, 108, 96, .18); }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-outline { border-color: var(--border-strong); background: var(--surface); color: var(--ink); }
  .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary-dark); background: var(--primary-soft); }
  .btn-ghost { color: var(--muted); background: transparent; }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-soft); color: var(--ink); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover:not(:disabled) { filter: brightness(.94); }
  .btn-sm { min-height: 32px; padding: 5px 11px; font-size: 12.5px; border-radius: 7px; }
  .icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); font-size: 17px; line-height: 1; }
  .icon-btn:hover { background: var(--surface-soft); color: var(--ink); }
  .link-btn { padding: 0 2px; color: var(--primary); font-weight: 650; text-decoration: underline; text-underline-offset: 2px; }
  .action-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px 20px;
    border-bottom: 1px solid var(--border);
  }
  .card-head h3 { font-size: 15px; font-weight: 700; }
  .card-body { padding: 18px 20px; }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 13px 15px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    font-weight: 700;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 650;
    background: var(--surface-soft);
    color: var(--muted);
    white-space: nowrap;
  }
  .badge-ok { background: var(--primary-soft); color: var(--primary-dark); }
  .badge-warn { background: var(--accent-soft); color: #8a5a12; }
  .badge-fail { background: var(--danger-soft); color: var(--danger); }
  .badge-muted { background: #eef1ef; color: var(--muted); }
  .badge-accent { background: var(--accent-soft); color: #8a5a12; }
  .badge-xs { font-size: 10.5px; padding: 1px 5px; border-radius: 4px; }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 46px 32px;
    margin: 6px 0;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--muted);
    text-align: center;
  }
  .empty p { max-width: 520px; font-size: 14px; line-height: 1.95; }
  .loading-row { display: flex; align-items: center; gap: 9px; padding: 18px; color: var(--muted); font-size: 13px; }
  .spinner {
    display: inline-block;
    width: 15px;
    height: 15px;
    border: 2px solid rgba(20, 108, 96, .2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- chat ---------- */
  .chat-view { flex: 1; min-height: 0; display: flex; }
  .chat-wrap { flex: 1; display: flex; min-height: 0; min-width: 0; }
  .chat-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .chat-head {
    flex: 0 0 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .chat-scope {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-scope strong { font-size: 14px; font-weight: 700; color: var(--primary-dark); }
  .chat-head-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .chat-banners { flex: 0 0 auto; padding: 0 20px; }
  .notice {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.7;
  }
  .notice.warn { background: var(--accent-soft); border: 1px solid #ead7b8; color: #76501e; }
  .notice.error { background: var(--danger-soft); border: 1px solid #eccfca; color: var(--danger); }
  .msg-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 18px; padding: 20px 24px 10px; }
  .chat-empty { margin: auto; max-width: 540px; padding: 24px; text-align: center; color: var(--muted); font-size: 14px; line-height: 2; }
  .chat-empty .btn { margin-top: 10px; }
  .msg { display: flex; flex-direction: column; max-width: min(780px, 90%); }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .msg-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 12px; color: var(--muted); }
  .msg-time { color: #97a29d; }
  .msg-bubble {
    padding: 12px 15px;
    border-radius: 4px 13px 13px 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    line-height: 1.85;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user .msg-bubble {
    border-radius: 13px 4px 13px 13px;
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 4px 14px rgba(20, 108, 96, .16);
  }
  .msg.assistant.error .msg-bubble { background: var(--danger-soft); border-color: #eccfca; color: var(--danger); }
  .msg-cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cite-chip {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    max-width: 100%;
    padding: 3px 9px;
    border: 1px solid #c7dfd7;
    border-radius: 6px;
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cite-chip:hover, .cite-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .retrieved-pages { align-self: stretch; min-width: 0; margin-top: 10px; }
  .retrieved-pages-title { margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  .retrieved-page-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .retrieved-page { width: min(144px, 100%); min-width: 0; padding: 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .retrieved-page img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: contain; background: var(--primary-soft); border-radius: 4px; }
  .retrieved-page a { display: block; color: var(--primary-dark); }
  .retrieved-page a:hover { text-decoration: underline; }
  .retrieved-page-label, .retrieved-page-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .retrieved-page-label { margin-top: 4px; font-weight: 650; }
  .retrieved-page-name { color: var(--muted); }
  .retrieved-page a[hidden] { display: none; }
  .composer { flex: 0 0 auto; padding: 12px 20px 14px; background: var(--surface); border-top: 1px solid var(--border); }
  .composer-row { display: flex; align-items: flex-end; gap: 10px; }
  .attach-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }
  .attach-btn:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-dark); }
  #chatInput { flex: 1; min-height: 44px; max-height: 168px; padding: 11px 13px; resize: none; line-height: 1.65; }
  .composer-error { margin-bottom: 9px; padding: 8px 12px; border-radius: 8px; background: var(--danger-soft); color: var(--danger); font-size: 13px; }
  .citation-drawer {
    flex: 0 0 var(--drawer);
    width: var(--drawer);
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
  }
  .drawer-closed .citation-drawer { display: none; }
  .drawer-head {
    flex: 0 0 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-head h3 { font-size: 15px; font-weight: 700; }
  .drawer-sub { flex: 0 0 auto; padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .drawer-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }
  .drawer-card { padding: 12px 13px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-soft); cursor: pointer; }
  .drawer-card:hover { border-color: var(--border-strong); }
  .drawer-card.active { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px rgba(20, 108, 96, .1); }
  .dc-title { margin-bottom: 3px; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
  .dc-meta { margin-bottom: 7px; font-size: 12px; color: var(--muted); }
  .dc-snippet {
    max-height: 200px;
    overflow: auto;
    padding: 8px 10px;
    border-left: 3px solid var(--primary);
    border-radius: 0 7px 7px 0;
    background: var(--surface);
    color: #3a4a45;
    font-size: 12.5px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .drawer-empty { padding: 34px 22px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.9; }

  /* ---------- library ---------- */
  .library-page { padding: 16px 18px 18px; }
  .library-page .page-head { align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .library-layout { display: grid; grid-template-columns: clamp(190px, 19vw, 252px) minmax(0, 1fr); gap: 10px; flex: 1; min-height: 0; }
  .library-layout .panel-head { min-height: 49px; gap: 8px; }
  .zone-panel { overflow: hidden; }
  .zone-panel, .docs-panel { display: flex; flex-direction: column; min-width: 0; }
  .zone-list { display: flex; flex-direction: column; gap: 3px; padding: 8px; min-height: 0; overflow: auto; }
  .zone-list > * { flex-shrink: 0; }
  .library-tree-file { display: flex; align-items: center; gap: 6px; min-height: 30px; padding: 4px 7px; border-radius: 6px; text-align: left; color: var(--muted); }
  .library-tree-file:is(:hover, .active) { background: var(--primary-soft); color: var(--primary-dark); }
  .library-tree-files { display: grid; min-width: 0; }
  .library-tree-label { flex: 1; min-width: 0; text-align: left; border-radius: 4px; }
  .library-tree-label .tree-name { display: block; }
  .library-tree-toggle { flex: 0 0 16px; min-height: 26px; color: var(--muted); border-radius: 4px; }
  .library-tree-toggle:hover { background: var(--primary-soft); color: var(--primary-dark); }
  .library-tree-status { display: grid; place-items: center; min-width: 25px; padding: 1px 3px; border-radius: 4px; font-size: 9px; }
  .library-tree-type { font: 9px var(--mono); color: var(--primary-dark); }
  .library-tree-children { min-width: 0; border-left: 1px solid var(--border); margin-left: 12px; padding-left: 5px; }
  .library-drop-target.is-drop-target { outline: 1px dashed var(--primary); background: var(--primary-soft); }
  .zone-item { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 9px; cursor: pointer; }
  .zone-item:hover { background: var(--surface-soft); }
  .zone-item.active { background: var(--primary-soft); }
  .zi-main { flex: 1; min-width: 0; }
  .zi-name { font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zi-meta { font-size: 11.5px; color: var(--muted); }
  .zi-actions { display: none; align-items: center; gap: 1px; flex: 0 0 auto; }
  .zone-item:is(:hover, :focus-within) .zi-actions { display: flex; }
  .zi-actions .icon-btn { width: 26px; height: 26px; font-size: 14px; }
  .tree-branch { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 7px; }

  .kg-shell {

  .kg-doc-tree { min-height: 100%; padding: 10px 12px 18px; background: #101e2c; color: #dbe9f0; }
  .kg-doc-group { margin: 4px 0; border-bottom: 1px solid #1c2d3d; }

  /* ---------- map ---------- */
  body:has(.map-page), .app:has(.map-page) { min-width: 0; }

  .map-side { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .map-list { flex: 1; min-height: 0; overflow: auto; padding: 8px 8px 10px; }
  .map-item { padding: 10px 11px; margin-bottom: 4px; border: 1px solid transparent; border-radius: 9px; cursor: pointer; }
  .map-item:hover { background: var(--surface-soft); }
  .map-item.active { background: var(--primary-soft); border-color: #cfe3dc; }
  .mi-title { font-size: 13px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mi-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 11.5px; color: var(--muted); }

    flex-wrap: wrap;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

  .doc-warn { font-size: 10.5px; color: var(--accent); }

  .map-panel-btn { display: none; }

  .canvas-scroll:focus-visible { outline: 2px solid var(--primary); outline-offset: -3px; }

    width: 176px;

.drawer-head {
  height: 58px;
  flex-basis: 58px;
  background: #fbf6ec;
}
.drawer-sub {
  color: var(--muted);
}
.drawer-list {
  padding: 16px 18px;
}
.drawer-card {
  border-color: var(--border);
  border-radius: 10px;
  background: #fffdf8;
  box-shadow: 0 2px 10px rgba(45, 33, 20, .035);
  transition: border-color .18s var(--ease-out), transform .18s var(--ease-out), box-shadow .18s var(--ease-out);
}
.drawer-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
  box-shadow: 0 7px 18px rgba(45, 33, 20, .06);
}
.drawer-card.active {
  border-color: var(--primary);
  background: #fffdf8;
  box-shadow: 0 0 0 3px rgba(46, 91, 77, .10);
}

/* ---------- knowledge library ---------- */
.library-page {
  background: transparent;
}
.zone-list,
.docs-panel {
  border-color: var(--border);
}
.zone-item,
.tree-node,
.tree-all {
  border-radius: 8px;
  transition: background-color .16s var(--ease-out), color .16s var(--ease-out);
}
.zone-item:hover,
.tree-node:hover,
.tree-all:hover {
  background: #f2eadc;
}
.zone-item.active,
.tree-node.active,
.tree-all.active {
  background: #e6eee5;
}
.zone-item.active .zi-name,
.tree-node.active .tree-name {
  color: var(--primary-dark);
}
.docs-head,
.page-head {
  border-color: var(--border);
}
.docs-title {
  font-weight: 700;
}
.library-view-toggle {
  border-color: var(--border);
  background: #f2eadc;
}
.library-view-toggle button.active {
  background: var(--surface);
  color: var(--primary-dark);
}

/* ---------- constellation graph ---------- */
.kg-shell {
  border: 1px solid #273a31;
  border-radius: 12px;
  background: #0c1512;
  box-shadow: 0 10px 28px rgba(18, 29, 24, .12);
  animation: kgReveal .48s var(--ease-out) both;
}
.kg-field {
  background:
    radial-gradient(ellipse at 38% 44%, rgba(46, 91, 77, .34) 0%, transparent 62%),
    radial-gradient(ellipse at 90% 8%, rgba(164, 101, 53, .13) 0%, transparent 48%),
    #0a110e;
}
.kg-field::before {
  opacity: .18;
  background-image:
    radial-gradient(#a9c8b8 .55px, transparent .8px),
    radial-gradient(#d0b283 .45px, transparent .7px);
  background-size: 53px 41px, 89px 71px;
  background-position: 0 0, 14px 22px;
}
.kg-field::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 48%, rgba(4, 10, 8, .36) 100%);
}
.kg-toolbar {
  border-bottom-color: #26382f;
  background: #101b17;
}
.kg-search {
  border-color: #31483d;
  background: #13211c;
  color: #e2eee7;
}
.kg-search::placeholder {
  color: #8ea79b;
}
.kg-toolbar button,
.kg-filter-menu summary {
  border-color: #31483d;
  background: #15241e;
  color: #c6d8ce;
}
.kg-toolbar button:hover,
.kg-filter-menu summary:hover {
  border-color: #7fa995;
  color: #f2fff8;
}
.kg-toolbar button[aria-pressed="true"] {
  border-color: #6d9e88;
  background: #203b31;
  color: #d8f2e4;
}
.kg-filter-items {
  border-color: #31483d;
  background: #13211c;
  color: #dbe9e1;
  box-shadow: 0 12px 28px rgba(0, 0, 0, .32);
}
.kg-filter-items input {
  accent-color: #8fc0a7;
}
.kg-filter-items select {
  background: #0f1b16;
  border-color: #31483d;
  color: #e3f0e8;
}
.kg-legend {
  border-color: #2d4439;
  background: rgba(11, 20, 16, .86);
  color: #b5cabf;
}
.kg-detail {
  border-left-color: #273a31;
  background: #101b17;
  color: #d9e7df;
}
.kg-detail h3 {
  color: #f2fbf6;
}
.kg-detail .kg-type {
  color: #9ec9b6;
}
.kg-detail p {
  color: #9fb5a9;
}
.kg-detail button,
.kg-empty button {
  border-color: #385849;
  background: #1a3027;
  color: #e1f1e8;
}
.kg-detail button:hover,
.kg-empty button:hover {
  border-color: #8fc0a7;
}
.kg-doc-tree {
  background: #0f1b16;
  color: #d8e7de;
}
.kg-doc-group {
  border-bottom-color: #24372e;
}
.kg-doc-group summary {
  color: #d7e7df;
}
.kg-doc-group summary::before {
  color: #8fc0a7;
}
.kg-doc-name {
  color: #e2eee7;
}
.kg-doc-meta {
  color: #8ea79b;
}
.kg-node {
  transition: opacity .2s var(--ease-out);
}
.kg-node .kg-halo {
  transition: opacity .22s var(--ease-out), transform .22s var(--ease-out);
  transform-box: fill-box;
  transform-origin: center;
}
.kg-node:hover .kg-halo,
.kg-node:focus-visible .kg-halo,
.kg-node.kg-selected .kg-halo {
  opacity: .9;
  transform: scale(1.16);
}
.kg-node-label {
  fill: #dbe9e1;
  stroke: #0a110e;
  transition: fill .18s var(--ease-out);
}
.kg-node-zone .kg-node-label {
  fill: #f0d9a4;
}
.kg-node.kg-pinned .kg-core {
  stroke: #e5c68a;
}
.kg-link-hierarchy {
  stroke: #82b49f;
}
.kg-link-document {
  stroke: #8da9a0;
}
.kg-link-note {
  stroke: #b39acb;
}
.kg-link-mindmap {
  stroke: #d2a06f;
}

/* ---------- notes: keep the notebook world, refine the desk around it ---------- */
.scholar-workspace {
  background:
    radial-gradient(900px 500px at 18% 0%, rgba(255, 252, 242, .7), transparent 64%),
    #eee4d6;
}
.scholar-header {
  border-bottom-color: #d8c8b1;
}
.scholar-header h1 {
  color: #33261f;
}
.scholar-editor {
  background: #fffdf8;
  border-color: #ddcdb8;
  box-shadow: 0 8px 24px rgba(75, 51, 27, .07);
}
.scholar-editor :is(input, textarea, select) {
  background: #fffefa;
  border-color: #d8c7b1;
}
.scholar-editor :is(input, textarea, select):focus-visible {
  outline-color: var(--accent);
}
.scholar-style button[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: #6b4223;
}
.scholar-paper {
  box-shadow: 2px 4px #e1cfa9, 4px 7px #f4e8ca, 9px 15px 30px rgba(71, 51, 25, .15);
}
.scholar-notebook h2 {
  letter-spacing: .01em;
}

/* ---------- assignment ---------- */
.tabs {
  background: #ebe4d7;
}
.tab.active {
  background: var(--surface);
  color: var(--primary-dark);
  box-shadow: 0 2px 8px rgba(45, 33, 20, .07);
}
.quiz-config,
.quiz-question {
  border-color: var(--border);
}
.quiz-question {
  box-shadow: var(--shadow);
}
.formula-display {
  border-left-color: var(--accent);
  background: #f8f1e4;
}

/* ---------- auth / first impression ---------- */
.auth-page {
  background:
    radial-gradient(circle at 12% 12%, rgba(46, 91, 77, .11), transparent 42%),
    radial-gradient(circle at 90% 88%, rgba(164, 101, 53, .09), transparent 42%),
    #f1eadf;
}
.auth-page::before {
  opacity: .22;
  background-image: radial-gradient(#bba98e .8px, transparent .8px);
  background-size: 26px 26px;
}
.auth-shell {
  max-width: 1100px;
  gap: 48px;
  padding-top: 42px;
  padding-bottom: 42px;
  animation: authShellIn .5s var(--ease-out) both;
}
.auth-brand-name {
  font-family: var(--font-display);
  font-size: 22px;
}
.auth-carousel {
  border-color: #d8c9b6;
  border-radius: 18px;
  background: #fffdf8;
  box-shadow: 0 20px 48px rgba(52, 37, 22, .13);
}
.auth-slide img {
  filter: saturate(.82) contrast(1.03) sepia(.04);
}
.auth-slide-copy {
  padding: 22px 26px 0;
}
.auth-slide-copy h2 {
  font-family: var(--font-display);
  color: #25352c;
  font-weight: 700;
  letter-spacing: -.02em;
}
.auth-slide-copy p {
  color: #5c6258;
}
.auth-slide-controls {
  padding: 13px 21px 17px;
}
.auth-slide-track {
  transition: transform .52s var(--ease-out);
}
.auth-slide-dot::after {
  background: #a99a87;
}
.auth-slide-dot[aria-current="true"]::after {
  background: var(--accent);
}
.auth-card {
  border-color: #d8c9b6;
  border-radius: 17px;
  background: rgba(255, 253, 248, .96);
  box-shadow: 0 22px 55px rgba(52, 37, 22, .14);
  animation: authCardIn .56s var(--ease-out) both;
}
.auth-tabs {
  background: #f1e9dc;
}
.auth-tabs button.active {
  background: #fffdf8;
  color: var(--primary-dark);
}
.auth-form-title {
  font-family: var(--font-display);
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -.015em;
}
.auth-form-sub {
  color: var(--muted);
}
.auth-field > span {
  color: #625b50;
}
.auth-field input {
  min-height: 44px;
  border-color: var(--border-strong);
  background: #fffefa;
}
.auth-submit {
  min-height: 46px;
  border-radius: 9px;
  background: var(--primary);
  box-shadow: 0 6px 18px rgba(45, 33, 20, .16);
}
.auth-submit:hover {
  background: var(--primary-dark);
  filter: none;
}
.auth-switch,
.auth-demo-tip {
  color: var(--muted);
}
.auth-demo-tip {
  border-top-color: var(--border);
}

/* ---------- dialogs, toasts, motion ---------- */
.modal-mask {
  background: rgba(25, 28, 23, .40);
  backdrop-filter: blur(3px);
  animation: veilIn .2s ease-out both;
}
.modal {
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: 0 26px 70px rgba(35, 25, 15, .24);
  animation: modalIn .24s var(--ease-out) both;
}
.modal-head,
.modal-foot {
  border-color: var(--border);
}
.toast {
  background: #1f3f35;
  border: 1px solid rgba(255, 253, 248, .12);
}
.toast.ok {
  background: var(--primary-dark);
}
.toast.error {
  background: var(--danger);
}
.toast.out {
  opacity: 0;
  transform: translateY(6px);
}

.view {
  animation: viewIn .26s var(--ease-out) both;
}
.kg-shell {
  animation-name: kgReveal;
}
.citation-drawer {
  animation: drawerIn .24s var(--ease-out) both;
}

@keyframes viewIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes authShellIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes authCardIn {
  from { opacity: 0; transform: translateY(12px) scale(.995); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes kgReveal {
  from { opacity: 0; transform: scale(.994); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes drawerIn {
  from { opacity: 0; transform: translateX(8px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes veilIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(8px) scale(.995); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .view,
  .auth-shell,
  .auth-card,
  .kg-shell,
  .citation-drawer,
  .modal,
  .modal-mask {
    animation: none !important;
  }
}

@media (max-width: 900px) {
  .topbar {
    padding-inline: 14px;
  }
  .page {
    padding: 20px 18px 30px;
  }
  .msg-list {
    padding: 18px 16px 10px;
  }
  .composer {
    padding-inline: 16px;
  }
}

</style>
</head>

/* =========================================================

function $(selector, root) { return (root || document).querySelector(selector); }
function $$(selector, root) { return Array.prototype.slice.call((root || document).querySelectorAll(selector)); }

function esc(value) {
  return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (ch) {
    if (ch === '&') return '&amp;';
    if (ch === '<') return '&lt;';
    if (ch === '>') return '&gt;';
    if (ch === '"') return '&quot;';
    return '&#39;';
  });
}

function fmtCell(value) {
  if (value === null || value === undefined || value === '') return '';
  if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);
  try { return JSON.stringify(value); } catch (err) { return String(value); }
}

function toInt(value) {
  var num = Number(value);
  return isFinite(num) ? Math.trunc(num) : 0;
}

function fmtBytes(size) {
  var num = Number(size);
  if (!isFinite(num) || num <= 0) return '0 B';
  if (num < 1024) return num + ' B';
  if (num < 1024 * 1024) return (num / 1024).toFixed(1) + ' KB';
  return (num / (1024 * 1024)).toFixed(1) + ' MB';
}

function fmtTime(iso) {
  if (!iso) return '';
  var date = new Date(iso);
  if (isNaN(date.getTime())) return String(iso);
  function pad(num) { return num < 10 ? '0' + num : String(num); }
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
    + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
}

function extLabel(ext) {
  return String(ext || '').replace(/^\./, '').toUpperCase();
}

function docStatusInfo(status) {
  return DOC_STATUS[status] || { label: status || '未知', cls: 'badge-muted' };
}

function qualityInfo(doc) {
  var raw = doc ? doc.quality : null;
  if (raw === null || raw === undefined || raw === '') {
    return { label: '未评分', cls: 'badge-muted', title: '尚未评分', scoreText: '' };
  }
  var score = Number(raw);
  if (!isFinite(score)) {
    return { label: '未评分', cls: 'badge-muted', title: '尚未评分', scoreText: '' };
  }
  var label = score >= 0.85 ? '正常' : (score >= 0.6 ? '有噪声' : '低质量');
  var cls = score >= 0.85 ? 'badge-ok' : (score >= 0.6 ? 'badge-warn' : 'badge-fail');
  var title = (doc && doc.quality_note) ? doc.quality_note : ('质量分 ' + score.toFixed(3));
  return { label: label, cls: cls, title: title, scoreText: label + ' · ' + score.toFixed(3) };
}

function msgStatusCls(status) {
  if (status === 'answered') return 'badge-ok';
  if (status === 'partial') return 'badge-warn';
  if (status === 'insufficient_evidence') return 'badge-fail';
  if (status === 'error') return 'badge-fail';
  return 'badge-muted';
}

function zoneById(zoneId) {

}

function nodeById(nodeId) {
  if (!nodeId) return null;
  for (var i = 0; i < state.knowledgeNodes.length; i += 1) {
    if (state.knowledgeNodes[i].id === nodeId) return state.knowledgeNodes[i];
  }
  return null;
}

function nodesForZone(zoneId) {
  return state.knowledgeNodes.filter(function (node) {
    return node.zone_id === zoneId;
  }).sort(function (a, b) {
    return String(a.path || a.name).localeCompare(String(b.path || b.name), 'zh-CN');
  });
}

function childNodes(zoneId, parentId) {
  return state.knowledgeNodes.filter(function (node) {
    return node.zone_id === zoneId && (node.parent_id || null) === (parentId || null);
  }).sort(function (a, b) {
    return (toInt(a.sort_order) - toInt(b.sort_order)) || String(a.name).localeCompare(String(b.name), 'zh-CN');
  });
}

function nodeDepth(node) {
  var depth = 0;
  var current = node;
  var guard = 0;
  while (current && current.parent_id && guard < 100) {
    current = nodeById(current.parent_id);
    depth += 1;
    guard += 1;
  }
  return depth;
}

function nodeSubtreeDocCount(nodeId) {
  var node = nodeById(nodeId);
  if (!node) return 0;
  var count = toInt(node.doc_count);
  state.knowledgeNodes.forEach(function (candidate) {
    if (candidate.parent_id === nodeId) count += nodeSubtreeDocCount(candidate.id);
  });
  return count;
}

function nodeOptionsHtml(zoneId, selectedId, includeAll, allLabel) {
  var html = includeAll
    ? '<option value="">' + esc(allLabel || '整个知识区') + '</option>'
    : '<option value="">未分类</option>';
  nodesForZone(zoneId).forEach(function (node) {
    html += '<option value="' + esc(node.id) + '"'
      + (node.id === selectedId ? ' selected' : '') + '>'
      + esc((node.path || node.name)) + '</option>';
  });
  return html;
}

function libraryScopeText() {
  var zone = zoneById(state.libraryZoneId);
  var node = nodeById(state.libraryNodeId);
  if (!zone) return '';
  return node ? zone.name + ' / ' + (node.path || node.name) : zone.name;
}

function findDocName(documentId) {
  if (!documentId) return '';
  var pools = [state.mapDocs, state.libraryDocs];
  for (var p = 0; p < pools.length; p += 1) {
    var pool = pools[p] || [];
    for (var i = 0; i < pool.length; i += 1) {
      if (pool[i].id === documentId) return pool[i].filename || '';
    }
  }
  return '';
}

function fillFixed(template, value) {
  return template.split('{错误信息}').join(value === null || value === undefined ? '未知错误' : String(value));
}

function exportUrl(path) {
  if (!path) return '';
  var text = String(path);
  if (text.indexOf('/exports/') === 0) return text;
  var parts = text.split(/[\\/]/);
  var base = parts[parts.length - 1];
  return base ? '/exports/' + encodeURIComponent(base) : '';
}

function currentChatZone() {
  if (state.currentConversation) {
    return zoneById(state.currentConversation.zone_id);
  }
  return zoneById(state.currentZoneId);
}

function syncCurrentZone(zoneId) {
  if (!zoneId) return;
  if (state.currentZoneId !== zoneId) {
    state.currentZoneId = zoneId;
    renderShell();
  }
}

function lastAssistantMessage() {
  for (var i = state.messages.length - 1; i >= 0; i -= 1) {
    if (state.messages[i] && state.messages[i].role === 'assistant') return state.messages[i];
  }
  return null;
}

/* =========================================================
 * api
 * ========================================================= */
function makeError(code, message) {
  var err = new Error(message);
  err.code = code;
  return err;
}

async function api(path, options) {
  options = options || {};
  var init = { method: options.method || 'GET', headers: {} };
  if (options.json !== undefined) {
    init.headers['Content-Type'] = 'application/json; charset=utf-8';
    init.body = JSON.stringify(options.json);
  }
  if (options.form) {
    init.body = options.form;
  }
  var resp;
  try {
    resp = await fetch(API_BASE + path, init);
  } catch (err) {
    throw makeError('network_error', '无法连接服务，请确认后端已启动。');
  }
  if (resp.ok && options.onRetrieved) return readChatResponse(resp, options.onRetrieved);
  var text = '';
  try { text = await resp.text(); } catch (err) { text = ''; }
  var data = null;
  if (text) {
    try { data = JSON.parse(text); } catch (err) { data = null; }
  }
  if (!resp.ok) {
    var info = data && data.error ? data.error : {};
    if (resp.status === 401 && activeAuthMode === 'supabase' && !path.startsWith('/auth/')) {
      window.location.reload();
    }
    throw makeError(info.code || ('http_' + resp.status), info.message || ('HTTP ' + resp.status));
  }
  if (resp.status === 204) return null;
  if (data === null) throw makeError('invalid_response', '服务返回了无法解析的响应。');
  return data;
}

async function readChatResponse(response, onRetrieved) {
  var reader = response.body.getReader();
  var decoder = new TextDecoder();
  var remaining = '';
  try {
    while (true) {
      var part = await reader.read();
      remaining += decoder.decode(part.value, { stream: !part.done });
      var lines = remaining.split('\n');
      remaining = lines.pop();
      for (var i = 0; i < lines.length; i += 1) {
        if (!lines[i]) continue;
        var event = JSON.parse(lines[i]);
        if (event.type === 'retrieved') onRetrieved(event.message);
        if (event.type === 'answer') return event.result;
        if (event.type === 'error') throw makeError(event.error.code, event.error.message);
      }
      if (part.done) break;
    }
    throw makeError('invalid_response', '问答连接提前结束。');
  } finally {
    reader.releaseLock();
  }
}

function apiGet(path) { return api(path); }
function apiPost(path, json) { return api(path, { method: 'POST', json: json === undefined ? {} : json }); }
function apiPut(path, json) { return api(path, { method: 'PUT', json: json }); }
function apiPatch(path, json) { return api(path, { method: 'PATCH', json: json }); }
function apiDelete(path) { return api(path, { method: 'DELETE' }); }
function apiForm(path, form) { return api(path, { method: 'POST', form: form }); }

function failMessage(err) {
  var code = err && err.code;
  if (code === 'model_not_configured') return FIXED.noModel;
  if (code === 'pdf_engine_unavailable') return FIXED.pdfUnavailable;
  var msg = err && err.message ? err.message : '未知错误';
  return fillFixed(FIXED.fail, msg);
}

function loadUiState() {
  try {
    var raw = window.localStorage.getItem(UI_STORE_KEY);
    if (!raw) return;
    var data = JSON.parse(raw);
    if (data && VIEWS.indexOf(data.view) >= 0) state.view = data.view;
    if (data && typeof data.drawerOpen === 'boolean') state.drawerOpen = data.drawerOpen;
  } catch (err) { /* ignore corrupt store */ }
}

function saveUiState() {
  try {
    window.localStorage.setItem(UI_STORE_KEY, JSON.stringify({ view: state.view, drawerOpen: state.drawerOpen }));
  } catch (err) { /* ignore quota */ }
}

function toast(message, kind) {
  var root = $('#toastRoot');
  if (!root) return;
  var node = document.createElement('div');
  node.className = 'toast' + (kind ? ' ' + kind : '');
  node.textContent = message;
  root.appendChild(node);
  window.setTimeout(function () { node.classList.add('out'); }, 2800);
  window.setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 3200);
}

function closeMask(mask) {
  if (mask && mask.parentNode) mask.parentNode.removeChild(mask);
}

function openMask(html) {
  var mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = html;
  var root = $('#modalRoot');
  if (root) root.appendChild(mask);
  return mask;
}

function confirmDialog(message, options) {
  options = options || {};
  return new Promise(function (resolve) {
    var mask = openMask(
      '<div class="modal modal-sm">'
      + '<div class="modal-head"><h3>' + esc(options.title || '确认删除') + '</h3>'
      + '<button type="button" class="icon-btn" data-mask-close="1">×</button></div>'
      + '<div class="modal-body"><p class="confirm-text">' + esc(message) + '</p></div>'
      + '<div class="modal-foot">'
      + '<button type="button" class="btn btn-outline" data-mask-close="1">取消</button>'
      + '<button type="button" class="btn ' + (options.danger === false ? 'btn-primary' : 'btn-danger') + '" data-mask-ok="1">'
      + esc(options.okText || '删除') + '</button>'
      + '</div></div>'
    );
    function done(value) {
      closeMask(mask);
      resolve(value);
    }
    mask.addEventListener('click', function (ev) {
      if (ev.target === mask) { done(false); return; }
      var closeBtn = ev.target.closest('[data-mask-close]');
      if (closeBtn) { done(false); return; }
      if (ev.target.closest('[data-mask-ok]')) done(true);
    });
  });
}

function renderShell() {
  var zone = zoneById(state.currentZoneId);
  var topLabel = zone ? zone.name : '未选择知识区';
  if (state.view === 'chat' && state.currentConversation) {
    var chatNode = nodeById(state.currentConversation.node_id);
    if (chatNode && zone) topLabel += ' / ' + (chatNode.path || chatNode.name);
  }
  var topZone = $('#topZone');
  if (topZone) {
    topZone.textContent = topLabel;
    topZone.title = topLabel ? '当前检索范围：' + topLabel : '当前知识区未选择';
  }
  var configured = !!(state.health && state.health.model_configured);
  var modelState = $('#modelState');
  if (modelState) {
    modelState.textContent = configured ? '模型：已配置' : '模型：未配置';
    modelState.className = 'model-state ' + (configured ? 'ok' : 'off');
  }
  $$('#sideNav [data-view]').forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-view') === state.view);
  });
  renderSidebar();
}

function renderSidebar() {
  var box = $('#convList');
  if (!box) return;
  if (!state.conversations.length) {
    box.innerHTML = '<div class="side-empty">' + esc(state.zones.length ? FIXED.noConv : FIXED.noZone) + '</div>';
    return;
  }
  box.innerHTML = state.conversations.map(function (conv) {
    var zone = zoneById(conv.zone_id);
    var node = nodeById(conv.node_id);
    var scopeLabel = zone ? zone.name : '知识区已删除';
    if (node) scopeLabel += ' / ' + (node.path || node.name);
    return '<div class="conv-item' + (conv.id === state.currentConversationId ? ' active' : '') + '" data-conv-id="' + esc(conv.id) + '" role="button" tabindex="0">'
      + '<div class="conv-main">'
      + '<div class="conv-title">' + esc(conv.title || '新会话') + '</div>'
      + '<div class="conv-meta">' + esc(scopeLabel) + ' · ' + toInt(conv.message_count) + ' 条消息</div>'
      + '</div>'
      + '<button type="button" class="conv-del" data-conv-del="' + esc(conv.id) + '" title="删除会话">×</button>'
      + '</div>';
  }).join('');
}
