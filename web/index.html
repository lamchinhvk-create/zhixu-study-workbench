var scholar = {
  note: null, list: [], listLoaded: false, listRevision: 0, loading: false,
  busy: '', error: '', status: '', dirty: false, page: 0, resetVersion: 0,
  recording: false, recognition: null, stopRequested: false, restarts: 0,
  transcript: '', interim: '', transcriptInserted: 0, speechError: '',
  recap: null, recapBusy: false, recapError: '', stopInsert: false, recapInserted: false
};

function newScholarNote() {
  var conversation = state.currentConversation;
  return {
    id: null, title: '', body: '', style: 'paper', sources: [],
    zone_id: conversation ? conversation.zone_id : null,
    node_id: conversation ? conversation.node_id : null
  };
}

function scholarSections(body) {
  var sections = [];
  var current = { title: '', lines: [] };
  var inCode = false;
  String(body || '').replace(/\r\n?/g, '\n').split('\n').forEach(function (line) {
    var heading = !inCode && /^#{1,3}\s+(.+)$/.exec(line);
    if (heading) {
      if (current.title || current.lines.some(function (part) { return part.trim(); })) sections.push(current);
      current = { title: heading[1].trim(), lines: [] };
    } else {
      current.lines.push(line);
      if (/^\s*\x60{3}/.test(line)) inCode = !inCode;
    }
  });
  if (current.title || current.lines.some(function (line) { return line.trim(); })) sections.push(current);
  return sections;
}

function scholarInline(line) {
  return String(line).split(/(\x60[^\x60\n]+\x60|\*\*[^*\n]+\*\*)/).map(function (part, index) {
    if (index % 2 === 0) return esc(part);
    if (part.startsWith('**')) return '<mark>' + esc(part.slice(2, -2)) + '</mark>';
    return '<code>' + esc(part.slice(1, -1)) + '</code>';
  }).join('');
}

function scholarBlocks(lines) {
  var markup = '';
  var index = 0;
  while (index < lines.length) {
    var line = lines[index++];
    if (!line.trim()) continue;
    if (/^\s*\x60{3}/.test(line)) {
      var code = [];
      while (index < lines.length && !/^\s*\x60{3}/.test(lines[index])) code.push(lines[index++]);
      if (index < lines.length) index += 1;
      markup += '<pre>' + esc(code.join('\n')) + '</pre>';
      continue;
    }
    var bullet = /^\s*[-*]\s+/;
    var number = /^\s*\d+[.)]\s+/;
    var prefix = bullet.test(line) ? bullet : (number.test(line) ? number : null);
    if (prefix) {
      var tag = prefix === bullet ? 'ul' : 'ol';
      var items = [line];
      while (index < lines.length && prefix.test(lines[index])) items.push(lines[index++]);
      markup += '<' + tag + '>' + items.map(function (item) {
        return '<li>' + scholarInline(item.replace(prefix, '')) + '</li>';
      }).join('') + '</' + tag + '>';
    } else if (/^\s*>\s?/.test(line)) {
      var quote = [line];
      while (index < lines.length && /^\s*>\s?/.test(lines[index])) quote.push(lines[index++]);
      markup += '<blockquote>' + quote.map(function (item) {
        return scholarInline(item.replace(/^\s*>\s?/, ''));
      }).join('<br>') + '</blockquote>';
    } else {
      markup += '<p>' + scholarInline(line) + '</p>';
    }
  }
  return markup;
}

function scholarSectionHtml(section) {
  return '<section class="scholar-section">' + (section.title ? '<h2>' + scholarInline(section.title) + '</h2>' : '')
    + scholarBlocks(section.lines) + '</section>';
}

function scholarSourceHtml(sources) {
  if (!Array.isArray(sources) || !sources.length) return '';
  return '<section class="scholar-sources"><h2>参考资料</h2><ul>' + sources.map(function (source) {
    var locator = source.page ? (source.ext === '.pptx' ? ' · 幻灯片 ' + source.page : ' · 第 ' + source.page + ' 页') : '';
    return '<li>' + esc(source.filename + locator) + '</li>';
  }).join('') + '</ul></section>';
}

function scholarBookHtml(note, editable) {
  var title = esc(note.title.trim() || '未命名笔记');
  var zone = zoneById(note.zone_id);
  var node = nodeById(note.node_id);
  var scope = zone ? '<p class="scholar-scope">' + esc(zone.name + (node ? ' / ' + (node.path || node.name) : '')) + '</p>' : '';
  var body = scholarSections(note.body).map(scholarSectionHtml);
  var sources = scholarSourceHtml(note.sources);
  var editAttrs = editable
    ? ' contenteditable="true" data-scholar-body="true" role="textbox" aria-multiline="true" spellcheck="true" aria-label="可编辑笔记正文"'
    : '';
  if (!body.length) body = [editable ? '<p><br></p>' : '<p class="scholar-blank">笔记正文会显示在这里。</p>'];
  if (note.style !== 'journal') {
    return '<article class="scholar-notebook scholar-paper"><header><h1>' + title + '</h1>' + scope + '</header>'
      + '<div class="scholar-editable"' + editAttrs + '>' + body.join('') + '</div>' + sources + '</article>';
  }
  var cover = '<section class="scholar-leaf scholar-cover" data-scholar-leaf><div class="scholar-leaf-content"><h1>' + title + '</h1>'
    + scope + '</div></section>';
  if (sources) body.push(sources);
  return '<article class="scholar-notebook scholar-journal" aria-label="手账皮革本" tabindex="0">'
    + '<div class="scholar-rings" aria-hidden="true">' + '<i></i>'.repeat(6) + '</div>' + cover
    + body.map(function (section) {
      return '<section class="scholar-leaf" data-scholar-leaf hidden><div class="scholar-leaf-content"' + editAttrs + '>' + section + '</div></section>';
    }).join('')
    + '<nav class="scholar-journal-controls" aria-label="笔记翻页" contenteditable="false"><button type="button" data-scholar-turn="-1" disabled>上一页</button>'
    + '<span data-scholar-count aria-live="polite"></span><button type="button" data-scholar-turn="1">下一页</button></nav></article>';
}

function bindScholarJournal(book, initial, onPage) {
  if (!book) return;
  var pages = Array.from(book.querySelectorAll('[data-scholar-leaf]'));
  var previous = book.querySelector('[data-scholar-turn="-1"]');
  var next = book.querySelector('[data-scholar-turn="1"]');
  var counter = book.querySelector('[data-scholar-count]');
  var current = 0;
  function show(page, animate) {
    var target = Math.max(0, Math.min(pages.length - 1, page));
    pages.forEach(function (leaf, index) {
      leaf.hidden = index !== target;
      leaf.classList.toggle('scholar-turn', animate && index === target && current !== target);
    });
    current = target;
    previous.disabled = current === 0;
    next.disabled = current === pages.length - 1;
    counter.textContent = (current === 0 ? '封面' : '第 ' + current + ' 页') + ' / ' + (pages.length - 1) + ' 页';
    if (onPage) onPage(current);
  }
  book.addEventListener('click', function (event) {
    var button = event.target.closest('[data-scholar-turn]');
    if (button) show(current + Number(button.dataset.scholarTurn), true);
  });
  book.addEventListener('keydown', function (event) {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    show(current + (event.key === 'ArrowRight' ? 1 : -1), true);
  });
  show(initial || 0, false);
}

function scholarInlineMarkdown(node) {
  if (!node) return '';
  if (node.nodeType === 3) return String(node.nodeValue || '').replace(/\u00a0/g, ' ');
  if (node.nodeName === 'BR') return '\n';
  var text = Array.prototype.map.call(node.childNodes, scholarInlineMarkdown).join('');
  if (node.nodeName === 'MARK') return '**' + text + '**';
  if (node.nodeName === 'CODE') return '\x60' + text + '\x60';
  return text;
}

function scholarEditableContainerMarkdown(container) {
  var sections = Array.prototype.slice.call(container.querySelectorAll('.scholar-section'));
  if (!sections.length) return String(container.innerText || '').trim();
  var lines = [];
  sections.forEach(function (section) {
    var heading = section.querySelector(':scope > h2');
    if (heading) lines.push('## ' + String(heading.innerText || '').trim());
    Array.prototype.forEach.call(section.children, function (block) {
      if (block.nodeName === 'H2') return;
      if (block.nodeName === 'UL' || block.nodeName === 'OL') {
        Array.prototype.forEach.call(block.querySelectorAll(':scope > li'), function (item, index) {
          var prefix = block.nodeName === 'OL' ? (index + 1) + '. ' : '- ';
          lines.push(prefix + scholarInlineMarkdown(item).trim());
        });
      } else if (block.nodeName === 'BLOCKQUOTE') {
        lines.push('> ' + scholarInlineMarkdown(block).trim());
      } else if (block.nodeName === 'PRE') {
        lines.push('\x60\x60\x60\n' + String(block.innerText || '').trim() + '\n\x60\x60\x60');
      } else {
        var line = scholarInlineMarkdown(block).trim();
        if (line) lines.push(line);
      }
    });
  });
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function scholarEditableMarkdown(preview) {
  if (!preview) return '';
  return Array.prototype.map.call(preview.querySelectorAll('[data-scholar-body]'), function (container) {
    return scholarEditableContainerMarkdown(container);
  }).filter(Boolean).join('\n\n');
}

function syncScholarEditable(preview) {
  if (!preview || !preview.isConnected || !scholar.note) return;
  var body = scholarEditableMarkdown(preview);
  scholar.note.body = body;
  scholar.dirty = true;
  scholar.status = '';
  scholar.error = '';
  var textarea = $('#scholar-body');
  if (textarea) textarea.value = body;
  renderScholarStatus();
}

function bindScholarEditable(preview) {
  if (!preview) return;
  var timer = null;
  function scheduleSync() {
    clearTimeout(timer);
    timer = setTimeout(function () { syncScholarEditable(preview); }, 350);
  }
  preview.addEventListener('input', function (event) {
    if (event.target.closest && event.target.closest('[data-scholar-body]')) scheduleSync();
  });
  preview.addEventListener('focusout', function (event) {
    if (event.target.closest && event.target.closest('[data-scholar-body]')) {
      clearTimeout(timer);
      syncScholarEditable(preview);
    }
  });
}

function renderScholarPreview() {
  var preview = $('#scholar-preview');
  if (!preview) return;
  preview.innerHTML = scholarBookHtml(scholar.note, true);
  bindScholarJournal(preview.querySelector('.scholar-journal'), scholar.page, function (page) { scholar.page = page; });
  bindScholarEditable(preview);
}

function loadScholarList() {
  if (scholar.loading || scholar.listLoaded) return;
  var revision = scholar.listRevision;
  scholar.loading = true;
  apiGet('/notes').then(function (list) {
    if (scholar.listRevision !== revision) return;
    scholar.list = list;
    scholar.listLoaded = true;
  }).catch(function (err) {
    if (scholar.listRevision === revision) scholar.error = failMessage(err);
  }).finally(function () {
    scholar.loading = false;
    if (state.view === 'notes') {
      renderScholarSavedList();
      renderScholarStatus();
    }
    if (scholar.listRevision !== revision) loadScholarList();
  });
}

function renderScholarNotes() {
  if (!scholar.note) scholar.note = newScholarNote();
  drawScholarNotes();
  loadScholarList();
}

function scholarSpeechSupported() {
  return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
}

function scholarRecapHtml() {
  var recap = scholar.recap;
  if (!recap) return '';
  function list(title, items) {
    if (!items || !items.length) return '';
    return '<h4>' + esc(title) + '</h4><ul>' + items.map(function (item) {
      return '<li>' + esc(item) + '</li>';
    }).join('') + '</ul>';
  }
  var sections = '';
  (recap.sections || []).forEach(function (section, index) {
    sections += '<div class="scholar-recap-section"><h4>' + (index + 1) + '. ' + esc(section.title) + '</h4>'
      + '<p>' + esc(section.summary) + '</p>'
      + list('关键要点', section.key_points) + '</div>';
  });
  return '<div class="scholar-recap"><h3>整课回忆摘要</h3><p>' + esc(recap.overview) + '</p>'
    + sections + list('复习与行动', recap.action_items)
    + list('待确认问题', recap.questions)
    + '<div class="scholar-recap-actions"><button type="button" id="scholarInsertRecapBtn"'
    + (scholar.recapInserted ? ' disabled' : '') + '>'
    + (scholar.recapInserted ? '已写入右侧笔记' : '插入右侧笔记') + '</button>'
    + '<button type="button" id="scholarClearRecapBtn">清除摘要</button></div></div>';
}

function scholarLiveInnerHtml() {
  var supported = scholarSpeechSupported();
  var hasTranscript = scholar.transcript.trim().length > 0;
  var canSummarize = scholar.transcript.trim().length >= 10;
  var status = scholar.speechError || scholar.recapError
    || (scholar.recording ? '正在聆听课堂讲解，转写会自动分段。' : '')
    || (!supported ? '当前浏览器不支持语音识别，请使用 Chrome / Edge，或手动粘贴录音转写。' : '');
  var button = scholar.recording
    ? '<button type="button" id="scholarRecordBtn" class="primary">结束录音</button>'
    : '<button type="button" id="scholarRecordBtn" class="primary"' + (supported ? '' : ' disabled') + '>开始录音</button>';
  return '<div class="scholar-live-head"><span class="scholar-live-title"><i class="scholar-live-dot'
    + (scholar.recording ? ' recording' : '') + '"></i>课堂录音转写</span>'
    + '<div class="scholar-live-actions">' + button
    + '<button type="button" id="scholarSummaryBtn"' + ((!canSummarize || scholar.recapBusy) ? ' disabled' : '') + '>'
    + (scholar.recapBusy ? '正在生成摘要…' : 'AI 回忆摘要') + '</button></div></div>'
    + '<p class="scholar-live-status' + ((scholar.speechError || scholar.recapError) ? ' error' : '') + '" role="status">'
    + esc(status) + '</p>'
    + '<div class="scholar-transcript" aria-live="polite">' + esc(scholar.transcript)
    + (scholar.interim ? '<span class="interim">' + esc(scholar.interim) + '</span>' : '') + '</div>'
    + '<div class="scholar-transcript-actions"><button type="button" id="scholarInsertTranscriptBtn"'
    + (hasTranscript ? '' : ' disabled') + '>写入笔记正文</button></div>'
    + scholarRecapHtml();
}

function renderScholarLive() {
  var card = $('#scholar-live-card');
  if (card) card.innerHTML = scholarLiveInnerHtml();
}

function scholarAppendTranscript(text) {
  var clean = String(text || '').trim();
  if (!clean) return;
  scholar.transcript = scholar.transcript ? scholar.transcript + '\n' + clean : clean;
  scholar.interim = '';
  scholar.recap = null;
  scholar.recapError = '';
  renderScholarLive();
}

function scholarStartRecording() {
  var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) {
    scholar.speechError = '当前浏览器不支持实时语音识别，请使用 Chrome / Edge。';
    renderScholarLive();
    return;
  }
  if (scholar.transcript && scholar.transcriptInserted < scholar.transcript.length
      && !window.confirm('上一段转写还未写入笔记，开始新录音会清空当前转写。继续？')) return;
  scholar.transcript = '';
  scholar.interim = '';
  scholar.transcriptInserted = 0;
  scholar.recap = null;
  scholar.recapError = '';
  scholar.recapInserted = false;
  scholar.speechError = '';
  scholar.recording = true;
  scholar.stopRequested = false;
  scholar.stopInsert = false;
  scholar.restarts = 0;
  var recognition = new Ctor();
  scholar.recognition = recognition;
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = function (event) {
    var interim = '';
    var finalText = '';
    for (var i = event.resultIndex; i < event.results.length; i += 1) {
      var item = event.results[i];
      var text = item[0] ? item[0].transcript : '';
      if (item.isFinal) finalText += text;
      else interim += text;
    }
    if (finalText.trim()) scholarAppendTranscript(finalText);
    scholar.interim = interim.trim();
    renderScholarLive();
  };
  recognition.onerror = function (event) {
    var messages = {
      'not-allowed': '麦克风权限被拒绝，请在浏览器地址栏允许麦克风。',
      'audio-capture': '没有检测到可用的麦克风。',
      'network': '无法连接浏览器在线语音服务。Chrome 通常使用 Google 语音服务，国内网络常被阻断；这不是麦克风故障。可改用 Microsoft Edge，或配置本地/云端语音识别。',
      'service-not-allowed': '浏览器或网络策略禁止在线语音服务。请改用 Microsoft Edge，或配置本地/云端语音识别。'
    };
    scholar.speechError = messages[event.error] || ('语音识别失败：' + (event.error || '未知错误'));
    scholar.recording = false;
    scholar.stopInsert = false;
    renderScholarLive();
  };
  recognition.onend = function () {
    if (scholar.recording && !scholar.stopRequested && scholar.restarts < 3) {
      scholar.restarts += 1;
      setTimeout(function () {
        if (!scholar.recording) return;
        try { recognition.start(); } catch (err) { scholar.recording = false; renderScholarLive(); }
      }, 350);
      return;
    }
    var insert = scholar.stopInsert;
    scholar.recording = false;
    scholar.recognition = null;
    scholar.stopRequested = false;
    scholar.stopInsert = false;
    if (insert) scholarInsertTranscript(true);
    renderScholarLive();
  };
  try {
    recognition.start();
  } catch (err) {
    scholar.recording = false;
    scholar.recognition = null;
    scholar.speechError = '无法启动麦克风：' + (err && err.message ? err.message : '未知错误');
    renderScholarLive();
    return;
  }
  scholar.status = '';
  renderScholarLive();
}

function scholarStopRecording(insert) {
  scholar.stopRequested = true;
  scholar.stopInsert = Boolean(insert);
  scholar.recording = false;
  if (scholar.recognition) {
    try { scholar.recognition.stop(); } catch (err) { /* 已在结束时清理 */ }
  } else if (scholar.stopInsert) {
    scholarInsertTranscript(true);
    scholar.stopInsert = false;
  }
  renderScholarLive();
}

function scholarInsertTranscript(auto) {
  var text = scholar.transcript.trim();
  if (!text) {
    if (!auto) toast('还没有可写入的课堂转写。', 'error');
    return;
  }
  if (auto && scholar.transcriptInserted >= text.length) return;
  var stamp = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  var block = '## 课堂转写 · ' + stamp + '\n\n' + text;
  scholar.note.body = scholar.note.body.trim() ? scholar.note.body.trim() + '\n\n' + block : block;
  scholar.transcriptInserted = text.length;
  var textarea = $('#scholar-body');
  if (textarea) textarea.value = scholar.note.body;
  markScholarChanged();
  scholar.status = '课堂转写已写入正文，可直接编辑。';
  renderScholarStatus();
}

function scholarRecapMarkdown(recap) {
  var lines = ['## 整课回忆摘要', '', recap.overview];
  (recap.sections || []).forEach(function (section, index) {
    lines.push('', '### ' + (index + 1) + '. ' + section.title, '', section.summary);
    (section.key_points || []).forEach(function (item) { lines.push('- ' + item); });
  });
  function add(title, items) {
    if (!items || !items.length) return;
    lines.push('', '### ' + title, '');
    items.forEach(function (item) { lines.push('- ' + item); });
  }
  add('复习与行动', recap.action_items);
  add('待确认问题', recap.questions);
  return lines.join('\n');
}

function scholarSummarize() {
  if (scholar.recapBusy) return;
  if (scholar.transcript.trim().length < 10) {
    scholar.recapError = '录音转写过短，暂时无法生成摘要。';
    renderScholarLive();
    return;
  }
  scholar.recapBusy = true;
  var resetVersion = scholar.resetVersion;
  scholar.recapError = '';
  renderScholarLive();
  apiPost('/notes/summarize', {
    title: scholar.note.title,
    transcript: scholar.transcript,
    zone_id: scholar.note.zone_id,
    node_id: scholar.note.node_id
  }).then(function (recap) {
    if (scholar.resetVersion !== resetVersion) return;
    scholar.recap = recap;
    if (!scholar.recapInserted) scholarInsertRecap(true);
  }).catch(function (err) {
    if (scholar.resetVersion === resetVersion) scholar.recapError = failMessage(err);
  }).finally(function () {
    if (scholar.resetVersion !== resetVersion) return;
    scholar.recapBusy = false;
    renderScholarLive();
  });
}

function scholarInsertRecap(auto) {
  if (!scholar.recap || (auto && scholar.recapInserted)) return;
  var block = scholarRecapMarkdown(scholar.recap);
  scholar.note.body = scholar.note.body.trim() ? scholar.note.body.trim() + '\n\n' + block : block;
  var textarea = $('#scholar-body');
  if (textarea) textarea.value = scholar.note.body;
  scholar.recapInserted = true;
  markScholarChanged();
  scholar.status = auto
    ? '整课摘要已自动写入右侧笔记，共 ' + (scholar.recap.sections || []).length + ' 节，可继续编辑。'
    : '整课摘要已插入右侧笔记，可继续编辑。';
  renderScholarStatus();
}

function drawScholarNotes() {
  var note = scholar.note;
  var disabled = scholar.busy ? ' disabled' : '';
  var zones = ['<option value="">不绑定知识区</option>'].concat(state.zones.map(function (zone) {
    return '<option value="' + esc(zone.id) + '"' + (note.zone_id === zone.id ? ' selected' : '') + '>' + esc(zone.name) + '</option>';
  })).join('');
  var options = [['paper', '横线笔记本'], ['journal', '手账皮革本']].map(function (style) {
    return '<button type="button" data-scholar-style="' + style[0] + '" aria-pressed="' + (note.style === style[0])
      + '"' + disabled + '>' + style[1] + '</button>';
  }).join('');
  $('#main').innerHTML = '<section class="scholar-workspace"><header class="scholar-header"><h1>学霸笔记</h1>'
    + '<div class="scholar-header-actions"><button type="button" id="scholar-new" class="btn btn-outline btn-sm"' + disabled + '>新建笔记</button>'
    + '<button type="button" id="scholar-export" class="btn btn-outline btn-sm"' + disabled + '>导出 HTML</button></div></header>'
    + '<div class="scholar-layout"><aside class="scholar-editor"><form id="scholar-form">'
    + '<label>标题<input id="scholar-title" maxlength="160" required value="' + esc(note.title) + '"' + disabled + ' placeholder="输入笔记标题"></label>'
    + '<fieldset class="scholar-style"><legend>模板</legend><div class="scholar-style-options">' + options + '</div></fieldset>'
    + '<div class="scholar-field-row"><label>知识区<select id="scholar-zone"' + disabled + '>' + zones + '</select></label>'
    + '<label>节点<select id="scholar-node"' + (disabled || !note.zone_id ? ' disabled' : '') + '>'
    + nodeOptionsHtml(note.zone_id, note.node_id, true, '整个知识区') + '</select></label></div>'
    + '<label>正文<textarea id="scholar-body" rows="7" maxlength="60000"' + disabled + ' placeholder="粘贴或输入内容。可用 ## 小节标题和 - 要点。">' + esc(note.body) + '</textarea></label>'
    + '<div id="scholar-live-card" class="scholar-live" aria-label="课堂录音与摘要"></div>'
    + '<div class="scholar-editor-actions"><button type="button" id="scholar-draft" class="btn btn-outline btn-sm"' + disabled + '>AI 整理</button>'
    + '<button type="submit" class="btn btn-primary btn-sm"' + disabled + '>保存笔记</button></div></form>'
    + '<p id="scholar-status" class="scholar-message" role="status"></p>'
    + '<div class="scholar-note-list"><h2>已保存笔记</h2><div id="scholar-saved-list"></div>'
    + (note.id ? '<button type="button" id="scholar-delete"' + disabled + '>删除当前笔记</button>' : '')
    + '</div></aside><div class="scholar-preview" id="scholar-preview" aria-label="笔记预览"></div></div></section>';
  renderScholarPreview();
  renderScholarSavedList();
  renderScholarStatus();
  bindScholarEditor();
  renderScholarLive();
}

function renderScholarSavedList() {
  var list = $('#scholar-saved-list');
  if (!list) return;
  var items = scholar.list.map(function (item) {
    return '<li><button type="button" data-scholar-id="' + esc(item.id) + '" aria-current="' + (item.id === scholar.note.id)
      + '"' + (scholar.busy ? ' disabled' : '') + '>' + esc(item.title) + '</button></li>';
  }).join('');
  list.innerHTML = items ? '<ul>' + items + '</ul>' : '<p class="scholar-message">暂无已保存笔记</p>';
  list.onclick = function (event) {
    var item = event.target.closest('[data-scholar-id]');
    if (!item || scholar.note.id === item.dataset.scholarId || !confirmScholarSwitch()) return;
    runScholarAction('正在打开笔记…', async function (stillCurrent) {
      var note = await apiGet('/notes/' + encodeURIComponent(item.dataset.scholarId));
      if (stillCurrent()) activateScholarNote(note);
    });
  };
}

function renderScholarStatus() {
  var status = $('#scholar-status');
  if (!status) return;
  status.textContent = scholar.busy || scholar.error || scholar.status || (scholar.dirty ? '有未保存的改动' : '');
  status.classList.toggle('error', Boolean(scholar.error));
}

function markScholarChanged() {
  scholar.dirty = true;
  scholar.status = '';
  scholar.error = '';
  renderScholarStatus();
  renderScholarPreview();
}

function bindScholarEditor() {
  $('#scholar-title').addEventListener('input', function (event) {
    scholar.note.title = event.target.value;
    markScholarChanged();
  });
  $('#scholar-body').addEventListener('input', function (event) {
    scholar.note.body = event.target.value;
    markScholarChanged();
  });
  $('#scholar-zone').addEventListener('change', function (event) {
    scholar.note.zone_id = event.target.value || null;
    scholar.note.node_id = null;
    scholar.note.sources = [];
    markScholarChanged();
    drawScholarNotes();
  });
  $('#scholar-node').addEventListener('change', function (event) {
    scholar.note.node_id = event.target.value || null;
    scholar.note.sources = [];
    markScholarChanged();
  });
  $$('[data-scholar-style]').forEach(function (button) {
    button.addEventListener('click', function () {
      if (scholar.note.style === button.dataset.scholarStyle) return;
      scholar.note.style = button.dataset.scholarStyle;
      scholar.page = 0;
      markScholarChanged();
      $$('[data-scholar-style]').forEach(function (option) {
        option.setAttribute('aria-pressed', String(option.dataset.scholarStyle === scholar.note.style));
      });
    });
  });
  $('#scholar-form').addEventListener('submit', function (event) { event.preventDefault(); saveScholarNote(); });
  $('#scholar-draft').addEventListener('click', draftScholarNote);
  var liveCard = $('#scholar-live-card');
  if (liveCard) {
    liveCard.addEventListener('click', function (event) {
      var button = event.target.closest('button');
      if (!button) return;
      if (button.id === 'scholarRecordBtn') {
        if (scholar.recording) scholarStopRecording(true);
        else scholarStartRecording();
      } else if (button.id === 'scholarInsertTranscriptBtn') {
        scholarInsertTranscript(false);
      } else if (button.id === 'scholarSummaryBtn') {
        scholarSummarize();
      } else if (button.id === 'scholarInsertRecapBtn') {
        scholarInsertRecap();
      } else if (button.id === 'scholarClearRecapBtn') {
        scholar.recap = null;
        renderScholarLive();
      }
    });
  }
  $('#scholar-export').addEventListener('click', exportScholarNote);
  $('#scholar-new').addEventListener('click', function () {
    if (!confirmScholarSwitch()) return;
    activateScholarNote(newScholarNote());
    drawScholarNotes();
    $('#scholar-title').focus();
  });
  var deleteButton = $('#scholar-delete');
  if (deleteButton) deleteButton.addEventListener('click', deleteScholarNote);
}

function activateScholarNote(note) {
  scholarStopRecording(false);
  scholar.note = note;
  scholar.page = 0;
  scholar.dirty = false;
  scholar.error = '';
  scholar.status = '';
  scholar.transcript = '';
  scholar.interim = '';
  scholar.transcriptInserted = 0;
  scholar.speechError = '';
  scholar.recap = null;
  scholar.recapBusy = false;
  scholar.recapError = '';
  scholar.recapInserted = false;
  scholar.stopInsert = false;
}

function confirmScholarSwitch() {
  return !scholar.dirty || window.confirm('有未保存的改动。放弃改动并切换笔记？');
}

async function runScholarAction(busy, action) {
  if (scholar.busy) return;
  var resetVersion = scholar.resetVersion;
  function stillCurrent() { return scholar.resetVersion === resetVersion; }
  scholar.busy = busy;
  scholar.error = '';
  scholar.status = '';
  drawScholarNotes();
  try {
    await action(stillCurrent);
  } catch (err) {
    if (stillCurrent()) scholar.error = failMessage(err);
  } finally {
    if (stillCurrent()) {
      scholar.busy = '';
      if (state.view === 'notes') drawScholarNotes();
    }
  }
}

function saveScholarNote() {
  runScholarAction('正在保存…', async function (stillCurrent) {
    var note = scholar.note;
    var path = '/notes' + (note.id ? '/' + encodeURIComponent(note.id) : '');
    var saved = note.id ? await apiPut(path, note) : await apiPost(path, note);
    if (!stillCurrent()) return;
    var page = scholar.page;
    activateScholarNote(saved);
    scholar.page = page;
    scholar.list = [saved].concat(scholar.list.filter(function (item) { return item.id !== saved.id; }));
    scholar.listRevision += 1;
    loadScholarList();
    invalidateLibraryGraph();
    scholar.status = '笔记已保存';
  });
}

function draftScholarNote() {
  var note = scholar.note;
  if (note.body.trim() && !window.confirm('AI 整理会更新当前正文。继续整理？')) return;
  runScholarAction('AI 正在整理笔记…', async function (stillCurrent) {
    var draft = await apiPost('/notes/draft', { title: note.title, body: note.body, zone_id: note.zone_id, node_id: note.node_id });
    if (!stillCurrent()) return;
    note.body = draft.body;
    note.sources = draft.sources;
    if (!note.title.trim()) {
      var scope = nodeById(note.node_id) || zoneById(note.zone_id);
      note.title = (scope ? scope.name + ' · 学习笔记' : '学习笔记').slice(0, 160);
    }
    scholar.page = 0;
    scholar.dirty = true;
    scholar.status = '整理完成，可以修改后保存';
  });
}

function deleteScholarNote() {
  var note = scholar.note;
  if (!note.id || !window.confirm('删除这份笔记？')) return;
  runScholarAction('正在删除…', async function (stillCurrent) {
    await apiDelete('/notes/' + encodeURIComponent(note.id));
    if (!stillCurrent()) return;
    scholar.list = scholar.list.filter(function (item) { return item.id !== note.id; });
    scholar.listRevision += 1;
    loadScholarList();
    activateScholarNote(newScholarNote());
    invalidateLibraryGraph();
    scholar.status = '已删除笔记';
  });
}

function exportScholarNote() {
  var note = scholar.note;
  if (!note.title.trim() && !note.body.trim()) {
    toast('请输入标题或笔记正文。', 'error');
    return;
  }
  var title = note.title.trim() || '学霸笔记';
  var css = $('#scholarNotebookStyles').textContent;
  var script = note.style === 'journal'
    ? '<scr' + 'ipt>(' + bindScholarJournal.toString() + ')(document.querySelector(".scholar-journal"));</scr' + 'ipt>' : '';
  var html = '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>' + esc(title) + '</title><style>' + css + '</style><body class="scholar-export">' + scholarBookHtml(note) + script + '</body></html>';
  var url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  var link = document.createElement('a');
  link.href = url;
  link.download = title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_').slice(0, 100) + '.html';
  link.click();
  setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
}

function route() {
  if (state.view === 'settings' && !authCanManageSettings) state.view = 'chat';
  if (state.view !== 'notes' && scholar.recording) scholarStopRecording(false);
  disposeMapViewport();
  kgStopTicker();
  $('meta[name="viewport"]').content = ['map', 'notes'].includes(state.view) ? 'width=device-width, initial-scale=1' : 'width=1280';
  renderShell();
  saveUiState();
  if (state.view === 'chat') renderChat();
  else if (state.view === 'library') renderLibrary();
  else if (state.view === 'map') renderMap();
  else if (state.view === 'notes') renderScholarNotes();
  else if (state.view === 'assignment') renderAssignment();
  else renderSettings();
}

function bindShell() {
  var brand = $('#brandBtn');
  if (brand) brand.addEventListener('click', function () { setView('chat'); });
  var topSettings = $('#topSettingsBtn');
  if (topSettings) topSettings.addEventListener('click', function () { setView('settings'); });
  var newConv = $('#newConvBtn');
  if (newConv) newConv.addEventListener('click', openNewConversation);
  var sideNav = $('#sideNav');
  if (sideNav) {
    sideNav.addEventListener('click', function (ev) {
      var btn = ev.target.closest('button[data-view]');
      if (btn) setView(btn.getAttribute('data-view'));
    });
  }
  var convList = $('#convList');
  if (convList) {
    convList.addEventListener('click', function (ev) {
      var del = ev.target.closest('[data-conv-del]');
      if (del) {
        ev.stopPropagation();
        deleteConversation(del.getAttribute('data-conv-del'));
        return;
      }
      var item = ev.target.closest('[data-conv-id]');
      if (item) selectConversation(item.getAttribute('data-conv-id'));
    });
  }
  document.addEventListener('click', function (ev) {
    var target = ev.target;
    if (!target || !target.closest) return;
    var goto = target.closest('[data-goto]');
    if (goto) {
      setView(goto.getAttribute('data-goto'));
      return;
    }
    if (target.closest('[data-newconv]')) openNewConversation();
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    var masks = $$('.modal-mask');
    if (!masks.length) return;
    var last = masks[masks.length - 1];
    var closeBtn = last.querySelector('[data-mask-close]');
    if (closeBtn) closeBtn.click();
    else closeMask(last);
  });
}

/* =========================================================
 * chat
 * ========================================================= */
function scopeName() {
  var zone = currentChatZone();
  var node = state.currentConversation ? nodeById(state.currentConversation.node_id) : null;
  if (!zone) return '未选择知识区';
  return zone.name + (node ? ' / ' + (node.path || node.name) : '');
}

function autosizeInput(input) {
  if (!input) return;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 168) + 'px';
}

function scrollMessages() {
  var box = $('#msgList');
  if (box) box.scrollTop = box.scrollHeight;
}

function showComposerError(message) {
  var box = $('#composerError');
  if (!box) return;
  box.textContent = message;
  box.hidden = false;
}

function hideComposerError() {
  var box = $('#composerError');
  if (!box) return;
  box.hidden = true;
  box.textContent = '';
}

function renderChat() {
  var main = $('#main');
  if (!main) return;
  var draft = '';
  var oldInput = $('#chatInput');
  var hadFocus = !!(oldInput && document.activeElement === oldInput);
  if (oldInput) draft = oldInput.value;

  main.innerHTML = '<div class="view chat-view">'
    + '<div class="chat-wrap' + (state.drawerOpen ? '' : ' drawer-closed') + '" id="chatWrap">'
    + '<section class="chat-main">'
    + '<header class="chat-head">'
    + '<div class="chat-scope">只检索：<strong id="chatScopeName">' + esc(scopeName()) + '</strong></div>'
    + '<div class="chat-head-actions">'
    + '<button type="button" class="btn btn-outline btn-sm" id="chatUploadBtn">上传资料</button>'
    + '<button type="button" class="btn btn-ghost btn-sm" id="drawerToggleBtn">' + (state.drawerOpen ? '收起引用' : '展开引用') + '</button>'
    + '</div></header>'
    + '<div class="chat-banners" id="chatBanners"></div>'
    + '<div class="msg-list" id="msgList"></div>'
    + '<footer class="composer">'
    + '<div class="composer-error" id="composerError" hidden></div>'
    + '<div class="composer-row">'
    + '<button type="button" class="attach-btn" id="composerAttachBtn">'
    + '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11.5 12.5 19a4.6 4.6 0 0 1-6.5-6.5l7.4-7.4a3 3 0 0 1 4.3 4.3l-7.3 7.3a1.5 1.5 0 0 1-2.1-2.1l6.7-6.7"/></svg>'
    + '上传资料</button>'
    + '<textarea id="chatInput" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>'
    + '<button type="button" class="btn btn-primary" id="sendBtn">发送</button>'
    + '</div></footer>'
    + '</section>'
    + '<aside class="citation-drawer" id="citationDrawer"></aside>'
    + '</div></div>';

  bindChatEvents();
  renderChatBanners();
  renderMessages();
  renderDrawer();
  updateComposer();

  var input = $('#chatInput');
  if (input) {
    input.value = draft;
    autosizeInput(input);
    if (hadFocus) input.focus();
  }
}

function bindChatEvents() {
  var sendBtn = $('#sendBtn');
  if (sendBtn) sendBtn.addEventListener('click', sendQuestion);
  var input = $('#chatInput');
  if (input) {
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey) {
        ev.preventDefault();
        sendQuestion();
      }
    });
    input.addEventListener('input', function () { autosizeInput(input); });
  }
  var attachBottom = $('#composerAttachBtn');
  if (attachBottom) attachBottom.addEventListener('click', openUploadModalForChat);
  var attachTop = $('#chatUploadBtn');
  if (attachTop) attachTop.addEventListener('click', openUploadModalForChat);
  var toggle = $('#drawerToggleBtn');
  if (toggle) toggle.addEventListener('click', function () { toggleDrawer(); });

  var msgList = $('#msgList');
  if (msgList) {
    msgList.addEventListener('error', function (ev) {
      var image = ev.target;
      if (!image.matches('[data-retrieved-preview]')) return;
      var card = image.closest('.retrieved-page');
      image.parentElement.hidden = true;
      card.querySelector('[data-original-file]').hidden = false;
    }, true);
    msgList.addEventListener('click', function (ev) {
      var chip = ev.target.closest('[data-cite-msg]');
      if (!chip) return;
      state.activeMessageId = chip.getAttribute('data-cite-msg');
      state.activeCitation = toInt(chip.getAttribute('data-cite-idx'));
      state.drawerOpen = true;
      saveUiState();
      var wrap = $('#chatWrap');
      if (wrap) wrap.classList.remove('drawer-closed');
      var btn = $('#drawerToggleBtn');
      if (btn) btn.textContent = '收起引用';
      $$('#msgList .cite-chip').forEach(function (item) {
        var active = item.getAttribute('data-cite-msg') === state.activeMessageId
          && toInt(item.getAttribute('data-cite-idx')) === state.activeCitation;
        item.classList.toggle('active', active);
      });
      renderDrawer();
      var card = $('.drawer-card.active');
      if (card) card.scrollIntoView({ block: 'nearest' });
    });
  }
  var drawer = $('#citationDrawer');
  if (drawer) {
    drawer.addEventListener('click', function (ev) {
      var card = ev.target.closest('[data-drawer-idx]');
      if (!card) return;
      state.activeCitation = toInt(card.getAttribute('data-drawer-idx'));
      $$('.drawer-card').forEach(function (item) { item.classList.toggle('active', item === card); });
    });
  }
}

function renderChatBanners() {
  var box = $('#chatBanners');
  if (!box) return;
  var parts = [];
  var zone = currentChatZone();
  var scopeCount = zone ? toInt(zone.doc_count) : 0;
  if (state.currentConversation && state.currentConversation.node_id) {
    scopeCount = nodeSubtreeDocCount(state.currentConversation.node_id);
  }
  if (state.currentConversation && zone && scopeCount === 0) {
    parts.push('<div class="notice warn">' + esc(FIXED.noDoc) + '</div>');
  }
  if (state.health && state.health.model_configured === false) {
    parts.push('<div class="notice error"><span>' + esc(FIXED.noModel) + '</span>'
      + '<button type="button" class="link-btn" data-goto="settings">去设置</button></div>');
  }
  box.innerHTML = parts.join('');
}

function renderMessages() {
  var box = $('#msgList');
  if (!box) return;
  if (!state.zones.length) {
    box.innerHTML = '<div class="chat-empty">' + esc(FIXED.noZone)
      + '<br><button type="button" class="btn btn-outline btn-sm" data-goto="library">去知识库新建知识区</button></div>';
    return;
  }
  if (!state.currentConversationId) {
    box.innerHTML = '<div class="chat-empty">' + esc(FIXED.noConv)
      + '<br><button type="button" class="btn btn-outline btn-sm" data-newconv="1">+ 新建会话</button></div>';
    return;
  }
  var html = state.messages.map(renderMessage).join('');
  if (state.chatSending && state.chatConversationId === state.currentConversationId) html += pendingBubbleHtml();
  if (!html) {
    html = '<div class="chat-empty">输入问题，开始检索该知识区的真实资料。</div>';
  }
  box.innerHTML = html;
}

function renderMessage(message) {
  var isUser = message.role === 'user';
  var citations = Array.isArray(message.citations) ? message.citations : [];
  var content = message.content || '';
  if (!isUser && message.status === 'insufficient_evidence' && !content) content = FIXED.noEvidence;
  if (!isUser && message.status === 'error' && !content) content = fillFixed(FIXED.fail, '未知错误');
  var meta;
  if (isUser) {
    meta = '<div class="msg-meta">我 · <span class="msg-time">' + esc(fmtTime(message.created_at)) + '</span></div>';
  } else {
    var badge = message.status
      ? ' · <span class="badge ' + msgStatusCls(message.status) + '">' + esc(MSG_STATUS[message.status] || message.status) + '</span>'
      : '';
    meta = '<div class="msg-meta">知序' + badge + ' · <span class="msg-time">' + esc(fmtTime(message.created_at)) + '</span></div>';
  }
  var chips = '';
  if (!isUser && citations.length) {
    chips = '<div class="msg-cites">' + citations.map(function (citation, index) {
      var active = state.activeMessageId === message.id && state.activeCitation === index;
      var label = '[' + (index + 1) + '] ' + (citation.filename || '来源');
      if (citation.page) label += ' · 第 ' + citation.page + ' 页';
      return '<button type="button" class="cite-chip' + (active ? ' active' : '') + '"'
        + ' data-cite-msg="' + esc(message.id) + '" data-cite-idx="' + index + '"'
        + ' title="' + esc(citation.snippet || '') + '">' + esc(label) + '</button>';
    }).join('') + '</div>';
  }
  var cls = 'msg ' + (isUser ? 'user' : 'assistant') + (!isUser && message.status === 'error' ? ' error' : '');
  return '<div class="' + cls + '" data-mid="' + esc(message.id || '') + '">' + meta
    + '<div class="msg-bubble">' + esc(content) + '</div>' + chips + renderRetrievedPages(message.retrieved_pages) + '</div>';
}

function renderRetrievedPages(pages) {
  if (!Array.isArray(pages) || !pages.length) return '';
  var scope = API_BASE + '/conversations/' + encodeURIComponent(state.currentConversationId) + '/documents/';
  return '<div class="retrieved-pages"><div class="retrieved-pages-title">检索到的原页</div><div class="retrieved-page-list">'
    + pages.map(function (page) {
      var base = scope + encodeURIComponent(page.document_id);
      var preview = esc(base + '/pages/' + encodeURIComponent(page.page) + '/preview');
      var title = (page.ext === '.pptx' ? '幻灯片 ' : 'PDF 第 ') + page.page + (page.ext === '.pptx' ? '' : ' 页');
      return '<div class="retrieved-page">'
        + '<a href="' + preview + '" target="_blank" rel="noopener" aria-label="放大查看 ' + esc(page.filename + ' ' + title) + '">'
        + '<img data-retrieved-preview src="' + preview + '" alt="' + esc(page.filename + ' ' + title) + '" loading="lazy"></a>'
        + '<span class="retrieved-page-label">' + esc(title) + '</span>'
        + '<span class="retrieved-page-name" title="' + esc(page.filename) + '">' + esc(page.filename) + '</span>'
        + '<a data-original-file hidden href="' + esc(base + '/original') + '">下载原文件</a></div>';
    }).join('') + '</div></div>';
}

function pendingBubbleHtml() {
  return '<div class="msg assistant pending" id="pendingMsg">'
    + '<div class="msg-meta">知序 · <span class="spinner"></span></div>'
    + '<div class="msg-bubble"><span id="phaseText">' + esc(FIXED.retrieving) + '</span></div>'
    + '</div>';
}

function renderDrawer() {
  var box = $('#citationDrawer');
  if (!box) return;
  var message = null;
  for (var i = 0; i < state.messages.length; i += 1) {
    if (state.messages[i].id === state.activeMessageId) { message = state.messages[i]; break; }
  }
  var citations = message && Array.isArray(message.citations) ? message.citations : [];
  var html = '<div class="drawer-head"><h3>引用</h3>'
    + '<button type="button" class="icon-btn" id="drawerCloseBtn">×</button></div>';
  if (!citations.length) {
    html += '<div class="drawer-empty">' + esc(message ? '该回答没有引用。' : '点击回答里的引用，在这里查看真实资料片段。') + '</div>';
  } else {
    html += '<div class="drawer-sub">来自「' + esc(scopeName()) + '」的真实资料片段</div>';
    html += '<div class="drawer-list">' + citations.map(function (citation, index) {
      var meta = [];
      if (citation.page) meta.push('第 ' + citation.page + ' 页');
      if (citation.heading_path) meta.push(citation.heading_path);
      var sourceState = citation.source_state || (citation.drifted ? 'drifted' : 'snapshot');
      var stateLabel = {
        current: '当前原文',
        drifted: '来源已变更',
        missing: '原资料已删除',
        snapshot: '引用快照'
      }[sourceState] || '引用快照';
      var note = {
        current: '已与当前索引中的原文片段核对一致。',
        drifted: '原引用片段在重新索引后已变化，这里显示同一文档的当前内容。',
        missing: '原资料已被删除，仅保留引用时的摘要。',
        snapshot: '历史引用快照，暂未重新定位到当前原文。'
      }[sourceState] || '';
      var sourceText = citation.text || citation.snippet || '暂无可显示的原文。';
      return '<div class="drawer-card' + (index === state.activeCitation ? ' active' : '') + '" data-drawer-idx="' + index + '">'
        + '<div class="dc-title">[' + (index + 1) + '] ' + esc(citation.filename || '来源') + '</div>'
        + '<div class="dc-meta">' + esc(meta.join(' · ') || '资料片段') + '</div>'
        + '<div class="dc-state ' + esc(sourceState) + '">' + esc(stateLabel) + '</div>'
        + '<pre class="dc-source">' + esc(sourceText) + '</pre>'
        + (note ? '<div class="dc-note">' + esc(note) + '</div>' : '')
        + '</div>';
    }).join('') + '</div>';
  }
  box.innerHTML = html;
  var closeBtn = $('#drawerCloseBtn');
  if (closeBtn) closeBtn.addEventListener('click', function () { toggleDrawer(false); });
}

function toggleDrawer(open) {
  state.drawerOpen = typeof open === 'boolean' ? open : !state.drawerOpen;
  saveUiState();
  var wrap = $('#chatWrap');
  if (wrap) wrap.classList.toggle('drawer-closed', !state.drawerOpen);
  var btn = $('#drawerToggleBtn');
  if (btn) btn.textContent = state.drawerOpen ? '收起引用' : '展开引用';
  if (state.drawerOpen) renderDrawer();
}

function updateComposer() {
  var ready = !!state.currentConversationId;
  var input = $('#chatInput');
  if (input) {
    input.disabled = !ready;
    input.placeholder = ready ? '输入问题，Enter 发送，Shift+Enter 换行' : FIXED.noConv;
  }
  var sendBtn = $('#sendBtn');
  if (sendBtn) sendBtn.disabled = !ready || state.chatSending;
}

async function loadMessages(conversationId) {
  var rows = await apiGet('/conversations/' + encodeURIComponent(conversationId) + '/messages');
  if (state.currentConversationId !== conversationId) return;
  state.messages = Array.isArray(rows) ? rows : [];
}

async function selectConversation(conversationId) {
  if (!conversationId) return;
  var conv = null;
  for (var i = 0; i < state.conversations.length; i += 1) {
    if (state.conversations[i].id === conversationId) { conv = state.conversations[i]; break; }
  }
  state.currentConversationId = conversationId;
  state.currentConversation = conv;
  if (conv && conv.zone_id) state.currentZoneId = conv.zone_id;
  state.messages = [];
  state.activeMessageId = null;
  state.activeCitation = 0;
  if (state.view !== 'chat') state.view = 'chat';
  route();
  try {
    await loadMessages(conversationId);
  } catch (err) {
    toast(failMessage(err), 'error');
  }
  if (state.currentConversationId !== conversationId) return;
  var last = lastAssistantMessage();
  state.activeMessageId = last ? last.id : null;
  renderChat();
  scrollMessages();
}

/* =========================================================
 * new conversation / delete conversation
 * ========================================================= */
function openNewConversation() {
  if (!state.zones.length) {
    var mask = openMask(
      '<div class="modal modal-sm">'
      + '<div class="modal-head"><h3>新建会话</h3><button type="button" class="icon-btn" data-mask-close="1">×</button></div>'
      + '<div class="modal-body"><p class="confirm-text">' + esc(FIXED.noZone) + '</p></div>'
      + '<div class="modal-foot"><button type="button" class="btn btn-outline" data-mask-close="1">取消</button>'
      + '<button type="button" class="btn btn-primary" data-mask-goto="library">去新建知识区</button></div></div>'
    );
    mask.addEventListener('click', function (ev) {
      if (ev.target === mask || ev.target.closest('[data-mask-close]')) closeMask(mask);
      else if (ev.target.closest('[data-mask-goto]')) { closeMask(mask); setView('library'); }
    });
    return;
  }

  var options = state.zones.map(function (zone) {
    return '<option value="' + esc(zone.id) + '"' + (zone.id === state.currentZoneId ? ' selected' : '') + '>'
      + esc(zone.name) + '</option>';
  }).join('');
  var mask2 = openMask(
    '<div class="modal modal-sm">'
    + '<div class="modal-head"><h3>新建会话</h3><button type="button" class="icon-btn" data-mask-close="1">×</button></div>'
    + '<div class="modal-body">'
    + '<div class="field"><span>知识区</span><select id="newConvZone">' + options + '</select></div>'
    + '<div class="field"><span>检索节点（可选）</span><select id="newConvNode">' + nodeOptionsHtml(state.currentZoneId || (state.zones[0] && state.zones[0].id), '', true, '整个知识区') + '</select></div>'
    + '<div class="field"><span>会话标题（可选）</span><input type="text" id="newConvTitle" maxlength="60" placeholder="新会话"></div>'
    + '<div class="hint">选择节点后只检索该节点及其子节点；会话创建后不可更换范围。</div>'
    + '<div id="newConvError" class="inline-error" hidden></div>'
    + '</div>'
    + '<div class="modal-foot"><button type="button" class="btn btn-outline" data-mask-close="1">取消</button>'
    + '<button type="button" class="btn btn-primary" id="newConvSubmit">创建会话</button></div></div>'
  );
  mask2.addEventListener('click', function (ev) {
    if (ev.target === mask2 || ev.target.closest('[data-mask-close]')) closeMask(mask2);
  });
  var zoneSelect = $('#newConvZone', mask2);
  var nodeSelect = $('#newConvNode', mask2);
  if (zoneSelect) {
    if (zoneSelect.value) nodeSelect.innerHTML = nodeOptionsHtml(zoneSelect.value, '', true, '整个知识区');
    zoneSelect.addEventListener('change', function () {
      nodeSelect.innerHTML = nodeOptionsHtml(zoneSelect.value, '', true, '整个知识区');
    });
  }
  var submit = $('#newConvSubmit', mask2);
  if (submit) {
    submit.addEventListener('click', async function () {
      var zoneId = $('#newConvZone', mask2).value;
      var nodeId = $('#newConvNode', mask2) ? $('#newConvNode', mask2).value : '';
      var title = $('#newConvTitle', mask2).value.trim();
      var errBox = $('#newConvError', mask2);
      submit.disabled = true;
      var payload = { zone_id: zoneId };
      if (nodeId) payload.node_id = nodeId;
      if (title) payload.title = title;
      try {
        var conv = await apiPost('/conversations', payload);
        closeMask(mask2);
        await refreshConversations();
        await selectConversation(conv.id);
      } catch (err) {
        submit.disabled = false;
        if (errBox) { errBox.textContent = failMessage(err); errBox.hidden = false; }
      }
    });
  }
}

async function deleteConversation(conversationId) {
  var ok = await confirmDialog(FIXED.delConfirm);
  if (!ok) return;
  try {
    await apiDelete('/conversations/' + encodeURIComponent(conversationId));
    if (state.currentConversationId === conversationId) {
      state.currentConversationId = null;
      state.currentConversation = null;
      state.messages = [];
      state.activeMessageId = null;
    }
    await refreshConversations();
    if (state.view === 'chat') renderChat();
    toast('会话已删除。', 'ok');
  } catch (err) {
    toast(failMessage(err), 'error');
  }
}

/* =========================================================
 * chat: send question
 * ========================================================= */
async function sendQuestion() {
  if (state.chatSending) return;
  var input = $('#chatInput');
  if (!input) return;
  var question = input.value.trim();
  var conversationId = state.currentConversationId;
  if (!conversationId) {
    showComposerError(FIXED.noConv);
    return;
  }
  if (!question) {
    showComposerError('请输入问题。');
    return;
  }
  hideComposerError();
  state.chatSending = true;
  state.chatConversationId = conversationId;
  state.activeMessageId = null;
  state.activeCitation = 0;
  renderMessages();
  updateComposer();
  scrollMessages();
  if (state.phaseTimer) window.clearTimeout(state.phaseTimer);
  state.phaseTimer = window.setTimeout(function () {
    var phase = $('#phaseText');
    if (phase && state.chatSending) phase.textContent = FIXED.generating;
  }, 900);

  try {
    await api('/chat?stream=true', {
      method: 'POST',
      json: { conversation_id: conversationId, question: question },
      onRetrieved: function (message) {
        if (state.currentConversationId !== conversationId) return;
        if (!state.messages.some(function (row) { return row.id === message.id; })) state.messages.push(message);
        renderMessages();
        scrollMessages();
      }
    });
    state.chatSending = false;
    if (state.phaseTimer) { window.clearTimeout(state.phaseTimer); state.phaseTimer = null; }
    await loadMessages(conversationId);
    await refreshConversations();
    if (state.currentConversationId !== conversationId || state.view !== 'chat') return;
    input = $('#chatInput');
    if (input) input.value = '';
    var last = lastAssistantMessage();
    state.activeMessageId = last ? last.id : null;
    state.activeCitation = 0;
    renderChat();
    scrollMessages();
  } catch (err) {
    state.chatSending = false;
    if (state.phaseTimer) { window.clearTimeout(state.phaseTimer); state.phaseTimer = null; }
    try { await loadMessages(conversationId); } catch (loadErr) { /* keep chat usable */ }
    await refreshConversations().catch(function () {});
    if (state.currentConversationId !== conversationId || state.view !== 'chat') return;
    renderChat();
    showComposerError(failMessage(err));
    input = $('#chatInput');
    if (input) {
      input.value = question;
      input.focus();
      autosizeInput(input);
    }
    scrollMessages();
  } finally {
    state.chatSending = false;
    state.chatConversationId = null;
    if (state.phaseTimer) { window.clearTimeout(state.phaseTimer); state.phaseTimer = null; }
    updateComposer();
  }
}

function openUploadModal(presetZoneId, presetNodeId) {

    + '</div>'

    + '<button type="button" class="btn btn-outline" data-mask-close="1">取消</button>'
    + '<button type="button" class="btn btn-primary" id="uploadSubmitBtn">上传并解析</button>'
    + '</div></div>'
  );

  var fileInput = $('#uploadFileInput', mask);
  var fileMeta = $('#uploadFileMeta', mask);
  var zoneSelect = $('#uploadZoneSelect', mask);
  var nodeField = $('#uploadNodeField', mask);
  var nodeSelect = $('#uploadNodeSelect', mask);
  var newZoneField = $('#uploadNewZoneField', mask);
  var newZoneName = $('#uploadNewZoneName', mask);
  var statusBox = $('#uploadStatus', mask);
  var submitBtn = $('#uploadSubmitBtn', mask);
  var uploading = false;
  var finished = false;

  function syncNewZoneField() {
    if (!newZoneField) return;
    var isNew = !!zoneSelect && zoneSelect.value === '__new__';
    newZoneField.hidden = !isNew;
    if (nodeField) nodeField.hidden = isNew;
    if (nodeSelect && !isNew) {
      var currentNode = nodeSelect.value;
      nodeSelect.innerHTML = nodeOptionsHtml(zoneSelect ? zoneSelect.value : '', currentNode, false, '未分类');
    }
  }
  function setStatusHtml(inner) {
    if (!statusBox) return;
    statusBox.hidden = false;
    statusBox.innerHTML = inner;
  }

  syncNewZoneField();

  if (zoneSelect) zoneSelect.addEventListener('change', syncNewZoneField);
  if (fileInput) {
    fileInput.addEventListener('change', function () {
      var file = fileInput.files ? fileInput.files[0] : null;
      if (!fileMeta) return;
      if (!file) {
        fileMeta.textContent = '支持 PDF / DOCX / PPTX / MD / TXT / 图片，单个文件不超过 20MB。';
        return;
      }
      var text = file.name + ' · ' + fmtBytes(file.size);
      if (file.size > 20 * 1024 * 1024) text += '（超过 20MB 上限，上传会被拒绝）';
      fileMeta.textContent = text;
    });
  }

  mask.addEventListener('click', function (ev) {
    if (ev.target === mask || ev.target.closest('[data-mask-close]')) closeMask(mask);
  });

  async function submitUpload() {
    if (uploading) return;
    if (finished) { closeMask(mask); return; }
    var file = fileInput && fileInput.files ? fileInput.files[0] : null;
    if (!file) {
      setStatusHtml('<div class="result-box fail">请选择要上传的文件。</div>');
      return;
    }
    var zoneValue = zoneSelect ? zoneSelect.value : '';
    var newName = newZoneName ? newZoneName.value.trim() : '';
    if (zoneValue === '__new__' && (newName.length < 1 || newName.length > 20)) {
      setStatusHtml('<div class="result-box fail">知识区名称需为 1–20 个字符。</div>');
      return;
    }
    uploading = true;
    if (submitBtn) submitBtn.disabled = true;
    if (fileInput) fileInput.disabled = true;
    if (zoneSelect) zoneSelect.disabled = true;
    if (newZoneName) newZoneName.disabled = true;
    setStatusHtml('<div class="result-box"><span class="spinner"></span> ' + esc(FIXED.parsing) + '</div>');
    try {
      var zoneId = zoneValue;
      if (zoneValue === '__new__') {
        var created = await apiPost('/zones', { name: newName });
        zoneId = created.id;
      }
      var form = new FormData();
      form.append('file', file);
      form.append('zone_id', zoneId);
      var nodeId = (zoneValue !== '__new__' && nodeSelect) ? nodeSelect.value : '';
      if (nodeId) form.append('node_id', nodeId);
      var result = await apiForm('/documents', form);
      await refreshNodes().catch(function () {});
      var conversationZoneId = (state.view === 'chat' && state.currentConversation)
        ? state.currentConversation.zone_id
        : null;
      state.currentZoneId = conversationZoneId || zoneId;
      await refreshZones().catch(function () {});
      await refreshConversations().catch(function () {});
      state.libraryGraphZoneId = null;
      state.libraryDocsZoneId = null;
      if (state.view === 'library') {
        state.libraryZoneId = zoneId;
        state.libraryNodeId = nodeId || null;
        state.libraryDocumentId = null;
        state.libraryGraphSelected = nodeId ? 'node:' + nodeId : null;
        state.libraryDocs = [];
        state.libraryDocsNodeId = null;
        renderLibrary();
      } else if (state.view === 'chat') {
        renderChat();
      } else {
        renderShell();
      }
      var info = docStatusInfo(result.status);
      var lowQuality = (result.status === 'ready' || result.status === 'ready_with_warning')
        && isFinite(Number(result.quality)) && Number(result.quality) < 0.6;
      if (result.status === 'failed') {
        setStatusHtml('<div class="result-box fail">上传完成但解析失败。<br>状态：' + esc(info.label)
          + (result.warning ? '<br>提示：' + esc(result.warning) : '') + '</div>');
      } else {
        setStatusHtml('<div class="result-box ok">上传完成：' + esc(file.name)
          + '<br>状态：' + esc(info.label)
          + (result.warning ? '<br>提示：' + esc(result.warning) : '')
          + (lowQuality ? '<br><span class="task-overdue">资料解析质量偏低（质量分 '
            + esc(Number(result.quality).toFixed(3)) + '），建议检查扫描清晰度或重新上传。</span>' : '')
          + '</div>');
      }
      finished = true;
      if (submitBtn) {
        submitBtn.textContent = '完成';
        submitBtn.disabled = false;
      }
    } catch (err) {
      setStatusHtml('<div class="result-box fail">' + esc(failMessage(err)) + '</div>');
      if (fileInput) fileInput.disabled = false;
      if (zoneSelect) zoneSelect.disabled = false;
      if (newZoneName) newZoneName.disabled = false;
      if (submitBtn) submitBtn.disabled = false;
      refreshZones().catch(function () {});
    } finally {
      uploading = false;
    }
  }

  if (submitBtn) submitBtn.addEventListener('click', submitUpload);
}

function kgShort(value, limit) {

/* Constellation view inspired by DocLib 2.0 (MIT, github.com/donshirokmagixx/doclib). Data model and drawing logic are Zhixu-specific. */

var KG_META = {
  zone: { label: '知识区', color: '#eec782' },
  knowledge: { label: '知识节点', color: '#78d4bc' },
  document: { label: '资料', color: '#a6c8f3' },
  note: { label: '笔记', color: '#c3a7f5' },
  mindmap: { label: '导图', color: '#ecaa72' }
};
var KG_EDGE_LABELS = { hierarchy: '上下级', document: '资料归属', note: '笔记归属', mindmap: '导图归属' };
var kgMotionReduced = window.matchMedia('(prefers-reduced-motion: reduce)');
var kgResizeObserver = null;
var kgRequest = 0;
var libraryDocsRequest = 0;

function kgBuildGraph(zone, docs, notes, maps) {
  var nodes = [], links = [];
  var byId = Object.create(null);
  var zoneKey = 'zone:' + zone.id;
  var zoneNodes = nodesForZone(zone.id);
  function add(node) {
    node.edges = [];
    node.children = [];
    nodes.push(node);
    byId[node.id] = node;
    return node;
  }
  function mount(parent, node, relation) {
    var link = { source: parent.id, target: node.id, kind: relation, index: links.length };
    links.push(link);
    parent.children.push(node);
    parent.edges.push(link);
    node.edges.push(link);
  }
  function owner(nodeId) {
    return byId['node:' + nodeId] || byId[zoneKey];
  }
  add({ id: zoneKey, kind: 'zone', label: zone.name, sub: docs.length + ' 份资料', r: 15, meta: zone });
  zoneNodes.forEach(function (node) {
    add({
      id: 'node:' + node.id, kind: 'knowledge', label: node.name,
      sub: toInt(node.doc_count) + ' 份直属资料', r: 6.5 + Math.min(2.5, Math.sqrt(toInt(node.doc_count))),
      meta: node
    });
  });
  zoneNodes.forEach(function (node) {
    mount(owner(node.parent_id), byId['node:' + node.id], 'hierarchy');
  });
  docs.forEach(function (doc) {
    mount(owner(doc.node_id), add({
      id: 'doc:' + doc.id, kind: 'document', label: doc.filename || '未命名资料',
      sub: extLabel(doc.ext) + ' · ' + docStatusInfo(doc.status).label, r: 4.5, meta: doc
    }), 'document');
  });
  notes.forEach(function (note) {
    mount(owner(note.node_id), add({
      id: 'note:' + note.id, kind: 'note', label: note.title || '未命名笔记',
      sub: note.style === 'journal' ? '手账笔记' : '横线笔记', r: 5.5, meta: note
    }), 'note');
  });
  maps.forEach(function (map) {
    mount(byId[zoneKey], add({
      id: 'map:' + map.id, kind: 'mindmap', label: map.title || '思维导图',
      sub: map.mode === 'concept' ? '概念导图' : '结构导图', r: 5.5, meta: map
    }), 'mindmap');
  });
  return { zone: zone, nodes: nodes, links: links, byId: byId, docs: docs, notes: notes,
    stats: { nodes: zoneNodes.length, docs: docs.length, notes: notes.length, maps: maps.length } };
}

function kgInitialLayout(graph) {
  // Space sibling branches by their leaf counts, keeping each subtree in its own sector.
  var root = graph.nodes[0];
  function weigh(node) {
    node.weight = Math.max(1, node.children.reduce(function (sum, child) { return sum + weigh(child); }, 0));
    return node.weight;
  }
  function place(node, start, span, radius) {
    var angle = start + span / 2;
    node.x = Math.cos(angle) * radius;
    node.y = Math.sin(angle) * radius * .85;
    node.vx = node.vy = 0;
    var offset = start;
    node.children.forEach(function (child, index) {
      var arc = span * child.weight / node.weight;
      var step = child.kind === 'knowledge' ? 93 : 67;
      var nextRadius = radius + Math.max(step, Math.min(220, 19 / arc));
      var lanes = Math.max(1, Math.ceil(19 / (nextRadius * arc)));
      place(child, offset, arc, nextRadius + (index % lanes) * 18);
      offset += arc;
    });
  }
  weigh(root);
  place(root, -Math.PI * .85, Math.PI * 2, 0);
}

function kgApplyTransform() {
  var viewport = $('#kgViewport');
  if (!viewport) return;
  viewport.setAttribute('transform', 'translate(' + state.libraryGraphPanX.toFixed(2) + ' ' +
    state.libraryGraphPanY.toFixed(2) + ') scale(' + state.libraryGraphScale.toFixed(4) + ')');
  viewport.classList.toggle('kg-small-labels', state.libraryGraphScale < .55);
}

function kgUpdateHeader() {
  var graph = state.libraryGraph;
  if (!graph || graph.zone.id !== state.libraryZoneId) return;
  var meta = $('#docsZoneMeta');
  var title = $('#docsZoneName');
  if (title) title.textContent = graph.zone.name;
  if (meta) meta.textContent = graph.stats.docs + ' 份资料 · ' + graph.stats.nodes + ' 个节点';
}

function kgFocusId(graph) {
  var id = state.libraryGraphSelected;
  return graph.byId[id] ? id : graph.nodes[0].id;
}

function kgVisibleScene(graph) {
  var focusId = kgFocusId(graph);
  var visible = new Set();
  var local = null;
  if (state.libraryGraphScope === 'local') {
    local = new Set([focusId]);
    var frontier = [focusId];
    for (var depth = 0; depth < state.libraryGraphDepth && frontier.length; depth += 1) {
      var next = [];
      frontier.forEach(function (id) {
        graph.byId[id].edges.forEach(function (edge) {
          if (!state.libraryGraphEdges[edge.kind]) return;
          var neighbor = edge.source === id ? edge.target : edge.source;
          if (local.has(neighbor)) return;
          local.add(neighbor);
          next.push(neighbor);
        });
      });
      frontier = next;
    }
  }
  graph.nodes.forEach(function (node) {
    if (local && !local.has(node.id)) return;
    if (node.kind === 'zone' || state.libraryGraphFilters[node.kind]) visible.add(node.id);
  });
  var links = graph.links.filter(function (link) {
    return state.libraryGraphEdges[link.kind] && visible.has(link.source) && visible.has(link.target);
  });
  return { nodes: graph.nodes.filter(function (node) { return visible.has(node.id); }), links: links };
}

function kgDetailHtml(graph) {
  var node = graph.byId[state.libraryGraphSelected];
  if (!node) {
    var stats = graph.stats;
    return '<h3>知识区概览</h3><p>' + esc(graph.zone.name) + '</p>'
      + '<p>' + stats.nodes + ' 个知识节点 · ' + stats.docs + ' 份资料</p>'
      + '<p>' + stats.notes + ' 份笔记 · ' + stats.maps + ' 张导图</p>'
      + '<div class="kg-actions"><button type="button" data-kg-action="list">打开资料列表</button></div>';
  }
  var meta = KG_META[node.kind];
  var lines = node.kind === 'knowledge' && node.meta.path && node.meta.path !== node.label
    ? '<p>' + esc(node.meta.path) + '</p>' : '';
  lines += '<p>' + esc(node.sub) + '</p>';
  if (node.kind === 'document') lines += '<p>' + toInt(node.meta.chunk_count) + ' 个片段 · ' + esc(fmtBytes(node.meta.size)) + '</p>';
  var label = { knowledge: '查看该节点资料', document: '打开资料列表', note: '打开笔记', mindmap: '打开导图', zone: '打开资料列表' }[node.kind];
  var related = node.edges.map(function (edge) {
    var other = graph.byId[edge.source === node.id ? edge.target : edge.source];
    var color = KG_META[other.kind].color;
    return '<button type="button" data-kg-related="' + esc(other.id) + '" title="' + esc(other.label) + '">'
      + '<i class="kg-dot" style="background:' + color + '"></i><span>' + esc(other.label) + '</span></button>';
  }).join('');
  return '<button type="button" class="kg-close" data-kg-action="close" aria-label="清除选择">×</button>'
    + '<div class="kg-type">' + meta.label + '</div><h3>' + esc(node.label) + '</h3>' + lines
    + '<div class="kg-actions"><button type="button" data-kg-action="open">' + label + '</button>'
    + '<button type="button" data-kg-action="pin" aria-pressed="' + Boolean(node.pinned)
    + '">' + (node.pinned ? '取消固定' : '固定位置') + '</button></div>'
    + (related ? '<div class="kg-related"><p>相邻节点 · ' + node.edges.length + '</p>' + related + '</div>' : '');
}

function kgPath(a, b) {
  return 'M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + 'L' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
}

function kgDrawScene() {
  var graph = state.libraryGraph;
  var viewport = $('#kgViewport');
  if (!graph || !viewport) return;
  var scene = kgVisibleScene(graph);
  var query = state.libraryGraphQuery.trim().toLowerCase();
  var selectedId = state.libraryGraphSelected;
  var hits = new Set(scene.nodes.filter(function (node) {
    return query && (node.label + ' ' + (node.meta.path || '') + ' ' + node.sub).toLowerCase().includes(query);
  }).map(function (node) { return node.id; }));
  var emphasized = new Set(hits);
  if (!query && selectedId) emphasized.add(selectedId);
  var highlighted = new Set(emphasized);
  var links = scene.links.map(function (link) {
    var active = emphasized.has(link.source) || emphasized.has(link.target);
    if (active) { highlighted.add(link.source); highlighted.add(link.target); }
    return '<path data-kg-link="' + link.index + '" class="kg-link kg-link-' + link.kind
      + (active ? ' kg-emphasis' : emphasized.size || query ? ' kg-dim' : '')
      + '" d="' + kgPath(graph.byId[link.source], graph.byId[link.target]) + '"></path>';
  });
  var nodes = scene.nodes.map(function (node) {
    var meta = KG_META[node.kind];
    var classes = 'kg-node kg-node-' + node.kind + (node.id === selectedId ? ' kg-selected' : '')
      + (node.pinned ? ' kg-pinned' : '')
      + (hits.has(node.id) ? ' kg-match' : '')
      + ((emphasized.size || query) && !highlighted.has(node.id) ? ' kg-dim' : '');
    var isDocument = node.kind === 'document';
    var glow = node.kind === 'zone' ? 10 : 4;
    var core = '<circle class="kg-core" r="' + node.r + '" fill="' + (isDocument ? '#102033' : meta.color)
      + '" stroke="' + meta.color + '" stroke-width="1.3"></circle>';
    return '<g class="' + classes + '" data-kg-node="' + esc(node.id) + '" transform="translate(' + node.x.toFixed(1) + ' '
      + node.y.toFixed(1) + ')" role="button" tabindex="0" aria-pressed="' + (node.id === selectedId)
      + '" aria-label="' + esc(meta.label + '：' + node.label) + '">'
      + '<title>' + esc(node.label) + '</title><circle class="kg-halo" r="' + (node.r + glow)
      + '" fill="' + meta.color + '"></circle><circle r="' + Math.max(node.r + 2, 11) + '" fill="transparent"></circle>' + core
      + '<text class="kg-node-label" y="' + (node.r + 12) + '">' + esc(kgShort(node.label, isDocument ? 20 : 16)) + '</text></g>';
  });
  var focusedNode = document.activeElement && document.activeElement.getAttribute('data-kg-node');
  viewport.innerHTML = '<g aria-hidden="true">' + links.join('') + '</g><g>' + nodes.join('') + '</g>';
  graph.nodeEls = Array.from(viewport.querySelectorAll('[data-kg-node]'), function (el) {
    return { el: el, node: graph.byId[el.getAttribute('data-kg-node')] };
  });
  graph.linkEls = Array.from(viewport.querySelectorAll('[data-kg-link]'), function (el) {
    var link = graph.links[Number(el.getAttribute('data-kg-link'))];
    return { el: el, source: graph.byId[link.source], target: graph.byId[link.target] };
  });
  if (focusedNode) {
    var focus = graph.nodeEls.find(function (entry) { return entry.node.id === focusedNode; });
    if (focus) focus.el.focus({ preventScroll: true });
  }
  var status = $('#kgSearchStatus');
  status.textContent = query ? hits.size + ' 个匹配结果' : scene.nodes.length <= 1 && graph.nodes.length === 1 ? '上传资料或创建知识节点后，这里将显示关系。' : '';
  $('#kgDetail').innerHTML = kgDetailHtml(graph);
  kgUpdateHeader();
}

function kgApplyPositions(graph) {
  (graph.nodeEls || []).forEach(function (entry) {
    entry.el.setAttribute('transform', 'translate(' + entry.node.x.toFixed(1) + ' ' + entry.node.y.toFixed(1) + ')');
  });
  (graph.linkEls || []).forEach(function (entry) {
    entry.el.setAttribute('d', kgPath(entry.source, entry.target));
  });
}

function kgStep(graph, drag, dt) {
  var nodes = graph.nodes;
  var alpha = graph.alpha;
  var nearby = new Map();
  var size = 84;
  nodes.forEach(function (node) {
    var key = Math.floor(node.x / size) + ',' + Math.floor(node.y / size);
    if (!nearby.has(key)) nearby.set(key, []);
    nearby.get(key).push(node);
    node.vx *= .82;
    node.vy *= .82;
  });
  nodes.forEach(function (a) {
    if (a.pinned || (drag && drag.id === a.id)) return;
    var bx = Math.floor(a.x / size), by = Math.floor(a.y / size);
    for (var ix = bx - 1; ix <= bx + 1; ix += 1) {
      for (var iy = by - 1; iy <= by + 1; iy += 1) {
        (nearby.get(ix + ',' + iy) || []).forEach(function (b) {
          if (a === b) return;
          var dx = a.x - b.x, dy = a.y - b.y;
          if (!dx && !dy) dx = a.id < b.id ? -1 : 1;
          var distance = Math.hypot(dx, dy);
          if (distance > size) return;
          var force = Math.min(4, 1050 / Math.max(100, distance * distance)) * alpha;
          a.vx += dx / distance * force;
          a.vy += dy / distance * force;
        });
      }
    }
  });
  graph.links.forEach(function (link) {
    var a = graph.byId[link.source], b = graph.byId[link.target];
    var dx = b.x - a.x, dy = b.y - a.y;
    var distance = Math.max(1, Math.hypot(dx, dy));
    var force = (distance - link.rest) * .032 * alpha;
    a.vx += dx / distance * force;
    a.vy += dy / distance * force;
    b.vx -= dx / distance * force;
    b.vy -= dy / distance * force;
  });
  nodes.forEach(function (node) {
    if (node.pinned || (drag && drag.id === node.id)) return;
    node.x += Math.max(-13, Math.min(13, node.vx)) * dt;
    node.y += Math.max(-13, Math.min(13, node.vy)) * dt;
  });
  graph.alpha *= Math.pow(.97, dt);
  kgApplyPositions(graph);
}

function kgLayoutKey(zoneId) {
  return 'zhixu.star-layout.v1.' + zoneId;
}

function kgStorePositions(graph) {
  var positions = Object.create(null);
  graph.nodes.forEach(function (node) { positions[node.id] = [node.x, node.y, Boolean(node.pinned)]; });
  try { localStorage.setItem(kgLayoutKey(graph.zone.id), JSON.stringify(positions)); } catch (err) { /* storage can be disabled */ }
}

function kgRestorePositions(graph) {
  try {
    var positions = JSON.parse(localStorage.getItem(kgLayoutKey(graph.zone.id)));
    if (!positions) return;
    graph.nodes.forEach(function (node) {
      var saved = positions[node.id];
      if (!Array.isArray(saved) || !Number.isFinite(saved[0]) || !Number.isFinite(saved[1])) return;
      node.x = saved[0];
      node.y = saved[1];
      node.pinned = saved[2] === true;
    });
  } catch (err) { /* invalid or unavailable storage uses the default layout */ }
}

function kgClearPositions(zoneId) {
  try { localStorage.removeItem(kgLayoutKey(zoneId)); } catch (err) { /* storage can be disabled */ }
}

function kgStopMotion() {
  if (state.libraryGraphRaf != null) cancelAnimationFrame(state.libraryGraphRaf);
  state.libraryGraphRaf = null;
  state.libraryGraphDrag = null;
  if (state.libraryGraph) state.libraryGraph.alpha = 0;
}

function kgStopTicker() {
  kgStopMotion();
  if (kgResizeObserver) kgResizeObserver.disconnect();
  kgResizeObserver = null;
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) kgStopMotion();
});

function kgStartTicker() {
  if (state.libraryGraphRaf != null || kgMotionReduced.matches) return;
  var graph = state.libraryGraph;
  var svg = $('#kgSvg');
  var last = performance.now();
  var interval = graph.nodes.length > 450 ? 29 : 12;
  function frame(now) {
    if (!svg || !svg.isConnected || graph !== state.libraryGraph || document.hidden || kgMotionReduced.matches) {
      state.libraryGraphRaf = null;
      return;
    }
    var elapsed = now - last;
    var drag = state.libraryGraphDrag;
    if (elapsed >= interval) {
      if (drag && drag.id && drag.moved) graph.alpha = Math.max(graph.alpha, .68);
      kgStep(graph, drag, Math.min(2, elapsed / 16.67));
      last = now;
    }
    if (graph.alpha > .035) state.libraryGraphRaf = requestAnimationFrame(frame);
    else {
      state.libraryGraphRaf = null;
      kgStorePositions(graph);
    }
  }
  state.libraryGraphRaf = requestAnimationFrame(frame);
}

function kgButtonGroup(attribute, values, current) {
  return Object.keys(values).map(function (value) {
    return '<button type="button" ' + attribute + '="' + value + '" aria-pressed="' + (value === current) + '">' + values[value] + '</button>';
  }).join('');
}

function renderLibraryGraph() {
  var stage = $('#libraryGraph');

  if (!graph || graph.zone.id !== state.libraryZoneId) {
    stage.innerHTML = '<div class="kg-empty" role="status">' + (state.libraryGraphError
      ? esc(state.libraryGraphError) + '<button type="button" data-kg-action="refresh">重试</button>'

  }
  function filterOptions(values, selected, attribute) {

  }
  var types = { knowledge: KG_META.knowledge, document: KG_META.document, note: KG_META.note, mindmap: KG_META.mindmap };
  var legend = Object.keys(KG_META).map(function (kind) {
