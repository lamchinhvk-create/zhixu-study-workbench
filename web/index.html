function bindQuizEvents() {
  var zoneSelect = $('#quizZoneSelect');
  if (zoneSelect) {
    zoneSelect.addEventListener('change', function () {
      state.quizZoneId = zoneSelect.value;
      state.currentZoneId = zoneSelect.value;
      state.quizMaps = [];
      state.quizMapsZoneId = null;
      state.quizMindmapId = '';
      state.quiz = null;
      state.quizExport = null;
      state.quizError = '';
      renderShell();
      renderQuizTab();
    });
  }
  var mapSelect = $('#quizMindmapSelect');
  if (mapSelect) mapSelect.addEventListener('change', function () { state.quizMindmapId = mapSelect.value; });
  $$('[data-quiz-count]').forEach(function (input) {
    function updateCount() {
      var type = input.getAttribute('data-quiz-count');
      var value = Number(input.value);
      state.quizCounts[type] = Number.isFinite(value) ? Math.max(0, Math.min(10, Math.trunc(value))) : 0;
      updateQuizCountSummary();
    }
    input.addEventListener('input', updateCount);
    input.addEventListener('change', function () {
      updateCount();
      input.value = state.quizCounts[input.getAttribute('data-quiz-count')];
    });
  });
  var generateBtn = $('#quizGenerateBtn');
  if (generateBtn) generateBtn.addEventListener('click', generateQuiz);
  var exportBtn = $('#quizExportBtn');
  if (exportBtn) exportBtn.addEventListener('click', exportQuiz);
}

async function ensureQuizMaps() {
  var zoneId = state.quizZoneId;
  if (!zoneId) {
    state.quizMaps = [];
    state.quizMapsZoneId = null;
    return;
  }
  if (state.quizMapsZoneId === zoneId) return;
  try {
    var rows = await apiGet('/mindmaps?zone_id=' + encodeURIComponent(zoneId));
    if (state.quizZoneId !== zoneId) return;
    state.quizMaps = Array.isArray(rows) ? rows : [];
    state.quizMapsZoneId = zoneId;
  } catch (err) {
    if (state.quizZoneId === zoneId) {
      state.quizMaps = [];
      state.quizMapsZoneId = zoneId;
      toast(failMessage(err), 'error');
    }
  }
  if (state.view === 'assignment' && state.assignmentTab === 'quiz') renderQuizTab();
}

function quizMetaHtml() {
  var quiz = state.quiz;
  if (!quiz) return '';
  var questions = Array.isArray(quiz.questions) ? quiz.questions : [];
  var html = '<span class="badge badge-ok">已生成 ' + questions.length + ' 题</span>'
    + '<span class="muted mono">试卷 ID：' + esc(quiz.quiz_id || '') + '</span>'
    + (quiz.formula_check === 'passed' ? '<span class="badge badge-ok">公式校验通过</span>' : '')
    + '<button type="button" class="btn btn-outline btn-sm" id="quizExportBtn"'
    + (state.quizBusy ? ' disabled' : '') + '>导出学生版（DOCX + PDF）</button>';
  if (state.quizExport) {
    html += downloadLink('下载学生版 DOCX', state.quizExport.docx)
      + downloadLink('下载学生版 PDF', state.quizExport.pdf);
  }
  return html;
}

function quizQuestionsHtml() {
  var quiz = state.quiz;
  if (!quiz) return '<div class="empty-inline">还没有生成试卷。设置题型与题量后点击“生成试卷”。</div>';
  var questions = Array.isArray(quiz.questions) ? quiz.questions : [];
  if (!questions.length) return '<div class="empty-inline">还没有生成试卷。设置题型与题量后点击“生成试卷”。</div>';
  return questions.map(renderQuestion).join('');
}

function renderQuestion(question) {
  var typeLabel = QUIZ_TYPE[question.type] || question.type || '';
  var options = Array.isArray(question.options) ? question.options : [];
  var optionHtml = Array.isArray(question.option_html) ? question.option_html : [];
  var citations = Array.isArray(question.citations) ? question.citations : [];
  var answer = question.answer;
  if (question.type === 'true_false') {
    if (String(answer) === 'true') answer = '正确';
    else if (String(answer) === 'false') answer = '错误';
  }
  var html = '<article class="quiz-question">'
    + '<div class="qq-head">'
    + '<span class="qq-idx">第 ' + toInt(question.idx) + ' 题</span>'
    + '<span class="badge badge-accent">' + esc(typeLabel) + '</span>'
    + '</div>'
    + '<div class="qq-stem">' + (question.stem_html || esc(question.stem || '')) + '</div>';
  if (options.length) {
    html += '<ul class="qq-options">' + options.map(function (option, index) {
      return '<li>' + String.fromCharCode(65 + index) + '. ' + (optionHtml[index] || esc(fmtCell(option))) + '</li>';
    }).join('') + '</ul>';
  }
  if (question.mathml) {
    html += '<div class="formula-display" aria-label="公式预览">' + question.mathml + '</div>';
  } else if (question.latex) {
    html += '<div class="formula-raw">' + esc(question.latex) + '</div>';
  }
  html += '<div class="qq-field"><span class="qq-k">答案</span>'
    + (question.type === 'true_false' ? esc(fmtCell(answer)) : (question.answer_html || esc(fmtCell(answer)))) + '</div>'
    + '<div class="qq-field"><span class="qq-k">解析</span>' + (question.explanation_html || esc(fmtCell(question.explanation))) + '</div>';
  if (citations.length) {
    html += '<div class="qq-field"><span class="qq-k">来源</span></div>'
      + '<div class="qq-sources">' + citations.map(function (citation) {
        var label = citation.filename || '来源';
        if (citation.page) label += ' · 第 ' + citation.page + ' 页';
        if (citation.heading_path) label += ' · ' + citation.heading_path;
        return '<span class="source-chip" title="' + esc(citation.snippet || '') + '">' + esc(label) + '</span>';
      }).join('') + '</div>';
  }
  html += '</article>';
  return html;
}

async function generateQuiz() {
  if (state.quizBusy) return;
  if (!state.quizZoneId) {
    state.quizError = '请选择知识区。';
    renderQuizTab();
    return;
  }
  var total = quizCountTotal();
  if (total < 1 || total > 20) {
    state.quizError = total < 1 ? '请至少选择一种题型并设置 1 道题。' : '单次最多生成 20 道题，请减少题量。';
    renderQuizTab();
    return;
  }
  var payload = {
    zone_id: state.quizZoneId,
    question_counts: {
      single_choice: state.quizCounts.single_choice,
      multiple_choice: state.quizCounts.multiple_choice,
      true_false: state.quizCounts.true_false,
      calculation: state.quizCounts.calculation
    }
  };
  if (state.quizMindmapId) payload.mindmap_id = state.quizMindmapId;
  state.quizBusy = true;
  state.quizError = '';
  state.quiz = null;
  state.quizExport = null;
  renderQuizTab();
  try {
    state.quiz = await apiPost('/quizzes', payload);
  } catch (err) {
    state.quizError = failMessage(err);
  } finally {
    state.quizBusy = false;
    renderQuizTab();
  }
}

async function exportQuiz() {
  if (!state.quiz || state.quizBusy) return;
  state.quizBusy = true;
  state.quizError = '';
  renderQuizTab();
  try {
    state.quizExport = await apiPost('/quizzes/' + encodeURIComponent(state.quiz.quiz_id) + '/export', {});
  } catch (err) {
    state.quizError = failMessage(err);
  } finally {
    state.quizBusy = false;
    renderQuizTab();
  }
}

  if (engine === 'word') return 'Microsoft Word';
  if (engine === 'wps') return 'WPS';

}

function simpleResultBox(result) {
  if (!result) return '';
  var kind = result.kind || '';
  return '<div class="result-box' + (kind ? ' ' + esc(kind) : '') + '">' + esc(result.text || '') + '</div>';
}

function renderSettings() {
  var main = $('#main');

    content = settingsHtml(state.settings);
  } else if (state.settingsError) {
    content = '<div class="card"><div class="card-body">'
      + '<div class="inline-error">' + esc(state.settingsError) + '</div>'

function usageTableHtml(usage) {
  if (!usage.length) {
    return '<div class="empty-inline">暂无用量记录。发起一次问答、出题、论文检查或 AI 导图后会写入真实调用日志。</div>';
  }
  var rows = usage.map(function (log) {
    var kind = USAGE_KIND[log.kind] || log.kind || '';
    var result = log.ok
      ? '<span class="badge badge-ok">成功</span>'
      : '<span class="badge badge-fail" title="' + esc(log.error || '') + '">失败</span>';
    return '<tr>'
      + '<td>' + esc(fmtTime(log.created_at)) + '</td>'
      + '<td' + (log.skill_name ? ' title="skill：' + esc(log.skill_name) + '"' : '') + '>' + esc(kind) + '</td>'
      + '<td>' + esc(log.model || '—') + '</td>'
      + '<td>' + toInt(log.prompt_tokens) + '</td>'
      + '<td>' + toInt(log.completion_tokens) + '</td>'
      + '<td>' + toInt(log.latency_ms) + ' ms</td>'
      + '<td>' + result + '</td>'
      + '</tr>';
  }).join('');
  return '<div class="table-wrap"><table class="table usage-table"><thead><tr>'
    + '<th>时间</th><th>类型</th><th>模型</th><th>输入token</th><th>输出token</th><th>耗时</th><th>结果</th>'
    + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function bindSettingsEvents() {
  var saveBtn = $('#settingsSaveBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveSettings);
  var testBtn = $('#settingsTestBtn');
  if (testBtn) testBtn.addEventListener('click', testConnection);
  var pdfBtn = $('#settingsPdfTestBtn');
  if (pdfBtn) pdfBtn.addEventListener('click', pdfSelfTest);
  var clearBtn = $('#settingsClearBtn');
  if (clearBtn) clearBtn.addEventListener('click', openClearModal);
  var apiKeyInput = $('#settingsApiKey');
  if (apiKeyInput) {
    apiKeyInput.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        saveSettings();
      }
    });
  }
}

async function loadSettings(force) {
  if (state.settingsLoading) return;
  if (state.settings && !force) return;
  state.settingsLoading = true;
  state.settingsError = '';
  if (state.view === 'settings') renderSettings();
  try {
    state.settings = await apiGet('/settings');
  } catch (err) {
    state.settings = null;
    state.settingsError = failMessage(err);
  } finally {
    state.settingsLoading = false;
  }
  if (state.view === 'settings') renderSettings();
}

async function saveSettings() {
  if (state.settingsBusy) return;
  var baseUrlInput = $('#settingsBaseUrl');
  var apiKeyInput = $('#settingsApiKey');
  var modelInput = $('#settingsModel');
  if (!baseUrlInput || !modelInput) return;
  var payload = { base_url: baseUrlInput.value.trim(), model: modelInput.value.trim() };
  var apiKey = apiKeyInput ? apiKeyInput.value.trim() : '';
  if (apiKey) payload.api_key = apiKey;
  if (state.settings) {
    state.settings.base_url = payload.base_url;
    state.settings.model = payload.model;
  }
  state.settingsBusy = true;
  state.settingsSaveResult = { kind: '', text: '正在保存…' };
  state.settingsTestResult = null;
  renderSettings();
  try {
    await apiPut('/settings', payload);
    state.settings = await apiGet('/settings');
    refreshHealth();
    state.settingsSaveResult = { kind: 'ok', text: '已保存。' };
    toast('已保存。', 'ok');
  } catch (err) {
    state.settingsSaveResult = { kind: 'fail', text: failMessage(err) };
  } finally {
    state.settingsBusy = false;
    if (state.view === 'settings') renderSettings();
  }
}

async function testConnection() {
  if (state.settingsBusy) return;
  state.settingsBusy = true;
  state.settingsTestResult = { kind: '', text: '正在测试模型连通…' };
  renderSettings();
  try {
    var result = await apiPost('/settings/test', {});
    state.settingsTestResult = {
      kind: result.ok ? 'ok' : 'fail',
      text: (result.ok ? '测试通过：' : '测试失败：') + (result.message || '')
    };
  } catch (err) {
    state.settingsTestResult = { kind: 'fail', text: failMessage(err) };
  } finally {
    state.settingsBusy = false;
    if (state.view === 'settings') renderSettings();
  }
}

async function pdfSelfTest() {
  if (state.settingsBusy) return;
  state.settingsBusy = true;
  state.settingsPdfResult = { kind: '', text: '正在运行 PDF 转换自检…' };
  renderSettings();
  try {
    var result = await apiPost('/settings/pdf-test', {});
    var text = '引擎：' + pdfEngineLabel(result.engine) + '；' + (result.message || '');
    state.settingsPdfResult = { kind: result.ok ? 'ok' : 'fail', text: text };
    if (state.settings && result.engine) state.settings.pdf_engine = result.engine;
  } catch (err) {
    state.settingsPdfResult = { kind: 'fail', text: failMessage(err) };
  } finally {
    state.settingsBusy = false;
    if (state.view === 'settings') renderSettings();
  }
}

function openClearModal() {
  var mask = openMask(
    '<div class="modal modal-sm">'
    + '<div class="modal-head"><h3>清空所有数据</h3>'
    + '<button type="button" class="icon-btn" data-mask-close="1">×</button></div>'
    + '<div class="modal-body">'
    + '<p class="confirm-text">将删除全部业务数据与上传/导出文件，保留模型配置。此操作不可恢复。</p>'
    + '<div class="field"><span>输入 CLEAR 确认</span>'
    + '<input type="text" id="clearConfirmInput" autocomplete="off" placeholder="CLEAR"></div>'
    + '<div id="clearError" class="inline-error" hidden></div>'
    + '</div>'
    + '<div class="modal-foot">'
    + '<button type="button" class="btn btn-outline" data-mask-close="1">取消</button>'
    + '<button type="button" class="btn btn-danger" id="clearConfirmBtn">确认清空</button>'
    + '</div></div>'
  );
  var input = $('#clearConfirmInput', mask);
  var errBox = $('#clearError', mask);
  var confirmBtn = $('#clearConfirmBtn', mask);
  mask.addEventListener('click', function (ev) {
    if (ev.target === mask || ev.target.closest('[data-mask-close]')) closeMask(mask);
  });
  async function doClear() {
    if (!input || input.value.trim() !== 'CLEAR') {
      if (errBox) { errBox.textContent = '请输入 CLEAR 以确认。'; errBox.hidden = false; }
      return;
    }
    if (confirmBtn) { confirmBtn.disabled = true; confirmBtn.textContent = '正在清空…'; }
    try {
      await apiPost('/data/clear', { confirm: 'CLEAR' });
      closeMask(mask);
      resetBusinessState();
      state.settingsSaveResult = null;
      state.settingsTestResult = null;
      state.settingsPdfResult = null;
      await refreshZones();
      await refreshConversations();
      state.settings = null;
      await loadSettings(true);
      renderShell();
      toast('已清空所有数据。', 'ok');
    } catch (err) {
      if (errBox) { errBox.textContent = failMessage(err); errBox.hidden = false; }
      if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.textContent = '确认清空'; }
    }
  }
  if (confirmBtn) confirmBtn.addEventListener('click', doClear);
  if (input) {
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        doClear();
      }
    });
    input.focus();
  }
}

var DEMO_ACCOUNTS_KEY = 'zhixu_demo_accounts_v1';
var DEMO_SESSION_KEY = 'zhixu_demo_session_v1';
var DEMO_SESSION_DAYS = 7;
var DEMO_ADMIN_USERNAME = '123456';
var DEMO_ADMIN_PASSWORD = '123456';
var DEMO_ADMIN_EMAIL = 'admin@zhixu.local';

function demoStorageGet(key, fallback) {
  try {
    var raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (err) {
    return fallback;
  }
}

function demoStorageSet(key, value) {
  try {
    window.localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (err) {
    return false;
  }
}

function demoStorageRemove(key) {
  try { window.localStorage.removeItem(key); } catch (err) { /* ignore */ }
}

function loadDemoAccounts() {
  var rows = demoStorageGet(DEMO_ACCOUNTS_KEY, []);
  return Array.isArray(rows) ? rows : [];
}

function saveDemoAccounts(rows) {
  return demoStorageSet(DEMO_ACCOUNTS_KEY, rows);
}

function demoMakeSalt() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

async function demoHashPassword(password, salt) {
  var text = salt + '|' + password;
  try {
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      var buffer = new window.TextEncoder().encode(text);
      var digest = await window.crypto.subtle.digest('SHA-256', buffer);
      return Array.prototype.map.call(new Uint8Array(digest), function (byte) {
        return ('0' + byte.toString(16)).slice(-2);
      }).join('');
    }
  } catch (err) { /* 回退到简单哈希（仅演示） */ }
  var hash = 2166136261;
  for (var i = 0; i < text.length; i += 1) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619) >>> 0;
  }
  return 'fnv1a-' + hash.toString(16) + '-' + text.length;
}

function readDemoSession() {
  var session = demoStorageGet(DEMO_SESSION_KEY, null);
  if (!session || !session.username) return null;
  if (!session.expiresAt || Date.now() > Number(session.expiresAt)) {
    demoStorageRemove(DEMO_SESSION_KEY);
    return null;
  }
  return session;
}

function writeDemoSession(account) {
  var session = {
    username: account.username,
    email: account.email || '',
    builtin: !!account.builtin,
    expiresAt: Date.now() + DEMO_SESSION_DAYS * 24 * 60 * 60 * 1000
  };
  demoStorageSet(DEMO_SESSION_KEY, session);
  return session;
}

function clearDemoSession() {
  demoStorageRemove(DEMO_SESSION_KEY);
}

  }).join('');

    + '<div class="auth-slide-actions" role="group" aria-label="播放控制">'
    + '<button type="button" data-auth-step="-1" aria-label="上一张" title="上一张">‹</button>'
    + '<button type="button" data-auth-play aria-label="暂停轮播" title="暂停轮播">Ⅱ</button>'
    + '<button type="button" data-auth-step="1" aria-label="下一张" title="下一张">›</button>'

function bindDemoAuthCarousel(page) {
  var carousel = $('.auth-carousel', page);
  var track = $('.auth-slide-track', carousel);
  var slides = carousel.querySelectorAll('.auth-slide');
  var dots = carousel.querySelectorAll('.auth-slide-dot');
  var play = $('[data-auth-play]', carousel);
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var playing = !reducedMotion.matches;
  var hovered = false;
  var index = 0;
  var timer;

  function schedule() {
    clearTimeout(timer);
    if (playing && !hovered && !document.hidden && !carousel.contains(document.activeElement)) {
      timer = setTimeout(function () { show(index + 1); }, 6500);
    }
  }
  function show(next) {
    index = (next + slides.length) % slides.length;
    track.style.transform = 'translateX(' + (-100 * index) + '%)';
    slides.forEach(function (slide, i) { slide.setAttribute('aria-hidden', String(i !== index)); });
    dots.forEach(function (dot, i) { dot.setAttribute('aria-current', String(i === index)); });
    schedule();
  }
  function updatePlayback() {
    var label = playing ? '暂停轮播' : '播放轮播';
    play.textContent = playing ? 'Ⅱ' : '▶';
    play.setAttribute('aria-label', label);
    play.title = label;
    schedule();
  }
  function updateMotion() {
    if (reducedMotion.matches) {
      playing = false;
      updatePlayback();
    }
  }

  carousel.addEventListener('click', function (event) {
    var button = event.target.closest('button');
    if (!button) return;
    if (button === play) {
      playing = !playing;
      updatePlayback();
    } else if (button.hasAttribute('data-auth-slide')) {
      show(Number(button.dataset.authSlide));
    } else {
      show(index + Number(button.dataset.authStep));
    }
  });
  carousel.addEventListener('keydown', function (event) {
    if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    event.preventDefault();
    show(index + (event.key === 'ArrowLeft' ? -1 : 1));
  });
  carousel.addEventListener('pointerenter', function (event) {
    if (event.pointerType === 'mouse') {
      hovered = true;
      schedule();
    }
  });
  carousel.addEventListener('pointerleave', function () {
    hovered = false;
    schedule();
  });
  carousel.addEventListener('focusin', schedule);
  carousel.addEventListener('focusout', function () { queueMicrotask(schedule); });
  document.addEventListener('visibilitychange', schedule);
  reducedMotion.addEventListener('change', updateMotion);
  updatePlayback();

  return function () {
    playing = false;
    clearTimeout(timer);
    document.removeEventListener('visibilitychange', schedule);
    reducedMotion.removeEventListener('change', updateMotion);
  };
}

function showSupabaseAuthPage(configured, failure) {
  if ($('#authPage')) return;
  document.body.classList.add('auth-locked');
  $('meta[name="viewport"]').content = 'width=device-width, initial-scale=1';
  document.title = '知序 · 登录';
  var page = document.createElement('div');
  var disabled = configured ? '' : ' disabled';
  page.id = 'authPage';
  page.className = 'auth-page';
  page.innerHTML = '<div class="auth-shell"><section class="auth-hero">'
    + '<div class="auth-brand"><span class="brand-mark">知</span><span class="auth-brand-name">知序</span></div>'
    + renderDemoAuthCarousel() + '</section><section class="auth-card">'
    + '<div class="auth-error" id="authError" role="alert" hidden></div>'
    + '<form id="authSupabaseForm" class="auth-form" autocomplete="on">'
    + '<h2 class="auth-form-title">登录知序</h2><p class="auth-form-sub">使用预建测试账号登录。</p>'
    + '<label class="auth-field"><span>邮箱</span><input type="email" id="authSupabaseEmail" autocomplete="username" maxlength="254" required' + disabled + '></label>'
    + '<label class="auth-field"><span>密码</span><input type="password" id="authSupabasePassword" autocomplete="current-password" maxlength="256" required' + disabled + '></label>'
    + '<button type="submit" class="auth-submit" id="authSupabaseSubmit"' + disabled + '>登录并进入</button>'
    + (!configured ? '<button type="button" class="link-btn" id="authRetry">重新检查连接</button>' : '')
    + '</form></section></div>';
  document.body.appendChild(page);
  disposeDemoAuthCarousel = bindDemoAuthCarousel(page);
  if (!configured) {
    demoAuthError(failure || 'Supabase 登录尚未配置。请配置后重新打开网站。');
    $('#authRetry').addEventListener('click', function () { window.location.reload(); });
    return;
  }
  $('#authSupabaseForm').addEventListener('submit', async function (event) {
    event.preventDefault();
    clearDemoAuthError();
    var email = $('#authSupabaseEmail');
    var password = $('#authSupabasePassword');
    var submit = $('#authSupabaseSubmit');
    if (submit.disabled) return;
    submit.disabled = true;
    submit.textContent = '正在登录…';
    try {
      var result = await apiPost('/auth/login', { email: email.value.trim(), password: password.value });
      if (!result.authenticated || !result.user) throw makeError('invalid_response', '登录服务未返回有效会话。');
      password.value = '';
      await startSupabaseApp(result.user, true);
    } catch (err) {
      demoAuthError(err.message || '登录失败，请重试。', '#authSupabasePassword');
    } finally {
      submit.disabled = false;
      submit.textContent = '登录并进入';
    }
  });
}

function bindDemoAuthEvents() {
  var page = $('#authPage');
  if (!page) return;
  page.addEventListener('click', function (ev) {
    var tabBtn = ev.target.closest('[data-auth-tab]');
    if (tabBtn) {
      ev.preventDefault();
      setDemoAuthTab(tabBtn.getAttribute('data-auth-tab'));
      return;
    }
    var goto = ev.target.closest('[data-auth-goto]');
    if (goto) {
      ev.preventDefault();
      setDemoAuthTab(goto.getAttribute('data-auth-goto'));
    }
  });

  var loginForm = $('#authLoginForm');
  if (loginForm) {
    loginForm.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      clearDemoAuthError();
      var nameInput = $('#authLoginName');
      var passInput = $('#authLoginPass');
      var name = nameInput ? nameInput.value.trim() : '';
      var password = passInput ? passInput.value : '';
      if (!name) return demoAuthError('请输入用户名。', '#authLoginName');
      if (!password) return demoAuthError('请输入密码。', '#authLoginPass');
      if (name === DEMO_ADMIN_USERNAME && password === DEMO_ADMIN_PASSWORD) {
        var adminAccount = {
          username: DEMO_ADMIN_USERNAME,
          email: DEMO_ADMIN_EMAIL,
          builtin: true
        };
        startDemoApp(writeDemoSession(adminAccount), true);
        return;
      }
      var account = null;
      loadDemoAccounts().some(function (item) {
        if (item.username === name) { account = item; return true; }
        return false;
      });
      if (!account) return demoAuthError('该账号不存在，请先注册。', '#authLoginName');
      var btn = $('#authLoginBtn');
      if (btn) btn.disabled = true;
      var hash = await demoHashPassword(password, account.salt || '');
      if (btn) btn.disabled = false;
      if (hash !== account.hash) return demoAuthError('密码不正确，请重试。', '#authLoginPass');
      var session = writeDemoSession(account);
      startDemoApp(session, true);
    });
  }

  var registerForm = $('#authRegisterForm');
  if (registerForm) {
    registerForm.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      clearDemoAuthError();
      var nameInput = $('#authRegName');
      var emailInput = $('#authRegEmail');
      var passInput = $('#authRegPass');
      var pass2Input = $('#authRegPass2');
      var username = nameInput ? nameInput.value.trim() : '';
      var email = emailInput ? emailInput.value.trim() : '';
      var password = passInput ? passInput.value : '';
      var password2 = pass2Input ? pass2Input.value : '';
      if (!/^[\u4e00-\u9fa5A-Za-z0-9_]{3,20}$/.test(username)) {
        return demoAuthError('用户名需为 3–20 位中文、字母、数字或下划线。', '#authRegName');
      }
      if (username === DEMO_ADMIN_USERNAME) {
        return demoAuthError('该用户名为系统管理员保留，请换一个。', '#authRegName');
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email.length > 80) {
        return demoAuthError('请输入有效的邮箱地址。', '#authRegEmail');
      }
      if (password.length < 8 || password.length > 64) {
        return demoAuthError('密码长度需为 8–64 位。', '#authRegPass');
      }
      if (password !== password2) {
        return demoAuthError('两次输入的密码不一致。', '#authRegPass2');
      }
      var accounts = loadDemoAccounts();
      var duplicated = accounts.some(function (item) {
        return item.username === username || (item.email || '').toLowerCase() === email.toLowerCase();
      });
      if (duplicated) return demoAuthError('该用户名或邮箱已被注册，请直接登录。', '#authRegName');
      var btn = $('#authRegBtn');
      if (btn) btn.disabled = true;
      var salt = demoMakeSalt();
      var hash = await demoHashPassword(password, salt);
      var account = {
        username: username,
        email: email,
        salt: salt,
        hash: hash,
        createdAt: new Date().toISOString()
      };
      accounts.push(account);
      var saved = saveDemoAccounts(accounts);
      if (btn) btn.disabled = false;
      if (!saved) return demoAuthError('当前浏览器禁用了本地存储，无法保存账号。', '#authRegName');
      var session = writeDemoSession(account);
      startDemoApp(session, true);
    });
  }
}

/* =========================================================
 * boot
 * ========================================================= */
async function boot() {
  loadUiState();
  bindShell();
  renderShell();
  refreshHealth();
  await refreshZones();
  await refreshNodes();
  await refreshConversations();
  if (!state.currentConversationId && state.conversations.length) {
    var firstConv = state.conversations[0];
    state.currentConversationId = firstConv.id;
    state.currentConversation = firstConv;
    if (firstConv.zone_id) state.currentZoneId = firstConv.zone_id;
    try { await loadMessages(firstConv.id); } catch (err) { /* 保持空会话界面 */ }
    var lastBootMessage = lastAssistantMessage();
    state.activeMessageId = lastBootMessage ? lastBootMessage.id : null;
  }
  if (!state.currentZoneId && state.zones.length) state.currentZoneId = state.zones[0].id;
  route();
}

function enterDemoAuthMode() {
  activeAuthMode = 'demo';
  var session = readDemoSession();
  if (session) {
    startDemoApp(session, false);
  } else {
    showDemoAuthPage();
  }
}

(async function initAuthGate() {
  document.body.classList.add('auth-locked');
  var status;
  try {
    status = await apiGet('/auth/session');
  } catch (err) {
    showSupabaseAuthPage(false, err.message || '无法连接登录服务。');
    return;
  }
  if (status.mode === 'demo') {
    enterDemoAuthMode();
    return;
  }
  activeAuthMode = 'supabase';
  clearDemoSession();
  if (status.authenticated && status.user) await startSupabaseApp(status.user, false);
  else showSupabaseAuthPage(Boolean(status.configured));
})();

})();
