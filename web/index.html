  stage.innerHTML = '<div class="kg-toolbar">'
    + '<div class="kg-chips" role="group" aria-label="星图范围">' + kgButtonGroup('data-kg-scope', { all: '全区', local: '局部' }, state.libraryGraphScope) + '</div>'
    + '<input id="kgSearch" class="kg-search" type="search" aria-label="搜索星图" placeholder="搜索星图…" value="' + esc(state.libraryGraphQuery) + '">'
    + '<details class="kg-filter-menu"><summary>筛选</summary><div class="kg-filter-items">'
    + filterOptions(types, state.libraryGraphFilters, 'data-kg-filter') + '<hr>'
    + filterOptions(KG_EDGE_LABELS, state.libraryGraphEdges, 'data-kg-edge')
    + '<hr><label>局部层数 <select id="kgDepth">'
    + [1, 2, 3].map(function (depth) { return '<option' + (depth === state.libraryGraphDepth ? ' selected' : '') + '>' + depth + '</option>'; }).join('')
    + '</select></label></div></details>'
    + '<div class="kg-zoom"><button type="button" data-kg-zoom="in" aria-label="放大">＋</button>'
    + '<button type="button" data-kg-zoom="out" aria-label="缩小">−</button>'
    + '<button type="button" data-kg-zoom="reset">适应视图</button>'
    + '<button type="button" data-kg-action="layout">重置布局</button>'
    + '<button type="button" data-kg-action="refresh" aria-label="刷新星图">↻</button></div></div>'
    + '<div class="kg-field"><svg id="kgSvg" class="kg-svg" role="group" aria-label="知识区关系星图"><g id="kgViewport"></g></svg>'
    + '<div id="kgSearchStatus" class="kg-search-status" role="status"></div><div class="kg-legend">' + legend + '</div></div>'
    + '<aside id="kgDetail" class="kg-detail" aria-label="节点详情"></aside>';
  kgDrawScene();
  if (graph.fit !== false) kgResetView();
  else kgApplyTransform();
  var field = stage.querySelector('.kg-field');
  kgResizeObserver = new ResizeObserver(function () {
    if (graph.fit !== false) kgResetView();
  });
  kgResizeObserver.observe(field);
}

async function loadLibraryGraph(force) {
  var zoneId = state.libraryZoneId;
  var zone = zoneById(zoneId);
  if (!zone || (!force && (state.libraryGraphZoneId === zoneId || state.libraryGraphBusy === zoneId))) return;
  var request = ++kgRequest;
  state.libraryGraphBusy = zoneId;
  state.libraryGraphError = '';
  if (!$('#kgSvg')) renderLibraryGraph();
  try {
    var results = await Promise.all([
      apiGet('/documents?zone_id=' + encodeURIComponent(zoneId)),
      apiGet('/notes').catch(function () { return null; }),
      apiGet('/mindmaps?zone_id=' + encodeURIComponent(zoneId)).catch(function () { return null; })
    ]);
    if (request !== kgRequest || state.libraryZoneId !== zoneId) return;
    var docs = Array.isArray(results[0]) ? results[0] : [];
    var notes = (results[1] || []).filter(function (note) { return note.zone_id === zoneId; });
    var maps = results[2] || [];
    var graph = kgBuildGraph(zone, docs, notes, maps);
    var previous = state.libraryGraph;
    kgLayout(graph);
    if (previous && previous.zone.id === zoneId) {
      graph.nodes.forEach(function (node) {
        var old = previous.byId[node.id];
        if (old) { node.x = old.x; node.y = old.y; node.pinned = old.pinned; }
      });
      graph.fit = previous.fit;
    } else kgRestorePositions(graph);
    state.libraryGraph = graph;
    state.libraryGraphZoneId = zoneId;
    if (!graph.byId[state.libraryGraphSelected]) state.libraryGraphSelected = null;
    if (state.libraryDocumentId && !graph.byId['doc:' + state.libraryDocumentId]) state.libraryDocumentId = null;
    if (results[1] === null || results[2] === null) toast('部分笔记或导图未能加载。', 'error');
  } catch (err) {
    if (request !== kgRequest || state.libraryZoneId !== zoneId) return;
    state.libraryGraphError = '星图加载失败，' + failMessage(err);
    if (state.libraryView === 'list' || state.libraryGraph?.zone.id === zoneId) toast(failMessage(err), 'error');
  } finally {
    if (request === kgRequest) {
      state.libraryGraphBusy = null;
      if (state.view === 'library' && state.libraryZoneId === zoneId) {
        renderZoneList();
        if (state.libraryView === 'graph') renderLibraryGraph();
        else renderLibraryDocs();
      }
    }
  }
}

function kgLayout(graph) {
  kgInitialLayout(graph);
  graph.links.forEach(function (link) {
    var a = graph.byId[link.source], b = graph.byId[link.target];
    link.rest = Math.max(40, Math.hypot(a.x - b.x, a.y - b.y));
  });
}

function kgScreenToGraph(svg, clientX, clientY) {
  var box = svg.getBoundingClientRect();
  return { x: (clientX - box.left - state.libraryGraphPanX) / state.libraryGraphScale,
    y: (clientY - box.top - state.libraryGraphPanY) / state.libraryGraphScale };
}

function kgZoom(factor, point) {
  var svg = $('#kgSvg');
  if (!svg) return;
  var graph = state.libraryGraph;
  var old = state.libraryGraphScale;
  var next = Math.max(.035, Math.min(4, old * factor));
  var x = point ? point.x : svg.clientWidth / 2;
  var y = point ? point.y : svg.clientHeight / 2;
  state.libraryGraphPanX = x - (x - state.libraryGraphPanX) * next / old;
  state.libraryGraphPanY = y - (y - state.libraryGraphPanY) * next / old;
  state.libraryGraphScale = next;
  graph.fit = false;
  kgApplyTransform();
}

function kgResetView() {
  var graph = state.libraryGraph;
  var svg = $('#kgSvg');
  if (!graph || !svg || !svg.clientWidth || !svg.clientHeight) return;
  var bounds = kgVisibleScene(graph).nodes.reduce(function (box, node) {
    box.left = Math.min(box.left, node.x - node.r);
    box.right = Math.max(box.right, node.x + node.r);
    box.top = Math.min(box.top, node.y - node.r);
    box.bottom = Math.max(box.bottom, node.y + node.r + 16);
    return box;
  }, { left: Infinity, right: -Infinity, top: Infinity, bottom: -Infinity });
  if (!Number.isFinite(bounds.left)) return;
  var width = svg.clientWidth, height = svg.clientHeight;
  var scale = Math.max(.035, Math.min(1.55, (width - 75) / (bounds.right - bounds.left),
    (height - 100) / (bounds.bottom - bounds.top)));
  state.libraryGraphScale = scale;
  state.libraryGraphPanX = width / 2 - (bounds.left + bounds.right) * scale / 2;
  state.libraryGraphPanY = (height - 22) / 2 - (bounds.top + bounds.bottom) * scale / 2;
  graph.fit = true;
  kgApplyTransform();
}

function invalidateLibraryGraph() {
  state.libraryGraphZoneId = null;
  if (state.view === 'library') loadLibraryGraph(true);
}

function kgSelect(id, fit) {
  var graph = state.libraryGraph;
  if (!graph) return;
  var node = graph.byId[id];
  state.libraryGraphSelected = node ? node.id : null;
  state.libraryDocumentId = node && node.kind === 'document' ? node.meta.id : null;
  state.libraryNodeId = node && node.kind === 'knowledge' ? node.meta.id
    : node && node.kind === 'document' ? node.meta.node_id : null;
  if (node && state.libraryGraphFilters[node.kind] === false) {
    state.libraryGraphFilters[node.kind] = true;
    var filter = $('#libraryGraph [data-kg-filter="' + node.kind + '"]');
    if (filter) filter.checked = true;
  }
  if (state.libraryNodeId) {
    for (var ancestor = nodeById(state.libraryNodeId); ancestor; ancestor = nodeById(ancestor.parent_id)) {
      state.libraryCollapsedNodes.delete(ancestor.id);
    }
  }
  renderZoneList();
  kgDrawScene();
  if (fit || state.libraryGraphScope === 'local') kgResetView();
}

function kgOpenNode(node) {
  if (node && node.kind === 'note') {
    if (!confirmScholarSwitch()) return;
    setView('notes');
    runScholarAction('正在打开笔记…', async function (stillCurrent) {
      var note = await apiGet('/notes/' + encodeURIComponent(node.meta.id));
      if (stillCurrent() && state.view === 'notes') activateScholarNote(note);
    });
    return;
  }
  if (node && node.kind === 'mindmap') {
    state.mapZoneId = state.libraryZoneId;
    setView('map');
    openMap(node.meta.id);
    return;
  }
  if (!node) kgSelect(null);
  state.libraryView = 'list';
  renderLibrary();
}

function bindLibraryGraphEvents(stage) {
  stage.addEventListener('click', function (event) {
    var button = event.target.closest('[data-kg-scope], [data-kg-zoom], [data-kg-action], [data-kg-related], [data-kg-node]');
    if (!button) return;
    if (button.dataset.kgAction === 'refresh') { loadLibraryGraph(true); return; }
    var graph = state.libraryGraph;
    if (!graph) return;
    if (button.dataset.kgZoom) {
      var zoom = button.dataset.kgZoom;
      if (zoom === 'reset') kgResetView();
      else kgZoom(zoom === 'in' ? 1.2 : 1 / 1.2);
    } else if (button.dataset.kgScope) {
      state.libraryGraphScope = button.dataset.kgScope;
      stage.querySelectorAll('[data-kg-scope]').forEach(function (item) {
        item.setAttribute('aria-pressed', String(item === button));
      });
      kgDrawScene();
      kgResetView();
    } else if (button.dataset.kgNode || button.dataset.kgRelated) {
      if (state.libraryGraphSuppressClick) return;
      kgSelect(button.dataset.kgNode || button.dataset.kgRelated);
    } else if (button.dataset.kgAction === 'close') {
      kgSelect(null);
    } else if (button.dataset.kgAction === 'layout') {
      kgStopTicker();
      graph.nodes.forEach(function (node) { node.pinned = false; });
      kgLayout(graph);
      kgClearPositions(graph.zone.id);
      graph.fit = true;
      renderLibraryGraph();
    } else if (button.dataset.kgAction === 'pin') {
      var selected = graph.byId[state.libraryGraphSelected];
      selected.pinned = !selected.pinned;
      selected.vx = selected.vy = 0;
      kgStorePositions(graph);
      kgDrawScene();
      $('#kgDetail [data-kg-action="pin"]').focus({ preventScroll: true });
    } else {
      kgOpenNode(button.dataset.kgAction === 'open' ? graph.byId[state.libraryGraphSelected] : null);
    }
  });
  stage.addEventListener('input', function (event) {
    if (event.target.id === 'kgSearch') {
      state.libraryGraphQuery = event.target.value;
      kgDrawScene();
    }
  });
  stage.addEventListener('change', function (event) {
    var item = event.target;
    if (item.dataset.kgFilter) {
      state.libraryGraphFilters[item.dataset.kgFilter] = item.checked;
      if (state.libraryGraph.byId[state.libraryGraphSelected]?.kind === item.dataset.kgFilter && !item.checked) kgSelect(null);
      else kgDrawScene();
    } else if (item.dataset.kgEdge) {
      state.libraryGraphEdges[item.dataset.kgEdge] = item.checked;
      kgDrawScene();
      if (state.libraryGraphScope === 'local') kgResetView();
    } else if (item.id === 'kgDepth') {
      state.libraryGraphDepth = Number(item.value);
      if (state.libraryGraphScope === 'local') {
        kgDrawScene();
        kgResetView();
      }
    }
  });
  stage.addEventListener('keydown', function (event) {
    var node = event.target.closest('[data-kg-node]');
    if (!node || (event.key !== 'Enter' && event.key !== ' ')) return;
    event.preventDefault();
    kgSelect(node.dataset.kgNode);
  });
  stage.addEventListener('pointerdown', function (event) {
    var svg = event.target.closest('#kgSvg');
    if (!svg || event.button !== 0 || state.libraryGraphDrag) return;
    var nodeEl = event.target.closest('[data-kg-node]');
    var graph = state.libraryGraph;
    var node = nodeEl && graph.byId[nodeEl.dataset.kgNode];
    if (node && node.pinned) return;
    var point = kgScreenToGraph(svg, event.clientX, event.clientY);
    state.libraryGraphSuppressClick = false;
    state.libraryGraphDrag = {
      pointerId: event.pointerId, id: node ? node.id : null, moved: false,
      clientX: event.clientX, clientY: event.clientY,
      offsetX: node ? node.x - point.x : state.libraryGraphPanX,
      offsetY: node ? node.y - point.y : state.libraryGraphPanY
    };
  });
  stage.addEventListener('pointermove', function (event) {
    var drag = state.libraryGraphDrag;
    if (!drag || drag.pointerId !== event.pointerId) return;
    var svg = $('#kgSvg');
    var graph = state.libraryGraph;
    var dx = event.clientX - drag.clientX, dy = event.clientY - drag.clientY;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 4) return;
      drag.moved = true;
      svg.setPointerCapture(event.pointerId);
    }
    if (!drag.id) {
      state.libraryGraphPanX = drag.offsetX + dx;
      state.libraryGraphPanY = drag.offsetY + dy;
      graph.fit = false;
      kgApplyTransform();
      return;
    }
    var node = graph.byId[drag.id];
    var point = kgScreenToGraph(svg, event.clientX, event.clientY);
    node.x = point.x + drag.offsetX;
    node.y = point.y + drag.offsetY;
    node.vx = node.vy = 0;
    graph.fit = false;
    graph.alpha = .85;
    kgApplyPositions(graph);
    kgStartTicker();
  });
  function endDrag(event) {
    var drag = state.libraryGraphDrag;
    if (!drag || drag.pointerId !== event.pointerId) return;
    state.libraryGraphDrag = null;
    if (drag.moved) {
      state.libraryGraphSuppressClick = true;
      if (drag.id && state.libraryGraph) kgStorePositions(state.libraryGraph);
      requestAnimationFrame(function () { state.libraryGraphSuppressClick = false; });
    }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('lostpointercapture', endDrag);
  stage.addEventListener('pointerleave', function (event) {
    if (state.libraryGraphDrag && !state.libraryGraphDrag.moved) endDrag(event);
  });
  stage.addEventListener('wheel', function (event) {
    var svg = event.target.closest('#kgSvg');
    if (!svg) return;
    event.preventDefault();
    var box = svg.getBoundingClientRect();
    kgZoom(event.deltaY < 0 ? 1.12 : 1 / 1.12, { x: event.clientX - box.left, y: event.clientY - box.top });
  }, { passive: false });
}
function bindLibraryEvents() {
  $$('[data-lib-view]').forEach(function (button) {
    button.addEventListener('click', function () {
      var view = button.getAttribute('data-lib-view');
      if (view === state.libraryView) return;
      state.libraryView = view;
      renderLibrary();
    });
  });
  var graphEl = $('#libraryGraph');
  if (graphEl) bindLibraryGraphEvents(graphEl);
  var newZone = $('#libNewZoneBtn');
  if (newZone) newZone.addEventListener('click', function () { openZoneModal('create', null); });
  var emptyNew = $('#libEmptyNewZone');
  if (emptyNew) emptyNew.addEventListener('click', function () { openZoneModal('create', null); });
  var uploadTop = $('#libUploadBtn');
  if (uploadTop) uploadTop.addEventListener('click', function () { openUploadModal(state.libraryZoneId, state.libraryNodeId); });

  var zoneList = $('#zoneList');
  if (zoneList) {
    bindLibraryTreeDrag(zoneList);
    zoneList.addEventListener('click', function (ev) {
      var addRoot = ev.target.closest('[data-node-add-root]');
      if (addRoot) {
        ev.stopPropagation();
        openNodeModal('create', addRoot.getAttribute('data-node-add-root'), null);
        return;
      }
      var addChild = ev.target.closest('[data-node-add]');
      if (addChild) {
        ev.stopPropagation();
        var parent = nodeById(addChild.getAttribute('data-node-add'));
        if (parent) openNodeModal('create', parent.zone_id, parent);
        return;
      }
      var renameNode = ev.target.closest('[data-node-rename]');
      if (renameNode) {
        ev.stopPropagation();
        var renameTarget = nodeById(renameNode.getAttribute('data-node-rename'));
        if (renameTarget) openNodeModal('rename', renameTarget.zone_id, renameTarget);
        return;
      }
      var delNode = ev.target.closest('[data-node-del]');
      if (delNode) {
        ev.stopPropagation();
        deleteNode(delNode.getAttribute('data-node-del'));
        return;
      }
      var toggle = ev.target.closest('[data-tree-toggle]');
      if (toggle) {
        var id = toggle.dataset.treeToggle;
        if (state.libraryCollapsedNodes.has(id)) state.libraryCollapsedNodes.delete(id);
        else state.libraryCollapsedNodes.add(id);
        renderZoneList();
        return;
      }
      var file = ev.target.closest('[data-tree-doc]');
      if (file) {
        var graph = state.libraryGraph;
        var doc = graph && graph.byId['doc:' + file.dataset.treeDoc];
        if (doc) {
          kgSelect(doc.id, true);
          if (state.libraryView === 'list') {
            renderLibraryDocs();
            loadLibraryDocs();
          }
        }
        return;
      }
      var note = ev.target.closest('[data-tree-note]');
      if (note) {
        var noteId = 'note:' + note.dataset.treeNote;
        if (state.libraryView === 'graph') kgSelect(noteId, true);
        else kgOpenNode(state.libraryGraph.byId[noteId]);
        return;
      }
      var all = ev.target.closest('[data-tree-all]');
      if (all) {
        selectLibraryNode(null);
        return;
      }
      var nodeItem = ev.target.closest('[data-node-id]');
      if (nodeItem) {
        selectLibraryNode(nodeItem.getAttribute('data-node-id'));
        return;
      }
      var rename = ev.target.closest('[data-zone-rename]');
      if (rename) {
        ev.stopPropagation();
        var target = zoneById(rename.getAttribute('data-zone-rename'));
        if (target) openZoneModal('rename', target);
        return;
      }
      var del = ev.target.closest('[data-zone-del]');
      if (del) {
        ev.stopPropagation();
        deleteZone(del.getAttribute('data-zone-del'));
        return;
      }
      var item = ev.target.closest('[data-zone-id]');
      if (item) selectLibraryZone(item.getAttribute('data-zone-id'));
    });
  }

  var docsBody = $('#docsBody');
  if (docsBody) {
    docsBody.addEventListener('click', function (ev) {
      var reindexBtn = ev.target.closest('[data-doc-reindex]');
      if (reindexBtn) {
        reindexDocument(reindexBtn.getAttribute('data-doc-reindex'));
        return;
      }
      var del = ev.target.closest('[data-doc-del]');
      if (del) deleteDocument(del.getAttribute('data-doc-del'));
    });
    docsBody.addEventListener('change', function (ev) {
      var picker = ev.target.closest('[data-doc-node-select]');
      if (picker) moveDocumentNode(picker.getAttribute('data-doc-node-select'), picker.value);
    });
  }
}

function renderZoneList() {
  var box = $('#zoneList');
  if (!box) return;
  var graph = state.libraryGraph && state.libraryGraph.zone.id === state.libraryZoneId ? state.libraryGraph : null;
  var children = new Map(), files = new Map();
  function group(map, key, row) {
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(row);
  }
  nodesForZone(state.libraryZoneId).sort(function (a, b) {
    return (toInt(a.sort_order) - toInt(b.sort_order)) || String(a.name).localeCompare(String(b.name), 'zh-CN');
  }).forEach(function (node) { group(children, node.parent_id || '', node); });
  var counts = new Map();
  function count(node) {
    var total = toInt(node.doc_count);
    (children.get(node.id) || []).forEach(function (child) { total += count(child); });
    counts.set(node.id, total);
    return total;
  }
  (children.get('') || []).forEach(count);
  if (graph) graph.docs.forEach(function (doc) {
    group(files, graph.byId['node:' + doc.node_id] ? doc.node_id : '', doc);
  });

  function leaves(nodeId) {
    return (files.get(nodeId) || []).map(function (doc) {
      var status = docStatusInfo(doc.status);
      var name = doc.filename || '未命名资料';
      return '<button type="button" class="library-tree-file' + (state.libraryDocumentId === doc.id ? ' active' : '')
        + '" draggable="true" data-tree-doc="' + esc(doc.id) + '" aria-label="' + esc(name) + '" title="' + esc(name + ' · ' + status.label) + '">'
        + '<span class="library-tree-type">' + esc(extLabel(doc.ext)) + '</span><span class="tree-name">' + esc(name) + '</span>'
        + '<span class="library-tree-status ' + status.cls + '">' + esc(status.label) + '</span></button>';
    }).join('');
  }

  function branch(parentId) {
    return (children.get(parentId) || []).map(function (node) {
      var id = esc(node.id);
      var active = state.libraryNodeId === node.id && !state.libraryDocumentId;
      var expanded = !state.libraryCollapsedNodes.has(node.id);
      var hasChildren = children.has(node.id) || files.has(node.id);
      return '<div class="tree-node library-drop-target' + (active ? ' active' : '') + '" data-tree-drop="' + id + '">'
        + (hasChildren ? '<button type="button" class="library-tree-toggle" data-tree-toggle="' + id
          + '" aria-expanded="' + expanded + '" aria-label="' + (expanded ? '折叠 ' : '展开 ') + esc(node.name)
          + '">' + (expanded ? '▾' : '▸') + '</button>' : '<span class="tree-mark" aria-hidden="true">·</span>')
        + '<button type="button" class="library-tree-label" data-node-id="' + id + '" title="' + esc(node.path || node.name) + '">'
        + '<span class="tree-name">' + esc(node.name) + '</span></button>'
        + '<span class="tree-count">' + counts.get(node.id) + '</span><span class="tree-actions">'
        + '<button type="button" class="icon-btn" data-node-add="' + id + '" aria-label="新增子节点" title="新增子节点">+</button>'
        + '<button type="button" class="icon-btn" data-node-rename="' + id + '" aria-label="重命名节点" title="重命名节点">✎</button>'
        + '<button type="button" class="icon-btn" data-node-del="' + id + '" aria-label="删除节点" title="删除节点">×</button>'
        + '</span></div>'
        + (hasChildren && expanded ? '<div class="library-tree-children">' + branch(node.id)
          + '<div class="library-tree-files">' + leaves(node.id) + '</div></div>' : '');
    }).join('');
  }

  var focused = document.activeElement;
  var focusAttr = focused && box.contains(focused) && focused.getAttributeNames().find(function (name) { return name.startsWith('data-'); });
  var focusValue = focusAttr ? focused.getAttribute(focusAttr) : null;
  box.innerHTML = state.zones.map(function (zone) {
    var id = esc(zone.id);
    var active = zone.id === state.libraryZoneId;
    var html = '<div class="zone-item' + (active ? ' active' : '') + '">'
      + '<button type="button" class="zi-main library-tree-label" data-zone-id="' + id + '" aria-expanded="' + active + '">'
      + '<span class="zi-name tree-name">' + esc(zone.name) + '</span>'
      + '<span class="zi-meta">' + toInt(zone.doc_count) + ' 份资料</span></button>'
      + '<span class="zi-actions">'
      + '<button type="button" class="icon-btn" data-node-add-root="' + id + '" aria-label="新建知识节点" title="新建知识节点">+</button>'
      + '<button type="button" class="icon-btn" data-zone-rename="' + id + '" aria-label="重命名知识区" title="重命名知识区">✎</button>'
      + '<button type="button" class="icon-btn" data-zone-del="' + id + '" aria-label="删除知识区" title="删除知识区">×</button>'
      + '</span></div>';
    if (!active) return html;
    html += '<div class="tree-branch"><button type="button" class="tree-all library-drop-target'
      + (!state.libraryNodeId && !state.libraryDocumentId ? ' active' : '') + '" data-tree-all data-tree-drop="">'
      + '<span class="tree-name">全部资料</span><span class="tree-count">' + toInt(zone.doc_count) + '</span></button>'
      + branch('');
    if (files.has('')) {

        + graph.notes.map(function (note) {

  if (focusAttr) {
    var match = Array.from(box.querySelectorAll('button[' + focusAttr + ']')).find(function (button) {
      return button.getAttribute(focusAttr) === focusValue;
    });
    if (match) match.focus({ preventScroll: true });
  }
}

function bindLibraryTreeDrag(tree) {
  var draggedId = null;
  var transferType = 'application/x-zhixu-document';
  function clearTarget() {
    var old = tree.querySelector('.is-drop-target');
    if (old) old.classList.remove('is-drop-target');
  }
  tree.addEventListener('dragstart', function (event) {
    var doc = event.target.closest('[data-tree-doc]');
    if (!doc) return;
    draggedId = doc.dataset.treeDoc;
    event.dataTransfer.setData(transferType, draggedId);
    event.dataTransfer.effectAllowed = 'move';
  });
  tree.addEventListener('dragover', function (event) {
    var target = event.target.closest('[data-tree-drop]');
    if (!draggedId || !target) { clearTarget(); return; }
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    if (!target.classList.contains('is-drop-target')) {
      clearTarget();
      target.classList.add('is-drop-target');
    }
  });
  tree.addEventListener('dragleave', function (event) {
    if (!tree.contains(event.relatedTarget)) clearTarget();
  });
  tree.addEventListener('drop', function (event) {
    var target = event.target.closest('[data-tree-drop]');
    if (!draggedId || !target) return;
    event.preventDefault();
    var graph = state.libraryGraph;
    var nodeId = target.dataset.treeDrop || null;
    var doc = graph && graph.byId['doc:' + event.dataTransfer.getData(transferType)];
    if (doc && doc.meta.zone_id === state.libraryZoneId && (doc.meta.node_id || null) !== nodeId) {
      moveDocumentNode(doc.meta.id, nodeId);
    }
    draggedId = null;
    clearTarget();
  });
  tree.addEventListener('dragend', function () {
    draggedId = null;
    clearTarget();
  });
}
function libraryDocTreeHtml(docs) {
  var zone = zoneById(state.libraryZoneId);
  if (!zone) return '<div class="kg-doc-empty">请选择一个知识区。</div>';
  if (!docs.length) return '<div class="kg-doc-empty">当前范围内还没有资料。</div>';
  var groups = {};
  docs.forEach(function (doc) {
    var key = doc.node_id && nodeById(doc.node_id) ? doc.node_id : '__none';
    if (!groups[key]) groups[key] = [];
    groups[key].push(doc);
  });
  var ordered = state.knowledgeNodes.filter(function (node) {
    return node.zone_id === zone.id && groups[node.id];
  }).sort(function (a, b) { return String(a.path || a.name).localeCompare(String(b.path || b.name), 'zh-CN'); });
  var html = '<div class="kg-doc-tree">';
  ordered.forEach(function (node) {
    html += '<details class="kg-doc-group" open><summary><span>' + esc(node.path || node.name) + '</span>'
      + '<span class="kg-folder-count">' + groups[node.id].length + ' 份</span></summary><div class="kg-doc-rows">'
      + groups[node.id].map(documentListItemHtml).join('') + '</div></details>';
  });
  if (groups.__none) {
    html += '<details class="kg-doc-group" open><summary><span>未分类</span>'
      + '<span class="kg-folder-count">' + groups.__none.length + ' 份</span></summary><div class="kg-doc-rows">'
      + groups.__none.map(documentListItemHtml).join('') + '</div></details>';
  }
  return html + '</div>';
}

async function loadLibraryDocs(force) {
  var zoneId = state.libraryZoneId;
  var nodeId = state.libraryNodeId || '';
  if (!zoneId) {
    state.libraryDocs = [];
    state.libraryDocsZoneId = null;
    state.libraryDocsNodeId = null;
    renderLibraryDocs();
    return;
  }
  if (!force && state.libraryDocsZoneId === zoneId && (state.libraryDocsNodeId || '') === nodeId) return;
  var request = ++libraryDocsRequest;
  state.libraryBusy = true;
  renderLibraryDocs();
  try {
    var query = '/documents?zone_id=' + encodeURIComponent(zoneId);
    if (nodeId) query += '&node_id=' + encodeURIComponent(nodeId);
    var rows = await apiGet(query);
    if (request !== libraryDocsRequest || state.libraryZoneId !== zoneId || (state.libraryNodeId || '') !== nodeId) return;
    state.libraryDocs = Array.isArray(rows) ? rows : [];
    state.libraryDocsZoneId = zoneId;
    state.libraryDocsNodeId = nodeId;
  } catch (err) {
    if (request === libraryDocsRequest && state.libraryZoneId === zoneId && (state.libraryNodeId || '') === nodeId) {
      toast(failMessage(err), 'error');
      state.libraryDocs = [];
      state.libraryDocsZoneId = zoneId;
      state.libraryDocsNodeId = nodeId;
    }
  } finally {
    if (request === libraryDocsRequest && state.libraryZoneId === zoneId && (state.libraryNodeId || '') === nodeId) {
      state.libraryBusy = false;
      renderLibraryDocs();
    }
  }
}

function selectLibraryZone(zoneId) {
  if (!zoneId) return;
  if (zoneId === state.libraryZoneId) { selectLibraryNode(null); return; }
  state.libraryZoneId = zoneId;
  state.currentZoneId = zoneId;
  state.libraryNodeId = null;
  state.libraryDocumentId = null;
  state.libraryDocs = [];
  state.libraryDocsZoneId = null;
  state.libraryDocsNodeId = null;
  state.libraryGraphSelected = null;
  state.libraryGraphQuery = '';
  state.libraryGraphError = '';
  renderShell();
  renderLibrary();
}

function selectLibraryNode(nodeId) {
  var node = nodeById(nodeId);
  if (!state.libraryZoneId || (node && node.zone_id !== state.libraryZoneId)) return;
  state.libraryNodeId = node ? node.id : null;
  state.libraryDocumentId = null;
  state.libraryGraphSelected = node ? 'node:' + node.id : null;
  if (state.libraryView === 'graph' && $('#kgSvg')) {
    kgSelect(state.libraryGraphSelected, true);
  } else {
    renderZoneList();
    renderLibraryDocs();
    if (state.libraryView === 'list') loadLibraryDocs();
  }
}

async function moveDocumentNode(documentId, nodeId) {
  try {
    await apiPatch('/documents/' + encodeURIComponent(documentId) + '/node', { node_id: nodeId || null });
    if (state.libraryDocumentId === documentId) state.libraryNodeId = nodeId || null;
    await refreshNodes();
    await loadLibraryDocs(true);
    invalidateLibraryGraph();
    toast(nodeId ? '资料已移动到所选节点。' : '资料已移出节点。', 'ok');
  } catch (err) {
    toast(failMessage(err), 'error');
    await loadLibraryDocs(true);
    invalidateLibraryGraph();
  }
}

async function reindexDocument(documentId) {
  try {
    var result = await apiPost('/documents/' + encodeURIComponent(documentId) + '/reindex', {});
    await refreshZones();
    await refreshNodes();
    await loadLibraryDocs(true);
    invalidateLibraryGraph();
    var status = docStatusInfo(result.status);
    toast('重建索引完成：状态 ' + status.label + '，片段数 ' + toInt(result.chunk_count) + '。', 'ok');
  } catch (err) {
    toast(failMessage(err), 'error');
  }
}

async function deleteDocument(documentId) {
  var ok = await confirmDialog(FIXED.delConfirm);
  if (!ok) return;
  try {
    await apiDelete('/documents/' + encodeURIComponent(documentId));
    await refreshZones();
    await refreshNodes();
    await loadLibraryDocs(true);
    invalidateLibraryGraph();
    toast('资料已删除。', 'ok');
  } catch (err) {
    toast(failMessage(err), 'error');
  }
}

async function deleteZone(zoneId) {
  if (!zoneById(zoneId)) return;
  var ok = await confirmDialog(FIXED.delConfirm);
  if (!ok) return;
  try {
    await apiDelete('/zones/' + encodeURIComponent(zoneId));
    kgClearPositions(zoneId);
    if (state.libraryZoneId === zoneId) {
      state.libraryZoneId = null;
      state.libraryNodeId = null;
      state.libraryDocumentId = null;
      state.libraryGraphSelected = null;
    }
    if (state.currentZoneId === zoneId) state.currentZoneId = null;
    if (state.mapZoneId === zoneId) state.mapZoneId = null;
    if (state.quizZoneId === zoneId) state.quizZoneId = null;
    await refreshZones();
    await refreshNodes();
    if (state.zones.length && !state.libraryZoneId) state.libraryZoneId = state.zones[0].id;
    if (state.view === 'library') renderLibrary();
    toast('知识区已删除。', 'ok');
  } catch (err) {
    toast(failMessage(err), 'error');
  }
}

function openZoneModal(mode, zone) {
  var isRename = mode === 'rename';
  var mask = openMask(
    '<div class="modal modal-sm">'
    + '<div class="modal-head"><h3>' + (isRename ? '重命名知识区' : '新建知识区') + '</h3>'
    + '<button type="button" class="icon-btn" data-mask-close="1">×</button></div>'
    + '<div class="modal-body">'
    + '<div class="field"><span>知识区名称</span>'
    + '<input type="text" id="zoneNameInput" maxlength="20" placeholder="1–20 个字符" value="'
    + esc(isRename && zone ? zone.name : '') + '"></div>'
    + '<div id="zoneFormError" class="inline-error" hidden></div>'
    + '</div>'
    + '<div class="modal-foot">'
    + '<button type="button" class="btn btn-outline" data-mask-close="1">取消</button>'
    + '<button type="button" class="btn btn-primary" id="zoneFormSubmit">' + (isRename ? '保存' : '创建') + '</button>'
    + '</div></div>'
  );
  mask.addEventListener('click', function (ev) {
    if (ev.target === mask || ev.target.closest('[data-mask-close]')) closeMask(mask);
  });
  var input = $('#zoneNameInput', mask);
  var submit = $('#zoneFormSubmit', mask);
  var errBox = $('#zoneFormError', mask);
  if (input) { input.focus(); input.select(); }

  async function saveZone() {
    var name = input ? input.value.trim() : '';
    if (name.length < 1 || name.length > 20) {
      if (errBox) { errBox.textContent = '知识区名称需为 1–20 个字符。'; errBox.hidden = false; }
      return;
    }
    if (submit) submit.disabled = true;
    try {
      if (isRename && zone) {
        await apiPatch('/zones/' + encodeURIComponent(zone.id), { name: name });
      } else {
        var created = await apiPost('/zones', { name: name });
        state.libraryZoneId = created.id;
        state.currentZoneId = created.id;
        state.libraryNodeId = null;
        state.libraryDocumentId = null;
        state.libraryGraphSelected = null;
      }
      closeMask(mask);
      await refreshZones();
      await refreshNodes();
      state.libraryGraphZoneId = null;
      if (state.zones.length && !state.libraryZoneId) state.libraryZoneId = state.zones[0].id;
      if (state.view === 'library') renderLibrary();
      toast(isRename ? '知识区已重命名。' : '知识区已创建。', 'ok');
    } catch (err) {
      if (submit) submit.disabled = false;
      if (errBox) { errBox.textContent = failMessage(err); errBox.hidden = false; }
    }
  }

  if (submit) submit.addEventListener('click', saveZone);
  if (input) {
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        saveZone();
      }
    });
  }
}

    + esc(isRename && node ? node.name : '') + '"></div>'

    + '</div>'
    + '<div class="modal-foot"><button type="button" class="btn btn-outline" data-mask-close="1">取消</button>'
    + '<button type="button" class="btn btn-primary" id="nodeFormSubmit">' + (isRename ? '保存' : '创建') + '</button>'
    + '</div></div>'
  );
  mask.addEventListener('click', function (ev) {
    if (ev.target === mask || ev.target.closest('[data-mask-close]')) closeMask(mask);
  });
  var input = $('#nodeNameInput', mask);
  var submit = $('#nodeFormSubmit', mask);
  var errBox = $('#nodeFormError', mask);
  if (input) { input.focus(); input.select(); }

  async function saveNode() {
    var name = input ? input.value.trim() : '';
    if (name.length < 1 || name.length > 30) {
      if (errBox) { errBox.textContent = '节点名称需为 1–30 个字符。'; errBox.hidden = false; }
      return;
    }
    if (submit) submit.disabled = true;
    try {
      var created = null;
      if (isRename && node) {
        await apiPatch('/nodes/' + encodeURIComponent(node.id), { name: name });
      } else {
        var payload = { zone_id: zoneId, name: name };
        if (parent) payload.parent_id = parent.id;
        created = await apiPost('/nodes', payload);
        state.libraryZoneId = zoneId;
        state.libraryNodeId = created.id;
        state.libraryDocumentId = null;
        state.libraryGraphSelected = 'node:' + created.id;
        if (parent) state.libraryCollapsedNodes.delete(parent.id);
      }
      closeMask(mask);
      await refreshNodes();
      state.libraryGraphZoneId = null;
      state.libraryDocsZoneId = null;
      if (state.view === 'library') renderLibrary();
      toast(isRename ? '节点已重命名。' : '节点已创建。', 'ok');
    } catch (err) {
      if (submit) submit.disabled = false;
      if (errBox) { errBox.textContent = failMessage(err); errBox.hidden = false; }
    }
  }
  if (submit) submit.addEventListener('click', saveNode);
  if (input) {
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); saveNode(); }
    });
  }
}

async function deleteNode(nodeId) {
  var node = nodeById(nodeId);
  if (!node) return;
  var ok = await confirmDialog(FIXED.delConfirm, { title: '删除知识节点' });
  if (!ok) return;
  try {
    await apiDelete('/nodes/' + encodeURIComponent(nodeId));
    if (state.libraryNodeId === nodeId) state.libraryNodeId = null;
    await refreshNodes();
    state.libraryGraphZoneId = null;
    state.libraryDocsZoneId = null;
    if (state.view === 'library') renderLibrary();
    toast('节点已删除。', 'ok');
  } catch (err) {
    toast(failMessage(err), 'error');
  }
}

      var pad = 6;
      var scale = Math.min((168 - pad * 2) / layout.width, (118 - pad * 2) / layout.height);
      var cx = ((ev.clientX - rect.left) - pad) / scale;
      var cy = ((ev.clientY - rect.top) - pad) / scale;
      mapViewport.fit = false;
