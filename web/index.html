function bindMapViewport() {
  var viewport = $('#mapViewport');
  if (!viewport) return;
  var layout = viewport.closest('.map-layout');
  var view = { viewport: viewport, layout: layout, canvas: $('#mapCanvas'), fit: true,
    width: 0, height: 0, x: 0, y: 0, scale: 1, restore: null };
  mapViewport = view;

  var observer = new ResizeObserver(function () {
    if (view.fit) fitMapViewport();
  });
  observer.observe(viewport);
  $('#mapFitBtn').addEventListener('click', fitMapViewport);
  $('#mapZoomOutBtn').addEventListener('click', function () { zoomMapViewport(1 / 1.3); });
  $('#mapZoomInBtn').addEventListener('click', function () { zoomMapViewport(1.3); });
  $('#mapFullscreenBtn').addEventListener('click', toggleMapFullscreen);
  layout.addEventListener('click', function (event) {
    var button = event.target.closest('[data-map-panel]');
    if (button) setMapPanel(layout.dataset.panel === button.dataset.mapPanel ? '' : button.dataset.mapPanel);
  });
  viewport.addEventListener('keydown', function (event) {
    if (event.target !== viewport || !view.width) return;
    var movement = { ArrowLeft: [40, 0], ArrowRight: [-40, 0], ArrowUp: [0, 40], ArrowDown: [0, -40] };
    if (!movement[event.key]) return;
    event.preventDefault();
    moveMapViewport(view, movement[event.key][0], movement[event.key][1]);
  });

  var drag = null;
  viewport.addEventListener('pointerdown', function (event) {
    if (!view.width || !event.isPrimary || event.button !== 0 || event.target.closest('[data-node-key], [data-text-id], [data-edge-id], .mn-fold')) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
    viewport.setPointerCapture(drag.id);
    viewport.classList.add('is-panning');
    event.preventDefault();
  });
  viewport.addEventListener('pointermove', function (event) {
    if (!drag || drag.id !== event.pointerId) return;
    moveMapViewport(view, event.clientX - drag.x, event.clientY - drag.y);
    drag.x = event.clientX;
    drag.y = event.clientY;
  });
  viewport.addEventListener('lostpointercapture', function () {
    drag = null;
    viewport.classList.remove('is-panning');
  });

  function fullscreenChanged() {
    if (document.fullscreenElement === layout && view.restore) view.nativeFullscreen = true;
    else if (view.nativeFullscreen) restoreMapViewport(view);
  }
  function exitOnEscape(event) {
    if (event.key === 'Escape' && view.restore && !document.fullscreenElement) restoreMapViewport(view);
  }
  document.addEventListener('fullscreenchange', fullscreenChanged);
  document.addEventListener('keydown', exitOnEscape);
  view.dispose = function () {
    observer.disconnect();
    document.removeEventListener('fullscreenchange', fullscreenChanged);
    document.removeEventListener('keydown', exitOnEscape);
  };
}

function disposeMapViewport() {
  if (!mapViewport) return;
  mapViewport.dispose();
  mapViewport = null;
}

function setMapPanel(panel) {
  if (!mapViewport) return;
  var layout = mapViewport.layout;
  layout.dataset.panel = panel;
  layout.querySelectorAll('[data-map-panel][aria-expanded]').forEach(function (button) {
    button.setAttribute('aria-expanded', String(button.dataset.mapPanel === panel));
  });
}

function mapFitScale(view) {
  return Math.min(1, Math.max(1, view.viewport.clientWidth - 24) / view.width,
    Math.max(1, view.viewport.clientHeight - 24) / view.height);
}

function fitMapViewport() {
  var view = mapViewport;
  if (!view || !view.width || !view.viewport.clientWidth || !view.viewport.clientHeight) return;
  view.fit = true;
  view.scale = mapFitScale(view);
  view.x = (view.viewport.clientWidth - view.width * view.scale) / 2;
  view.y = (view.viewport.clientHeight - view.height * view.scale) / 2;
  paintMapViewport(view);
}

function paintMapViewport(view) {
  view.canvas.style.transform = view.width
    ? 'translate(' + view.x + 'px, ' + view.y + 'px) scale(' + view.scale + ')'
    : '';
  $('#mapZoomLevel').textContent = view.width ? Math.max(1, Math.round(view.scale * 100)) + '%' : '—';
  if (typeof updateMinimap === 'function') updateMinimap();
}

function moveMapViewport(view, x, y) {
  if (!x && !y) return;
  view.fit = false;
  view.x += x;
  view.y += y;
  paintMapViewport(view);
}

function zoomMapViewport(factor) {
  var view = mapViewport;
  if (!view || !view.width) return;
  var scale = Math.min(3, Math.max(Math.min(.1, mapFitScale(view)), view.scale * factor));
  var ratio = scale / view.scale;
  var centerX = view.viewport.clientWidth / 2;
  var centerY = view.viewport.clientHeight / 2;
  view.fit = false;
  view.x = centerX - (centerX - view.x) * ratio;
  view.y = centerY - (centerY - view.y) * ratio;
  view.scale = scale;
  paintMapViewport(view);
}

async function toggleMapFullscreen() {
  var view = mapViewport;
  if (!view || view.fullscreenPending) return;
  if (view.restore) {
    if (document.fullscreenElement === view.layout) {
      await document.exitFullscreen().catch(function () { toast('无法退出全屏，请使用 Esc。', 'error'); });
    } else {
      restoreMapViewport(view);
    }
    return;
  }
  if (!view.width) return;
  view.restore = { fit: view.fit, scale: view.scale, x: view.x, y: view.y, panel: view.layout.dataset.panel || '' };
  setMapPanel('');
  view.layout.classList.add('is-maximized');
  $('#mapFullscreenBtn').textContent = '退出全屏';
  fitMapViewport();
  if (document.fullscreenEnabled && view.layout.requestFullscreen) {
    view.fullscreenPending = true;
    try { await view.layout.requestFullscreen(); }
    catch (_error) { /* 浏览器拒绝时保留网页内最大化。 */ }
    finally { view.fullscreenPending = false; }
  }
}

function restoreMapViewport(view) {
  var previous = view.restore;
  view.restore = null;
  view.nativeFullscreen = false;
  view.layout.classList.remove('is-maximized');
  $('#mapFullscreenBtn').textContent = '全屏';
  setMapPanel(previous.panel);
  view.fit = previous.fit;
  view.scale = previous.scale;
  view.x = previous.x;
  view.y = previous.y;
  if (view.fit) fitMapViewport();
  else paintMapViewport(view);
}

/* =========================================================
 * 思维导图 v3.3：5 主题 / 5 形状 / 自由文本 / 关系线 / 节点拖动
 * （本区块替换 v3.2 的 loadMaps 至 updateMapButtons 之间的实现）
 * ========================================================= */
var MAP_THEME_ORDER = ['fresh', 'ocean', 'amber', 'graphite', 'midnight'];
var MAP_THEME_DEFS = {
  fresh: { name: '清序绿', bg: '#f7faf8', grid: '#cbdad2', line: '#c3d6ce', nodeBg: '#ffffff', nodeBorder: '#bfd2cb', text: '#172521', rootBg: '#e7f1ed', rootBorder: '#8ebbb0', rootText: '#146c60', edge: '#8aa4bd', edgeLabel: '#45675e', textBg: 'rgba(255,255,255,.92)', radius: 10, edgeStyle: 'curve' },
  ocean: { name: '澄序蓝', bg: '#f5f8fc', grid: '#d4e0ef', line: '#b8cce4', nodeBg: '#ffffff', nodeBorder: '#a9c3e2', text: '#16243a', rootBg: '#e4eefb', rootBorder: '#7fa5d6', rootText: '#20578f', edge: '#7fa5d6', edgeLabel: '#3c5f8a', textBg: 'rgba(255,255,255,.92)', radius: 10, edgeStyle: 'curve' },
  amber: { name: '暖序橙', bg: '#fdf9f3', grid: '#eeddc6', line: '#e3cdb0', nodeBg: '#ffffff', nodeBorder: '#e0c9a8', text: '#3a2a16', rootBg: '#fbefdd', rootBorder: '#d8ae74', rootText: '#8a5510', edge: '#c99a5e', edgeLabel: '#7d5a2a', textBg: 'rgba(255,255,255,.92)', radius: 10, edgeStyle: 'curve' },
  graphite: { name: '简序灰', bg: '#f7f7f8', grid: '#e2e2e6', line: '#d2d2d8', nodeBg: '#ffffff', nodeBorder: '#c9c9d1', text: '#22252c', rootBg: '#ececf1', rootBorder: '#a9a9b8', rootText: '#3a3f4b', edge: '#b3b3c0', edgeLabel: '#5b5f6b', textBg: 'rgba(255,255,255,.92)', radius: 8, edgeStyle: 'line' },
  midnight: { name: '夜序深', bg: '#1f2430', grid: '#2b3240', line: '#46506a', nodeBg: '#2a3242', nodeBorder: '#5d7398', text: '#e8edf6', rootBg: '#33415c', rootBorder: '#8fa8d6', rootText: '#eef3ff', edge: '#6a7fa8', edgeLabel: '#a9b8d6', textBg: 'rgba(42,50,66,.94)', radius: 10, edgeStyle: 'curve' }
};
var MAP_SHAPE_ORDER = ['roundrect', 'ellipse', 'circle', 'pill', 'diamond'];
var MAP_SHAPE_DEFS = {
  roundrect: { name: '圆角矩形', w: 176, h: 84 },
  ellipse: { name: '椭圆', w: 176, h: 84 },
  circle: { name: '圆形', w: 104, h: 104 },
  pill: { name: '胶囊', w: 176, h: 60 },
  diamond: { name: '菱形', w: 140, h: 100 }
};
var MAP_POS_LIMIT = 5000;
var MAP_MAX_TEXTS = 30;
var MAP_MAX_EDGES = 100;

function mapThemeDef() {
  return MAP_THEME_DEFS[state.mapTheme] || MAP_THEME_DEFS.fresh;
}

function mapShapeDef(node) {
  var shape = node && node.shape ? node.shape : 'roundrect';
  return MAP_SHAPE_DEFS[shape] || MAP_SHAPE_DEFS.roundrect;
}

function mapPosition(node, value) {
  return (typeof value === 'number' && isFinite(value)) ? value : null;
}

function mapMarkDirty() {
  state.mapDirty = true;
  setMapStatus(FIXED.unsaved);
}

function mapClearSelection() {
  state.mapSelectedKey = null;
  state.mapSelectedTextId = null;
  state.mapSelectedEdgeId = null;
}

function mapNodeKeys() {
  var set = {};
  var nodes = state.mapData && Array.isArray(state.mapData.nodes) ? state.mapData.nodes : [];
  nodes.forEach(function (node) { set[node.node_key] = true; });
  return set;
}

async function loadMaps() {
  var zoneId = state.mapZoneId;
  if (!zoneId) { state.maps = []; renderMapList(); return; }
  try {
    var rows = await apiGet('/mindmaps?zone_id=' + encodeURIComponent(zoneId));
    if (state.mapZoneId !== zoneId) return;
    state.maps = Array.isArray(rows) ? rows : [];
  } catch (err) {
    if (state.mapZoneId === zoneId) {
      state.maps = [];
      toast(failMessage(err), 'error');
    }
  }
  renderMapList();
}

async function loadMapDocs() {
  var zoneId = state.mapZoneId;
  if (!zoneId) {
    state.mapDocs = [];
    state.mapDocsZoneId = null;
    renderMapDocPicker();
    return;
  }
  if (state.mapDocsZoneId === zoneId) {
    renderMapDocPicker();
    return;
  }
  try {
    var rows = await apiGet('/documents?zone_id=' + encodeURIComponent(zoneId));
    if (state.mapZoneId !== zoneId) return;
    state.mapDocs = Array.isArray(rows) ? rows : [];
    state.mapDocsZoneId = zoneId;
    state.mapSelectedDocs = {};
    state.mapDocs.forEach(function (doc) {
      if (doc.status !== 'failed') state.mapSelectedDocs[doc.id] = true;
    });
  } catch (err) {
    if (state.mapZoneId === zoneId) {
      state.mapDocs = [];
      state.mapDocsZoneId = zoneId;
      toast(failMessage(err), 'error');
    }
  }
  renderMapDocPicker();
}

function renderMapDocPicker() {
  var box = $('#mapDocPicker');
  if (!box) return;
  if (state.mapDocsZoneId !== state.mapZoneId) {
    box.innerHTML = '<span class="muted">正在加载资料选择…</span>';
    return;
  }
  if (!state.mapDocs.length) {
    box.innerHTML = '<span class="muted">' + esc(FIXED.noDoc) + '</span>';
    return;
  }
  box.innerHTML = state.mapDocs.map(function (doc) {
    var isOutline = hasOutline(doc);
    var status = docStatusInfo(doc.status);
    var checked = state.mapSelectedDocs[doc.id] ? ' checked' : '';
    var disabled = doc.status === 'failed' ? ' disabled' : '';
    var hint = isOutline ? '' : '<span class="doc-warn" title="' + esc(FIXED.outlineOnly) + '">无标题层级</span>';
    return '<label class="doc-check" title="' + esc(doc.filename || '') + '">'
      + '<input type="checkbox" data-doc-id="' + esc(doc.id) + '"' + checked + disabled + '>'
      + esc(doc.filename || '') + ' <span class="doc-ext">' + esc(extLabel(doc.ext)) + '</span>'
      + ' <span class="badge ' + status.cls + ' badge-xs">' + esc(status.label) + '</span>' + hint
      + '</label>';
  }).join('');
}

function hasOutline(doc) {
  var ext = String((doc && doc.ext) || '').replace(/^\./, '').toLowerCase();
  return OUTLINE_EXTS.indexOf(ext) >= 0;
}

function selectedDocumentIds() {
  return Object.keys(state.mapSelectedDocs).filter(function (docId) {
    return !!state.mapSelectedDocs[docId];
  });
}

function renderMapList() {
  var box = $('#mapList');
  if (!box) return;
  var count = $('#mapCount');
  if (count) count.textContent = String(state.maps.length);
  if (!state.maps.length) {
    box.innerHTML = '<div class="empty-inline">当前知识区还没有导图。</div>';
    return;
  }
  box.innerHTML = state.maps.map(function (map) {
    var theme = MAP_THEME_DEFS[map.theme] || MAP_THEME_DEFS.fresh;
    return '<div class="map-item' + (map.id === state.mapId ? ' active' : '') + '" data-map-id="' + esc(map.id) + '">'
      + '<div class="mi-title">' + esc(map.title || '未命名导图') + '</div>'
      + '<div class="mi-meta"><span class="badge badge-xs">' + esc(MAP_MODE[map.mode] || map.mode || '') + '</span>'
      + (map.generated_by === 'rule' ? '<span class="badge badge-warn badge-xs">' + esc(FIXED.ruleBadge) + '</span>' : '')
      + '<span class="badge badge-xs">' + esc(theme.name) + '</span>'
      + '<span>' + toInt(map.node_count) + ' 节点</span>'
      + '<span>' + esc(fmtTime(map.updated_at)) + '</span></div>'
      + '</div>';
  }).join('');
}

async function generateMap(mode) {
  if (state.mapBusy) return;
  if (!state.mapZoneId) { showMapError(FIXED.noZone); return; }
  var documentIds = selectedDocumentIds();
  if (!documentIds.length) { showMapError('请选择至少一份资料。'); return; }
  if (mode === 'structure') {
    var invalid = state.mapDocs.filter(function (doc) {
      return documentIds.indexOf(doc.id) >= 0 && !hasOutline(doc);
    });
    if (invalid.length) { showMapError(FIXED.outlineOnly); return; }
  }
  var titleInput = $('#mapTitleInput');
  var fallbackTitle = mode === 'structure' ? '资料结构导图' : '概念导图';
  var title = (titleInput && titleInput.value.trim()) ? titleInput.value.trim() : fallbackTitle;
  clearMapError();
  state.mapBusy = true;
  updateMapButtons();
  setMapStatus('正在生成导图…');
  try {
    var result = await apiPost('/mindmaps', {
      zone_id: state.mapZoneId,
      document_ids: documentIds,
      title: title,
      mode: mode
    });
    invalidateLibraryGraph();
    await loadMaps();
    state.mapId = result.mindmap_id;
    await openMap(result.mindmap_id);
    var statusText = '已生成' + (MAP_MODE[mode] || mode) + '导图：节点 ' + toInt(result.nodes ? result.nodes.length : 0) + ' 个。';
    if (result.truncated) statusText += '节点数或层级超出上限，已自动截断。';
    setMapStatus(result.warning ? '⚠ ' + result.warning + ' ' + statusText : statusText);
  } catch (err) {
    if (mode === 'concept') {
      showMapError(fillFixed(FIXED.aiMapFail, err && err.message ? err.message : '未知错误'));
    } else {
      showMapError(failMessage(err));
    }
    setMapStatus('');
  } finally {
    state.mapBusy = false;
    updateMapButtons();
  }
}

async function openMap(mindmapId) {
  if (!mindmapId) return;
  state.mapId = mindmapId;
  mapClearSelection();
  state.mapCollapsed = {};
  state.mapExportBusy = false;
  state.mapConnectMode = false;
  state.mapConnectSource = null;
  state.mapDirty = false;
  state.mapUndo = [];
  state.mapRedo = [];
  state.mapPenMode = false;
  state.mapEraserMode = false;
  state.mapWordCloud = false;
  state.mapDropTargetKey = null;
  state.mapStrokeDraft = null;
  try {
    var data = await apiGet('/mindmaps/' + encodeURIComponent(mindmapId));
    if (state.mapId !== mindmapId) return;
    state.mapData = data;
    state.mapTheme = data && MAP_THEME_DEFS[data.theme] ? data.theme : 'fresh';
    var layout = data && data.layout && typeof data.layout === 'object' ? data.layout : {};
    state.mapLayout = {
      texts: Array.isArray(layout.texts) ? layout.texts : [],
      edges: Array.isArray(layout.edges) ? layout.edges : [],
      strokes: Array.isArray(layout.strokes) ? layout.strokes : []
    };
    var nodes = data && Array.isArray(data.nodes) ? data.nodes : [];
    state.mapSelectedKey = nodes.length ? nodes[0].node_key : null;
    if (mapViewport) {
      mapViewport.fit = true;
      if (mapViewport.restore) mapViewport.restore.fit = true;
    }
    clearMapError();
  } catch (err) {
    state.mapData = null;
    showMapError(failMessage(err));
    toast(failMessage(err), 'error');
  }
  renderMapList();
  renderCanvas();
  renderMapEditPanel();
  updateMapButtons();
}

function selectNode(nodeKey) {
  if (!nodeKey || !state.mapData) return;
  var nodes = Array.isArray(state.mapData.nodes) ? state.mapData.nodes : [];
  var exists = false;
  nodes.forEach(function (node) { if (node.node_key === nodeKey) exists = true; });
  if (!exists) return;
  state.mapSelectedKey = nodeKey;
  state.mapSelectedTextId = null;
  state.mapSelectedEdgeId = null;
  renderCanvas();
  renderMapEditPanel();
}

function selectedMapNode() {
  if (!state.mapData) return null;
  var nodes = Array.isArray(state.mapData.nodes) ? state.mapData.nodes : [];
  for (var i = 0; i < nodes.length; i += 1) {
    if (nodes[i].node_key === state.mapSelectedKey) return nodes[i];
  }
  return null;
}

function mapNodeByKey(key) {
  var nodes = state.mapData && Array.isArray(state.mapData.nodes) ? state.mapData.nodes : [];
  for (var i = 0; i < nodes.length; i += 1) {
    if (nodes[i].node_key === key) return nodes[i];
  }
  return null;
}

function computeMapLayout(nodes) {
  var byKey = {};
  var order = {};
  nodes.forEach(function (node, index) {
    byKey[node.node_key] = node;
    order[node.node_key] = index;
  });
  var children = {};
  var roots = [];
  nodes.forEach(function (node) {
    var parentKey = node.parent_key || null;
    if (parentKey && byKey[parentKey]) {
      if (!children[parentKey]) children[parentKey] = [];
      children[parentKey].push(node.node_key);
    } else {
      roots.push(node.node_key);
    }
  });
  Object.keys(children).forEach(function (key) {
    children[key].sort(function (a, b) { return order[a] - order[b]; });
  });
  roots.sort(function (a, b) { return order[a] - order[b]; });

  var GAP_X = 66;
  var GAP_Y = 16;
  var PAD = 26;
  var positions = {};
  var cursor = PAD;
  var visited = {};
  var depthStep = 200;

  function sizeOf(key) {
    var def = mapShapeDef(byKey[key]);
    return { w: def.w, h: def.h };
  }

  function place(key, depth) {
    if (visited[key]) return positions[key] || { x: PAD, y: cursor, w: 176, h: 84 };
    visited[key] = true;
    var node = byKey[key];
    var size = sizeOf(key);
    var manualX = mapPosition(node, node.pos_x);
    var manualY = mapPosition(node, node.pos_y);
    var point;
    if (manualX !== null && manualY !== null) {
      point = { x: manualX, y: manualY, w: size.w, h: size.h, manual: true };
    } else {
      var kids = children[key] || [];
      var y;
      if (!kids.length) {
        y = cursor;
        cursor += size.h + GAP_Y;
      } else {
        var firstY = null;
        var lastY = null;
        kids.forEach(function (childKey) {
          var childPoint = place(childKey, depth + 1);
          if (firstY === null) firstY = childPoint.y;
          lastY = childPoint.y;
        });
        y = ((firstY + lastY) / 2);
      }
      point = { x: PAD + depth * depthStep, y: y, w: size.w, h: size.h, manual: false };
    }
    positions[key] = point;
    (children[key] || []).forEach(function (childKey) {
      if (!positions[childKey]) place(childKey, depth + 1);
    });
    return point;
  }

  roots.forEach(function (rootKey) { place(rootKey, 0); });
  nodes.forEach(function (node) {
    if (!positions[node.node_key]) place(node.node_key, 0);
  });

  var width = 640;
  var height = 320;
  Object.keys(positions).forEach(function (key) {
    var point = positions[key];
    width = Math.max(width, point.x + point.w + PAD);
    height = Math.max(height, point.y + point.h + PAD);
  });
  var texts = state.mapLayout && Array.isArray(state.mapLayout.texts) ? state.mapLayout.texts : [];
  texts.forEach(function (item) {
    var x = Number(item.x);
    var y = Number(item.y);
    if (isFinite(x) && isFinite(y)) {
      width = Math.max(width, x + 280);
      height = Math.max(height, y + 60);
    }
  });
  return { positions: positions, width: width, height: height };
}

function mapChildrenMap(nodes) {
  var children = {};
  (nodes || []).forEach(function (node) {
    var parentKey = node.parent_key || null;
    if (!parentKey) return;
    if (!children[parentKey]) children[parentKey] = [];
    children[parentKey].push(node.node_key);
  });
  return children;
}

function mapDescendantCount(nodes, key, seen) {
  var children = mapChildrenMap(nodes);
  seen = seen || {};
  if (seen[key]) return 0;
  seen[key] = true;
  var direct = children[key] || [];
  var count = direct.length;
  direct.forEach(function (childKey) { count += mapDescendantCount(nodes, childKey, seen); });
  return count;
}

function visibleMapNodes(nodes) {
  var list = nodes || [];
  var byKey = {};
  list.forEach(function (node) { byKey[node.node_key] = node; });
  var children = mapChildrenMap(list);
  var roots = list.filter(function (node) {
    return !node.parent_key || !byKey[node.parent_key];
  }).map(function (node) { return node.node_key; });
  if (!roots.length && list.length) roots = [list[0].node_key];
  var visible = [];
  var visited = {};
  function walk(key) {
    if (visited[key] || !byKey[key]) return;
    visited[key] = true;
    visible.push(byKey[key]);
    if (state.mapCollapsed[key]) return;
    (children[key] || []).forEach(walk);
  }
  roots.forEach(walk);
  return visible;
}

function toggleMapCollapse(key) {
  if (!key) return;
  if (state.mapCollapsed[key]) delete state.mapCollapsed[key];
  else state.mapCollapsed[key] = true;
  renderCanvas();
  renderMapEditPanel();
}

function collapseAllMapNodes() {
  if (!state.mapData) return;
  var children = mapChildrenMap(state.mapData.nodes || []);
  Object.keys(children).forEach(function (key) {
    if ((children[key] || []).length) state.mapCollapsed[key] = true;
  });
  renderCanvas();
  renderMapEditPanel();
}

function expandAllMapNodes() {
  state.mapCollapsed = {};
  renderCanvas();
  renderMapEditPanel();
}

function mapEdgeStyle(theme) {
  return theme.edgeStyle === 'line' ? 'line' : 'curve';
}

function mapEdgePath(x1, y1, x2, y2, style) {
  if (style === 'line') return 'M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2;
  var midX = (x1 + x2) / 2;
  return 'M' + x1 + ' ' + y1 + ' C' + midX + ' ' + y1 + ', ' + midX + ' ' + y2 + ', ' + x2 + ' ' + y2;
}

function mapEdgePoints(fromPoint, toPoint) {
  return {
    x1: fromPoint.x + fromPoint.w,
    y1: fromPoint.y + fromPoint.h / 2,
    x2: toPoint.x,
    y2: toPoint.y + toPoint.h / 2
  };
}

function renderCanvas() {
  var canvas = $('#mapCanvas');
  if (!canvas) return;
  var viewport = $('#mapViewport');
  if (viewport) {
    viewport.dataset.theme = state.mapTheme || 'fresh';
    viewport.classList.toggle('map-connect-mode', !!state.mapConnectMode);
    viewport.classList.toggle('map-pen-mode', !!state.mapPenMode);
  }
  if (!state.mapData) {
    canvas.innerHTML = '<div class="canvas-empty">'
      + esc(state.maps.length ? '在左侧选择一个导图。' : '当前知识区还没有导图。选择上方资料后生成。')
      + '</div>';
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    if (mapViewport) { mapViewport.width = 0; mapViewport.height = 0; paintMapViewport(mapViewport); }
    return;
  }
  var allNodes = Array.isArray(state.mapData.nodes) ? state.mapData.nodes : [];
  if (!allNodes.length) {
    canvas.innerHTML = '<div class="canvas-empty">该导图没有节点。</div>';
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    if (mapViewport) { mapViewport.width = 0; mapViewport.height = 0; paintMapViewport(mapViewport); }
    return;
  }
  var nodes = visibleMapNodes(allNodes);
  var layout = computeMapLayout(nodes);
  var positions = layout.positions;
  var theme = mapThemeDef();
  var style = mapEdgeStyle(theme);
  canvas.dataset.theme = state.mapTheme || 'fresh';

  var edgeParts = [];
  nodes.forEach(function (node) {
    var point = positions[node.node_key];
    var parentPoint = node.parent_key ? positions[node.parent_key] : null;
    if (!point || !parentPoint) return;
    var edge = mapEdgePoints(parentPoint, point);
    edgeParts.push('<path d="' + mapEdgePath(edge.x1, edge.y1, edge.x2, edge.y2, style)
      + '" fill="none" stroke="' + theme.line + '" stroke-width="1.5"/>');
  });

  var edgeById = {};
  (state.mapLayout.edges || []).forEach(function (edge) { edgeById[edge.id] = edge; });
  var relationParts = ['<defs><marker id="mapEdgeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="' + theme.edge + '"/></marker></defs>'];
  (state.mapLayout.edges || []).forEach(function (edge) {
    var fromPoint = positions[edge.from_key];
    var toPoint = positions[edge.to_key];
    if (!fromPoint || !toPoint) return;
    var points = mapEdgePoints(fromPoint, toPoint);
    var selected = state.mapSelectedEdgeId === edge.id;
    relationParts.push('<path class="map-edge' + (selected ? ' selected' : '') + '" data-edge-id="' + esc(edge.id)
      + '" d="' + mapEdgePath(points.x1, points.y1, points.x2, points.y2, 'curve')
      + '" fill="none" stroke="' + theme.edge + '" stroke-width="' + (selected ? 2.6 : 1.6)
      + '" stroke-dasharray="6 5" marker-end="url(#mapEdgeArrow)"/>');
    if (edge.label) {
      relationParts.push('<text class="map-edge-label" x="' + ((points.x1 + points.x2) / 2)
        + '" y="' + ((points.y1 + points.y2) / 2 - 6) + '" text-anchor="middle" font-size="11" fill="'
        + theme.edgeLabel + '">' + esc(edge.label) + '</text>');
    }
  });

  var children = mapChildrenMap(allNodes);
  var nodeHtml = nodes.map(function (node) {
    var point = positions[node.node_key];
    if (!point) return '';
    var def = mapShapeDef(node);
    var shape = MAP_SHAPE_DEFS[node.shape] ? node.shape : 'roundrect';
    var classes = 'map-node';
    var isRoot = node.node_key === 'root' || !node.parent_key;
    if (isRoot) classes += ' map-root';
    if (node.node_key === state.mapSelectedKey) classes += ' selected';
    if (node.origin === 'user') classes += ' origin-user';
    if (state.mapDropTargetKey === node.node_key) classes += ' map-drop-target';
    var badges = '';
    if (node.unverified) badges += '<span class="mn-badge">未验证来源</span>';
    var hasKids = (children[node.node_key] || []).length > 0;
    var foldHtml = '';
    if (hasKids) {
      var folded = !!state.mapCollapsed[node.node_key];
      foldHtml = '<span class="mn-fold" data-fold-key="' + esc(node.node_key) + '" title="折叠/展开">'
        + (folded ? '▸ +' + mapDescendantCount(allNodes, node.node_key) : '▾') + '</span>';
    }
    var noteHtml = node.note ? '<span class="mn-note">' + esc(String(node.note).slice(0, 30)) + '</span>' : '';
    return '<button type="button" class="' + classes + '" data-node-key="' + esc(node.node_key)
      + '" data-shape="' + shape + '" style="left:' + point.x + 'px;top:' + point.y + 'px;width:'
      + def.w + 'px;height:' + def.h + 'px">'
      + '<span class="mn-title">' + esc(node.title || '未命名节点') + '</span>'
      + noteHtml + badges + foldHtml + '</button>';
  }).join('');

  var textHtml = (state.mapLayout.texts || []).map(function (item) {
    var selected = state.mapSelectedTextId === item.id;
    return '<div class="map-text' + (selected ? ' selected' : '') + '" data-text-id="' + esc(item.id)
      + '" style="left:' + Number(item.x) + 'px;top:' + Number(item.y) + 'px">'
      + '<span class="mt-handle" data-text-handle="' + esc(item.id) + '" title="拖动文本">⠿</span>'
      + '<span class="mt-body" contenteditable="true" spellcheck="false">' + esc(item.text || '') + '</span>'
      + '<span class="mt-del" data-text-del="' + esc(item.id) + '" title="删除文本">×</span></div>';
  }).join('');

  var strokeParts = [];
  (state.mapLayout.strokes || []).forEach(function (stroke) {
    var path = '';
    (stroke.points || []).forEach(function (point, index) {
      path += (index ? ' L' : 'M') + point.x + ' ' + point.y;
    });
    if (!path) return;
    strokeParts.push('<path class="map-stroke" data-stroke-id="' + esc(stroke.id)
      + '" d="' + path + '" fill="none" stroke="' + esc(stroke.color || '#b06a12')
      + '" stroke-width="' + Number(stroke.width || 2)
      + '" stroke-linecap="round" stroke-linejoin="round"/>');
  });
  var draftPart = '';
  if (state.mapStrokeDraft && state.mapStrokeDraft.points.length > 1) {
    var draftPath = '';
    state.mapStrokeDraft.points.forEach(function (point, index) {
      draftPath += (index ? ' L' : 'M') + point.x + ' ' + point.y;
    });
    draftPart = '<path d="' + draftPath + '" fill="none" stroke="' + esc(state.mapStrokeDraft.color)
      + '" stroke-width="' + Number(state.mapStrokeDraft.width)
      + '" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>';
  }
  canvas.innerHTML = '<svg width="' + layout.width + '" height="' + layout.height + '">'
    + edgeParts.join('') + relationParts.join('') + strokeParts.join('') + draftPart + '</svg>'
    + nodeHtml + textHtml;
  var wordCloudHost = $('#mapWordCloud');
  if (wordCloudHost) {
    wordCloudHost.hidden = !state.mapWordCloud;
    wordCloudHost.innerHTML = state.mapWordCloud ? renderMapWordCloudHtml(nodes) : '';
  }
  sizeMapViewport(layout);
  bindCanvasInteractions();
  updateMinimap();
}

function sizeMapViewport(layout) {
  var canvas = $('#mapCanvas');
  if (!canvas) return;
  canvas.style.width = layout.width + 'px';
  canvas.style.height = layout.height + 'px';
  if (!mapViewport) return;
  mapViewport.width = layout.width;
  mapViewport.height = layout.height;
  if (mapViewport.fit) fitMapViewport();
  else paintMapViewport(mapViewport);
}

function wrapMapTitle(measureFn, text, maxWidth, maxLines) {
  maxLines = maxLines || 3;
  var source = String(text || '').replace(/\s+/g, ' ').trim();
  if (!source) return [''];
  var tokens = source.match(/[\u3400-\u9fff]|[A-Za-z0-9_]+|\s+|./g) || [source];
  var units = [];
  tokens.forEach(function (token) {
    if (!token) return;
    if (/^\s+$/.test(token) || measureFn(token) <= maxWidth) {
      units.push(token);
    } else {
      Array.from(token).forEach(function (ch) { units.push(ch); });
    }
  });
  var lines = [''];
  var overflow = false;
  for (var i = 0; i < units.length; i += 1) {
    var unit = units[i];
    if (/^\s+$/.test(unit) && lines[lines.length - 1] === '') continue;
    var last = lines.length - 1;
    var candidate = lines[last] + unit;
    if (measureFn(candidate) <= maxWidth) {
      lines[last] = candidate;
    } else if (lines.length < maxLines) {
      lines.push(unit.replace(/^\s+/, ''));
    } else {
      overflow = true;
      break;
    }
  }
  if (overflow && lines.length) {
    var lastLine = lines[lines.length - 1];
    while (lastLine.length && measureFn(lastLine + '…') > maxWidth) lastLine = lastLine.slice(0, -1);
    lines[lines.length - 1] = lastLine + '…';
  }
  return lines;
}

function svgMapTextWidth(text) {
  var width = 0;
  Array.from(String(text || '')).forEach(function (ch) {
    width += /[\u3400-\u9fff]/.test(ch) ? 13 : 7;
  });
  return width;
}

function mapExportFileName(ext) {
  var raw = state.mapData && state.mapData.title ? state.mapData.title : '导图';
  var safe = String(raw).replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim().slice(0, 80) || '导图';
  var now = new Date();
  var date = now.getFullYear().toString()
    + String(now.getMonth() + 1).padStart(2, '0')
    + String(now.getDate()).padStart(2, '0');
  return '导图-' + safe + '-' + date + '.' + ext;
}

function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
}

function svgNodeMarkup(node, point, theme, allNodes) {
  var shape = MAP_SHAPE_DEFS[node.shape] ? node.shape : 'roundrect';
  var isRoot = node.node_key === 'root' || !node.parent_key;
  var fill = isRoot ? theme.rootBg : theme.nodeBg;
  var stroke = isRoot ? theme.rootBorder : (node.origin === 'user' ? '#b06a12' : theme.nodeBorder);
  var dash = node.origin === 'user' && !isRoot ? ' stroke-dasharray="5 3"' : '';
  var parts = [];
  if (shape === 'ellipse' || shape === 'circle') {
    parts.push('<ellipse cx="' + (point.x + point.w / 2) + '" cy="' + (point.y + point.h / 2)
      + '" rx="' + (point.w / 2) + '" ry="' + (point.h / 2) + '" fill="' + fill + '" stroke="' + stroke
      + '" stroke-width="1.2"' + dash + '/>');
  } else if (shape === 'diamond') {
    var cx = point.x + point.w / 2;
    var cy = point.y + point.h / 2;
    parts.push('<polygon points="' + cx + ',' + point.y + ' ' + (point.x + point.w) + ',' + cy + ' '
      + cx + ',' + (point.y + point.h) + ' ' + point.x + ',' + cy + '" fill="' + fill + '" stroke="' + stroke
      + '" stroke-width="1.2"' + dash + '/>');
  } else {
    var radius = shape === 'pill' ? point.h / 2 : theme.radius;
    parts.push('<rect x="' + point.x + '" y="' + point.y + '" width="' + point.w + '" height="' + point.h
      + '" rx="' + radius + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.2"' + dash + '/>');
  }
  var maxWidth = shape === 'circle' ? point.w - 26 : shape === 'diamond' ? point.w * 0.6 : point.w - 28;
  var lines = wrapMapTitle(svgMapTextWidth, node.title || '未命名节点', maxWidth, 3);
  var lineHeight = 17;
  var firstY = point.y + (point.h - lines.length * lineHeight) / 2 + 13;
  var textColor = isRoot ? theme.rootText : theme.text;
  var align = shape === 'circle' || shape === 'diamond' ? 'middle' : 'start';
  var textX = align === 'middle' ? point.x + point.w / 2 : point.x + 14;
  lines.forEach(function (line, index) {
    parts.push('<text x="' + textX + '" y="' + (firstY + index * lineHeight) + '" text-anchor="' + align
      + '" font-size="13" fill="' + textColor + '">' + esc(line) + '</text>');
  });
  if (node.unverified) {
    parts.push('<text x="' + (point.x + point.w - 8) + '" y="' + (point.y + 14)
      + '" text-anchor="end" font-size="10" fill="#b4433c">未验证</text>');
  }
  if (state.mapCollapsed[node.node_key] && mapDescendantCount(allNodes, node.node_key)) {
    parts.push('<text x="' + (point.x + point.w - 9) + '" y="' + (point.y + point.h - 7)
      + '" text-anchor="end" font-size="10.5" fill="' + theme.text + '">+'
      + mapDescendantCount(allNodes, node.node_key) + '</text>');
  }
  return parts.join('');
}

function exportMapSvg() {
  if (!state.mapData) {
    toast('导图没有节点，无法导出。', 'error');
    return;
  }
  var allNodes = state.mapData.nodes || [];
  var nodes = visibleMapNodes(allNodes);
  if (!nodes.length) {
    toast('导图没有节点，无法导出。', 'error');
    return;
  }
  var theme = mapThemeDef();
  var layout = computeMapLayout(nodes);
  var positions = layout.positions;
  var style = mapEdgeStyle(theme);
  var content = [];
  content.push('<rect x="0" y="0" width="' + layout.width + '" height="' + layout.height
    + '" fill="' + theme.bg + '"/>');
  nodes.forEach(function (node) {
    var point = positions[node.node_key];
    var parentPoint = node.parent_key ? positions[node.parent_key] : null;
    if (!point || !parentPoint) return;
    var edge = mapEdgePoints(parentPoint, point);
    content.push('<path d="' + mapEdgePath(edge.x1, edge.y1, edge.x2, edge.y2, style)
      + '" fill="none" stroke="' + theme.line + '" stroke-width="1.5"/>');
  });
  content.push('<defs><marker id="mapEdgeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="' + theme.edge + '"/></marker></defs>');
  (state.mapLayout.edges || []).forEach(function (edge) {
    var fromPoint = positions[edge.from_key];
    var toPoint = positions[edge.to_key];
    if (!fromPoint || !toPoint) return;
    var points = mapEdgePoints(fromPoint, toPoint);
    content.push('<path d="' + mapEdgePath(points.x1, points.y1, points.x2, points.y2, 'curve')
      + '" fill="none" stroke="' + theme.edge + '" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#mapEdgeArrow)"/>');
    if (edge.label) {
      content.push('<text x="' + ((points.x1 + points.x2) / 2) + '" y="' + ((points.y1 + points.y2) / 2 - 6)
        + '" text-anchor="middle" font-size="11" fill="' + theme.edgeLabel + '">' + esc(edge.label) + '</text>');
    }
  });
  nodes.forEach(function (node) {
    var point = positions[node.node_key];
    if (!point) return;
    content.push(svgNodeMarkup(node, point, theme, allNodes));
  });
  (state.mapLayout.texts || []).forEach(function (item) {
    var lines = wrapMapTitle(svgMapTextWidth, item.text || '', 240, 3);
    content.push('<rect x="' + (Number(item.x) - 10) + '" y="' + (Number(item.y) - 8) + '" width="260" height="'
      + (18 + lines.length * 17) + '" rx="6" fill="' + theme.textBg + '" stroke="' + theme.edge
      + '" stroke-dasharray="4 3"/>');
    lines.forEach(function (line, index) {
      content.push('<text x="' + Number(item.x) + '" y="' + (Number(item.y) + 6 + index * 17)
        + '" font-size="12.5" fill="' + theme.text + '">' + esc(line) + '</text>');
    });
  });
  (state.mapLayout.strokes || []).forEach(function (stroke) {
    var path = '';
    (stroke.points || []).forEach(function (point, index) {
      path += (index ? ' L' : 'M') + point.x + ' ' + point.y;
    });
    if (!path) return;
    content.push('<path d="' + path + '" fill="none" stroke="' + esc(stroke.color || '#b06a12')
      + '" stroke-width="' + Number(stroke.width || 2)
      + '" stroke-linecap="round" stroke-linejoin="round"/>');
  });
  var svg = '<?xml version="1.0" encoding="UTF-8"?>'
    + '<svg xmlns="http://www.w3.org/2000/svg" width="' + layout.width + '" height="' + layout.height
    + '" viewBox="0 0 ' + layout.width + ' ' + layout.height + '">' + content.join('') + '</svg>';
  downloadBlob(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }), mapExportFileName('svg'));
  toast('已导出 SVG。', 'ok');
}

function mapRoundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function buildMapExportCanvas(scale) {
  var allNodes = state.mapData.nodes || [];
  var nodes = visibleMapNodes(allNodes);
  var theme = mapThemeDef();
  var layout = computeMapLayout(nodes);
  var canvas = document.createElement('canvas');
  canvas.width = Math.round(layout.width * scale);
  canvas.height = Math.round(layout.height * scale);
  var ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, layout.width, layout.height);
  var style = mapEdgeStyle(theme);
  nodes.forEach(function (node) {
    var point = layout.positions[node.node_key];
    var parentPoint = node.parent_key ? layout.positions[node.parent_key] : null;
    if (!point || !parentPoint) return;
    var edge = mapEdgePoints(parentPoint, point);
    ctx.beginPath();
    ctx.strokeStyle = theme.line;
    ctx.lineWidth = 1.5;
    if (style === 'line') {
      ctx.moveTo(edge.x1, edge.y1);
      ctx.lineTo(edge.x2, edge.y2);
    } else {
      var midX = (edge.x1 + edge.x2) / 2;
      ctx.moveTo(edge.x1, edge.y1);
      ctx.bezierCurveTo(midX, edge.y1, midX, edge.y2, edge.x2, edge.y2);
    }
    ctx.stroke();
  });
  (state.mapLayout.edges || []).forEach(function (edge) {
    var fromPoint = layout.positions[edge.from_key];
    var toPoint = layout.positions[edge.to_key];
    if (!fromPoint || !toPoint) return;
    var points = mapEdgePoints(fromPoint, toPoint);
    ctx.save();
    ctx.strokeStyle = theme.edge;
    ctx.lineWidth = 1.6;
    ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(points.x1, points.y1);
    var midX = (points.x1 + points.x2) / 2;
    ctx.bezierCurveTo(midX, points.y1, midX, points.y2, points.x2, points.y2);
    ctx.stroke();
    ctx.restore();
    if (edge.label) {
      ctx.fillStyle = theme.edgeLabel;
      ctx.font = '11px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(edge.label, (points.x1 + points.x2) / 2, (points.y1 + points.y2) / 2 - 6);
    }
  });
  (state.mapLayout.strokes || []).forEach(function (stroke) {
    var points = stroke.points || [];
    if (points.length < 2) return;
    ctx.save();
    ctx.strokeStyle = stroke.color || '#b06a12';
    ctx.lineWidth = Number(stroke.width || 2);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    points.forEach(function (point, index) {
      if (index === 0) ctx.moveTo(point.x, point.y);
      else ctx.lineTo(point.x, point.y);
    });
    ctx.stroke();
    ctx.restore();
  });
  nodes.forEach(function (node) {
    var point = layout.positions[node.node_key];
    if (!point) return;
    var shape = MAP_SHAPE_DEFS[node.shape] ? node.shape : 'roundrect';
    var isRoot = node.node_key === 'root' || !node.parent_key;
    var fill = isRoot ? theme.rootBg : theme.nodeBg;
    var stroke = isRoot ? theme.rootBorder : (node.origin === 'user' ? '#b06a12' : theme.nodeBorder);
    ctx.save();
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.2;
    if (node.origin === 'user' && !isRoot) ctx.setLineDash([5, 3]);
    ctx.beginPath();
    if (shape === 'ellipse' || shape === 'circle') {
      ctx.ellipse(point.x + point.w / 2, point.y + point.h / 2, point.w / 2, point.h / 2, 0, 0, Math.PI * 2);
    } else if (shape === 'diamond') {
      var cx = point.x + point.w / 2;
      var cy = point.y + point.h / 2;
      ctx.moveTo(cx, point.y);
      ctx.lineTo(point.x + point.w, cy);
      ctx.lineTo(cx, point.y + point.h);
      ctx.lineTo(point.x, cy);
      ctx.closePath();
    } else {
      mapRoundRect(ctx, point.x, point.y, point.w, point.h, shape === 'pill' ? point.h / 2 : theme.radius);
    }
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    var maxWidth = shape === 'circle' ? point.w - 26 : shape === 'diamond' ? point.w * 0.6 : point.w - 28;
    ctx.fillStyle = isRoot ? theme.rootText : theme.text;
    ctx.font = '13px "Microsoft YaHei", "PingFang SC", sans-serif';
    var measure = function (text) { return ctx.measureText(text).width; };
    var lines = wrapMapTitle(measure, node.title || '未命名节点', maxWidth, 3);
    var lineHeight = 17;
    var firstY = point.y + (point.h - lines.length * lineHeight) / 2 + 13;
    var centered = shape === 'circle' || shape === 'diamond';
    ctx.textAlign = centered ? 'center' : 'left';
    var textX = centered ? point.x + point.w / 2 : point.x + 14;
    lines.forEach(function (line, index) {
      ctx.fillText(line, textX, firstY + index * lineHeight);
    });
    if (node.unverified) {
      ctx.fillStyle = '#b4433c';
      ctx.font = '10px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('未验证', point.x + point.w - 8, point.y + 14);
    }
  });
  (state.mapLayout.texts || []).forEach(function (item) {
    ctx.save();
    ctx.fillStyle = theme.textBg;
    ctx.strokeStyle = theme.edge;
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]);
    mapRoundRect(ctx, Number(item.x) - 10, Number(item.y) - 8, 260, 40, 6);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = theme.text;
    ctx.font = '12.5px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    var lines = wrapMapTitle(function (text) { return ctx.measureText(text).width; }, item.text || '', 240, 3);
    lines.forEach(function (line, index) {
      ctx.fillText(line, Number(item.x), Number(item.y) + 6 + index * 17);
    });
  });
  return canvas;
}

function exportMapPng() {
  if (!state.mapData) {
    toast('导图没有节点，无法导出。', 'error');
    return;
  }
  var nodes = visibleMapNodes(state.mapData.nodes || []);
  if (!nodes.length) {
    toast('导图没有节点，无法导出。', 'error');
    return;
  }
  state.mapExportBusy = true;
  updateMapButtons();
  try {
    var canvas = buildMapExportCanvas(2);
    canvas.toBlob(function (blob) {
      if (!blob) {
        toast('导出 PNG 失败。', 'error');
        return;
      }
      downloadBlob(blob, mapExportFileName('png'));
      toast('已导出 PNG。', 'ok');
    }, 'image/png');
  } catch (err) {
    toast('导出 PNG 失败：' + (err && err.message ? err.message : '未知错误'), 'error');
  } finally {
    state.mapExportBusy = false;
    updateMapButtons();
  }
}

function exportMapPdf() {
  if (!state.mapData) {
    toast('导图没有节点，无法导出。', 'error');
    return;
  }
  var nodes = visibleMapNodes(state.mapData.nodes || []);
  if (!nodes.length) {
    toast('导图没有节点，无法导出。', 'error');
    return;
  }
  state.mapExportingPdf = true;
  updateMapButtons();
  try {
    var canvas = buildMapExportCanvas(2);
    canvas.toBlob(function (blob) {
      if (!blob) {
        state.mapExportingPdf = false;
        updateMapButtons();
        toast('导出 PDF 失败：无法生成图片。', 'error');
        return;
      }
      var form = new FormData();
      form.append('file', blob, 'mindmap.png');
      fetch(API_BASE + '/mindmaps/export/pdf', { method: 'POST', body: form })
        .then(function (resp) {
          if (!resp.ok) {
            return resp.text().then(function (text) {
              var message = 'HTTP ' + resp.status;
              try {
                var data = JSON.parse(text);
                if (data && data.error && data.error.message) message = data.error.message;
              } catch (ignore) { /* 非 JSON 错误体 */ }
              throw new Error(message);
            });
          }
          return resp.blob();
        })
        .then(function (pdfBlob) {
          downloadBlob(pdfBlob, mapExportFileName('pdf'));
          toast('已导出 PDF。', 'ok');
        })
        .catch(function (err) {
          toast('导出 PDF 失败：' + (err && err.message ? err.message : '未知错误'), 'error');
        })
        .then(function () {
          state.mapExportingPdf = false;
          updateMapButtons();
        });
    }, 'image/png');
  } catch (err) {
    state.mapExportingPdf = false;
    updateMapButtons();
    toast('导出 PDF 失败：' + (err && err.message ? err.message : '未知错误'), 'error');
  }
}

        mapMarkDirty();
      });
      var edgeSave = $('#edgeSaveBtn');
      if (edgeSave) edgeSave.addEventListener('click', saveMapNodes);
      var edgeDel = $('#edgeDeleteBtn');
      if (edgeDel) edgeDel.addEventListener('click', function () { removeMapEdge(edge.id); });
      return;
    }
  }
  if (state.mapSelectedTextId) {
    var text = null;
    (state.mapLayout.texts || []).forEach(function (item) { if (item.id === state.mapSelectedTextId) text = item; });
    if (text) {
      panel.innerHTML = head + '<div class="edit-body">'
        + '<div class="section-title"><h3>文本框</h3></div>'
        + '<label class="field"><span>文本内容</span><textarea id="textContentInput" maxlength="200">' + esc(text.text || '') + '</textarea></label>'
        + '<div class="edit-actions">'
        + '<button type="button" class="btn btn-primary btn-sm" id="textSaveBtn">保存</button>'
        + '<button type="button" class="btn btn-ghost btn-sm" id="textDeleteBtn">删除文本框</button>'
        + '</div></div>';
      var textInput = $('#textContentInput');
      if (textInput) textInput.addEventListener('input', function () {
        if (!textInput.dataset.undoPushed) { textInput.dataset.undoPushed = '1'; mapPushUndo(); }
        text.text = textInput.value;
        mapMarkDirty();
      });
      var textSave = $('#textSaveBtn');
      if (textSave) textSave.addEventListener('click', saveMapNodes);
      var textDel = $('#textDeleteBtn');
      if (textDel) textDel.addEventListener('click', function () { removeMapText(text.id); });
      return;
    }
  }
  var node = selectedMapNode();
  if (!node) {
    panel.innerHTML = head + '<div class="edit-empty">在画布中点选节点进行编辑。</div>';
    return;
  }
  var isRoot = node.node_key === 'root' || !node.parent_key;
  var chunkIds = Array.isArray(node.source_chunk_ids) ? node.source_chunk_ids : [];
  var sourceName = node.source_filename || findDocName(node.source_document_id) || node.source_document_id || '无';
  var chunkPreview = chunkIds.slice(0, 3).join('、');
  if (chunkIds.length > 3) chunkPreview += ' …';
  var shapeOptions = MAP_SHAPE_ORDER.map(function (key) {
    return '<option value="' + key + '"' + ((node.shape || 'roundrect') === key ? ' selected' : '') + '>'
      + esc(MAP_SHAPE_DEFS[key].name) + '</option>';
  }).join('');
  panel.innerHTML = head
    + '<div class="edit-body">'
    + '<label class="field"><span>标题</span>'
    + '<input type="text" id="nodeTitleInput" maxlength="80" value="' + esc(node.title || '') + '"></label>'
    + '<label class="field"><span>说明</span>'
    + '<textarea id="nodeNoteInput" maxlength="200">' + esc(node.note || '') + '</textarea></label>'
    + '<label class="field"><span>形状</span>'
    + '<select id="nodeShapeSelect" class="map-shape-select">' + shapeOptions + '</select></label>'
    + '<div class="source-box">'
    + '<div class="source-row"><span class="src-k">来源</span><span class="src-v">' + esc(sourceName) + '</span></div>'
    + '<div class="source-row"><span class="src-k">来源片段</span><span class="src-v">'
    + (chunkIds.length ? chunkIds.length + ' 个片段<br><span class="mono">' + esc(chunkPreview) + '</span>' : '无')
    + '</span></div>'
    + (node.source_snippet
      ? '<div class="source-row"><span class="src-k">原文</span><span class="src-v">' + esc(node.source_snippet)
        + (node.source_page ? '<br><span class="small muted">第 ' + toInt(node.source_page) + ' 页</span>' : '')
        + '</span></div>'
      : '')
    + (node.unverified
      ? '<div class="source-row"><span class="src-k">校验</span><span class="src-v"><span class="badge badge-warn">未验证来源</span></span></div>'
      : '')
    + '<div class="source-row"><span class="src-k">节点来源</span><span class="src-v">'
    + esc(node.origin === 'user' ? '手动编辑' : 'AI 生成') + '</span></div>'
    + '</div>'
    + '<div class="edit-actions">'
    + '<button type="button" class="btn btn-primary btn-sm" id="nodeSaveBtn">保存</button>'
    + '<button type="button" class="btn btn-outline btn-sm" id="nodeAddChildBtn">新增子节点</button>'
    + (isRoot ? '' : '<button type="button" class="btn btn-outline btn-sm" id="nodeAddSiblingBtn">新增同级</button>')
    + (isRoot ? '' : '<button type="button" class="btn btn-ghost btn-sm" id="nodeDeleteBtn">删除节点</button>')
    + '<button type="button" class="btn btn-outline btn-sm" id="nodeConnectBtn">开始连线</button>'
    + '</div></div>';

  var titleInput = $('#nodeTitleInput');
  if (titleInput) {
    titleInput.addEventListener('input', function () {
      if (!titleInput.dataset.undoPushed) { titleInput.dataset.undoPushed = '1'; mapPushUndo(); }
      node.title = titleInput.value;
      var canvasNode = $('#mapCanvas [data-node-key="' + cssEscape(node.node_key) + '"] .mn-title');
      if (canvasNode) canvasNode.textContent = node.title || '未命名节点';
      mapMarkDirty();
    });
  }
  var noteInput = $('#nodeNoteInput');
  if (noteInput) noteInput.addEventListener('input', function () {
    if (!noteInput.dataset.undoPushed) { noteInput.dataset.undoPushed = '1'; mapPushUndo(); }
    node.note = noteInput.value;
    mapMarkDirty();
  });
  var shapeSelect = $('#nodeShapeSelect');
  if (shapeSelect) shapeSelect.addEventListener('change', function () {
    mapPushUndo();
    node.shape = shapeSelect.value;
    mapMarkDirty();
    renderCanvas();
  });
  var saveBtn = $('#nodeSaveBtn');
  if (saveBtn) saveBtn.addEventListener('click', saveMapNodes);
  var addBtn = $('#nodeAddChildBtn');
  if (addBtn) addBtn.addEventListener('click', function () { addMapNode('child'); });
  var siblingBtn = $('#nodeAddSiblingBtn');
  if (siblingBtn) siblingBtn.addEventListener('click', function () { addMapNode('sibling'); });
  var delBtn = $('#nodeDeleteBtn');
  if (delBtn) delBtn.addEventListener('click', deleteSelectedNode);
  var connectBtn = $('#nodeConnectBtn');
  if (connectBtn) connectBtn.addEventListener('click', startMapConnect);
}

function cssEscape(value) {
  return String(value || '').replace(/["\\]/g, '\\$&');
}

async function saveMapNodes() {
  if (!state.mapData || state.mapSaving) return;
  var nodes = state.mapData.nodes || [];
  if (!nodes.length) { showMapError('导图没有节点。'); return; }
  state.mapSaving = true;
  updateMapButtons();
  try {
    var payload = {
      nodes: nodes.map(function (node) {
        return {
          node_key: node.node_key,
          parent_key: node.parent_key || null,
          title: node.title || '未命名节点',
          note: node.note || '',
          shape: node.shape || 'roundrect',
          pos_x: mapPosition(node, node.pos_x),
          pos_y: mapPosition(node, node.pos_y)
        };
      }),
      theme: state.mapTheme,
      layout: state.mapLayout
    };
    var result = await api('/mindmaps/' + encodeURIComponent(state.mapData.id), { method: 'PUT', json: payload });
    if (result && result.theme) state.mapTheme = result.theme;
    if (result && result.layout) state.mapLayout = result.layout;
    state.mapDirty = false;
    clearMapError();
    setMapStatus(FIXED.saved);
    await loadMaps();
    renderCanvas();
    renderMapEditPanel();
    toast('已保存。', 'ok');
  } catch (err) {
    showMapError(failMessage(err));
  } finally {
    state.mapSaving = false;
    updateMapButtons();
  }
}

function addMapNode(mode) {
  if (!state.mapData) return;
  var nodes = state.mapData.nodes || [];
  if (nodes.length >= MAX_EDIT_NODES) {
    showMapError('节点数已达上限（' + MAX_EDIT_NODES + '），无法新增。');
    return;
  }
  var parentKey;
  if (mode === 'child') {
    parentKey = state.mapSelectedKey;
    if (!parentKey) { showMapError('请先选择一个节点。'); return; }
  } else {
    var current = selectedMapNode();
    if (!current) { showMapError('请先选择一个节点。'); return; }
    if (current.node_key === 'root' || !current.parent_key) {
      showMapError('根节点不能新增同级节点。');
      return;
    }
    parentKey = current.parent_key;
  }
  mapPushUndo();
  var key = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  nodes.push({
    node_key: key,
    parent_key: parentKey,
    title: mode === 'child' ? '新子节点' : '新同级节点',
    note: '',
    source_document_id: null,
    source_chunk_ids: [],
    origin: 'user',
    unverified: 0,
    shape: 'roundrect',
    pos_x: null,
    pos_y: null
  });
  delete state.mapCollapsed[parentKey];
  state.mapSelectedKey = key;
  state.mapSelectedTextId = null;
  state.mapSelectedEdgeId = null;
  mapMarkDirty();
  renderCanvas();
  renderMapEditPanel();
}

function addChildNode() {
  addMapNode('child');
}

function findNodeByKey(nodes, key) {
  for (var i = 0; i < (nodes || []).length; i += 1) {
    if (nodes[i].node_key === key) return nodes[i];
  }
  return null;
}

async function deleteSelectedNode() {
  if (!state.mapData) return;
  var node = selectedMapNode();
  if (!node) { showMapError('请先选择一个节点。'); return; }
  if (node.node_key === 'root' || !node.parent_key) {
    showMapError('根节点不可删除。');
    return;
  }
  var ok = await confirmDialog(FIXED.delConfirm);
  if (!ok) return;
  mapPushUndo();
  var nodes = state.mapData.nodes || [];
  var removeKeys = {};
  removeKeys[node.node_key] = true;
  var changed = true;
  while (changed) {
    changed = false;
    nodes.forEach(function (item) {
      if (!removeKeys[item.node_key] && item.parent_key && removeKeys[item.parent_key]) {
        removeKeys[item.node_key] = true;
        changed = true;
      }
    });
  }
  state.mapData.nodes = nodes.filter(function (item) { return !removeKeys[item.node_key]; });
  state.mapLayout.edges = (state.mapLayout.edges || []).filter(function (edge) {
    return !removeKeys[edge.from_key] && !removeKeys[edge.to_key];
  });
  state.mapSelectedKey = node.parent_key || (state.mapData.nodes.length ? state.mapData.nodes[0].node_key : null);
  state.mapSelectedEdgeId = null;
  mapMarkDirty();
  renderCanvas();
  renderMapEditPanel();
}

function addMapText() {
  if (!state.mapData) return;
  var texts = state.mapLayout.texts || [];
  if (texts.length >= MAP_MAX_TEXTS) {
    showMapError(FIXED.textLimit);
    return;
  }
  var x = 160;
  var y = 120;
  if (mapViewport && mapViewport.scale) {
    x = Math.max(20, ((mapViewport.viewport.clientWidth / 2) - mapViewport.x) / mapViewport.scale - 130);
    y = Math.max(20, ((mapViewport.viewport.clientHeight / 2) - mapViewport.y) / mapViewport.scale - 20);
  }
  mapPushUndo();
  var id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  texts.push({ id: id, text: '双击编辑文本', x: Math.round(x), y: Math.round(y) });
  state.mapSelectedTextId = id;
  state.mapSelectedKey = null;
  state.mapSelectedEdgeId = null;
  mapMarkDirty();
  renderCanvas();
  renderMapEditPanel();
}

function removeMapText(textId) {
  mapPushUndo();
  state.mapLayout.texts = (state.mapLayout.texts || []).filter(function (item) { return item.id !== textId; });
  if (state.mapSelectedTextId === textId) state.mapSelectedTextId = null;
  mapMarkDirty();
  renderCanvas();
  renderMapEditPanel();
}

function removeMapEdge(edgeId) {
  mapPushUndo();
  state.mapLayout.edges = (state.mapLayout.edges || []).filter(function (item) { return item.id !== edgeId; });
  if (state.mapSelectedEdgeId === edgeId) state.mapSelectedEdgeId = null;
  mapMarkDirty();
  renderCanvas();
  renderMapEditPanel();
}

function startMapConnect() {
  if (!state.mapData) return;
  var node = selectedMapNode();
  if (!node) { showMapError(FIXED.connectNeedNode); return; }
  state.mapConnectMode = true;
  state.mapConnectSource = node.node_key;
  state.mapSelectedEdgeId = null;
  setMapStatus(FIXED.connectHint);
  renderCanvas();
  updateMapButtons();
}

function cancelMapConnect() {
  state.mapConnectMode = false;
  state.mapConnectSource = null;
  setMapStatus('');
  renderCanvas();
  updateMapButtons();
}

function finishMapConnect(targetKey) {
  if (!state.mapConnectMode) return;
  var sourceKey = state.mapConnectSource;
  if (!sourceKey || !targetKey) { cancelMapConnect(); return; }
  if (sourceKey === targetKey) {
    showMapError(FIXED.connectSelf);
    return;
  }
  var edges = state.mapLayout.edges || [];
  if (edges.length >= MAP_MAX_EDGES) {
    cancelMapConnect();
    showMapError(FIXED.edgeLimit);
    return;
  }
  var duplicated = edges.some(function (edge) {
    return edge.from_key === sourceKey && edge.to_key === targetKey;
  });
  if (duplicated) {
    cancelMapConnect();
    showMapError(FIXED.connectDup);
    return;
  }
  mapPushUndo();
  var edgeId = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  edges.push({ id: edgeId, from_key: sourceKey, to_key: targetKey, label: '' });
  state.mapLayout.edges = edges;
  state.mapSelectedEdgeId = edgeId;
  state.mapSelectedKey = null;
  mapMarkDirty();
  cancelMapConnect();
  renderMapEditPanel();
}

function autoLayoutMap() {
  if (!state.mapData) return;
  confirmDialog(FIXED.autoLayoutConfirm).then(function (ok) {
    if (!ok) return;
    mapPushUndo();
    (state.mapData.nodes || []).forEach(function (node) {
      node.pos_x = null;
      node.pos_y = null;
    });
    mapMarkDirty();
    renderCanvas();
    renderMapEditPanel();
  });
}

async function regenerateMap() {
  if (state.mapBusy) return;
  if (!state.mapData) {
    showMapError('请先在左侧选择一个导图。');
    return;
  }
  if (state.mapDirty) {
    var okSave = await confirmDialog('有未保存修改，重新生成会丢失这些修改。继续？');
    if (!okSave) return;
  }
  var mode = state.mapData.mode;
  state.mapBusy = true;
  updateMapButtons();
  clearMapError();
  setMapStatus('正在重新生成…');
  try {
    var result = await apiPost('/mindmaps/' + encodeURIComponent(state.mapData.id) + '/regenerate', {});
    await loadMaps();
    await openMap(state.mapData.id);
    var extra = '';
    if (result.warning) extra = ' ⚠ ' + result.warning;
    setMapStatus('已重新生成：保留手改节点 ' + toInt(result.kept_user_nodes)
      + ' 个，移除节点 ' + toInt(result.removed_nodes) + ' 个。' + extra);
  } catch (err) {
    if (mode === 'concept') {
      showMapError(fillFixed(FIXED.aiMapFail, err && err.message ? err.message : '未知错误'));
    } else {
      showMapError(failMessage(err));
    }
    setMapStatus('');
  } finally {
    state.mapBusy = false;
    updateMapButtons();
  }
}

function showMapError(message) {
  state.mapError = message;
  var box = $('#mapError');
  if (!box) return;
  box.textContent = message;
  box.hidden = false;
}

function clearMapError() {
  state.mapError = '';
  var box = $('#mapError');
  if (!box) return;
  box.hidden = true;
  box.textContent = '';
}

function setMapStatus(message) {
  state.mapStatus = message || '';
  var box = $('#mapStatus');
  if (box) box.textContent = message || '';
}

function bindCanvasInteractions() {
  var canvas = $('#mapCanvas');
  if (!canvas || canvas.dataset.bound === '1') return;
  canvas.dataset.bound = '1';
  canvas.addEventListener('click', function (ev) {
    var wordClose = ev.target.closest('[data-wordcloud-close]');
    if (wordClose) {
      state.mapWordCloud = false;
      renderCanvas();
      updateMapButtons();
      return;
    }
    var wordEl = ev.target.closest('[data-word-key]');
    if (wordEl && wordEl.getAttribute('data-word-key')) {
      selectNode(wordEl.getAttribute('data-word-key'));
      return;
    }
    if (state.mapEraserMode) {
      var strokeEl = ev.target.closest('[data-stroke-id]');
      if (strokeEl) {
        mapPushUndo();
        state.mapLayout.strokes = (state.mapLayout.strokes || []).filter(function (item) {
          return item.id !== strokeEl.getAttribute('data-stroke-id');
        });
        mapMarkDirty();
        renderCanvas();
      }
      return;
    }
    var del = ev.target.closest('[data-text-del]');
    if (del) {
      ev.stopPropagation();
      removeMapText(del.getAttribute('data-text-del'));
      return;
    }
    var fold = ev.target.closest('.mn-fold');
    if (fold) {
      ev.stopPropagation();
      toggleMapCollapse(fold.getAttribute('data-fold-key'));
      return;
    }
    var edgeEl = ev.target.closest('[data-edge-id]');
    if (edgeEl) {
      state.mapSelectedEdgeId = edgeEl.getAttribute('data-edge-id');
      state.mapSelectedKey = null;
      state.mapSelectedTextId = null;
      renderCanvas();
      renderMapEditPanel();
      return;
    }
    var textEl = ev.target.closest('[data-text-id]');
    if (textEl) {
      state.mapSelectedTextId = textEl.getAttribute('data-text-id');
      state.mapSelectedKey = null;
      state.mapSelectedEdgeId = null;
      renderMapEditPanel();
      return;
    }
    var nodeEl = ev.target.closest('[data-node-key]');
    if (nodeEl) {
      var key = nodeEl.getAttribute('data-node-key');
      if (state.mapConnectMode) {
        finishMapConnect(key);
        return;
      }
      selectNode(key);
    }
  });
  canvas.addEventListener('pointerdown', function (ev) {
    if (ev.button !== 0) return;
    if (state.mapPenMode) {
      startMapPenStroke(ev);
      return;
    }
    var handleEl = ev.target.closest('[data-text-handle]');
    if (handleEl) {
      beginMapTextDrag(handleEl.getAttribute('data-text-handle'), ev);
      return;
    }
    var textEl = ev.target.closest('[data-text-id]');
    if (textEl && ev.target.closest('.mt-del')) return;
    var nodeEl = ev.target.closest('[data-node-key]');
    if (nodeEl && !ev.target.closest('.mn-fold')) {
      beginMapNodeDrag(nodeEl.getAttribute('data-node-key'), ev);
      return;
    }
    if (textEl) {
      state.mapSelectedTextId = textEl.getAttribute('data-text-id');
      state.mapSelectedKey = null;
      state.mapSelectedEdgeId = null;
      renderMapEditPanel();
    }
  });
  canvas.addEventListener('input', function (ev) {
    var body = ev.target.closest('.mt-body');
    if (!body) return;
    var textEl = body.closest('[data-text-id]');
    if (!textEl) return;
    if (!body.dataset.undoPushed) { body.dataset.undoPushed = '1'; mapPushUndo(); }
    var id = textEl.getAttribute('data-text-id');
    (state.mapLayout.texts || []).forEach(function (item) {
      if (item.id === id) {
        item.text = String(body.textContent || '').slice(0, 200);
      }
    });
    mapMarkDirty();
  });
}

function beginMapNodeDrag(nodeKey, startEvent) {
  if (!state.mapData || state.mapConnectMode || state.mapPenMode) return;
  var node = mapNodeByKey(nodeKey);
  if (!node) return;
  var scale = mapViewport && mapViewport.scale ? mapViewport.scale : 1;
  var nodes = visibleMapNodes(state.mapData.nodes || []);
  var layout = computeMapLayout(nodes);
  var point = layout.positions[nodeKey];
  if (!point) return;
  var startX = startEvent.clientX;
  var startY = startEvent.clientY;
  var baseX = mapPosition(node, node.pos_x);
  var baseY = mapPosition(node, node.pos_y);
  if (baseX === null) baseX = point.x;
  if (baseY === null) baseY = point.y;
  var before = mapSnapshot();
  var moved = false;
  var dropKey = null;
  var isRoot = nodeKey === 'root' || !node.parent_key;
  startEvent.preventDefault();
  function descendantsOf(key) {
    var result = {};
    var all = state.mapData.nodes || [];
    var changed = true;
    result[key] = true;
    while (changed) {
      changed = false;
      all.forEach(function (item) {
        if (!result[item.node_key] && item.parent_key && result[item.parent_key]) {
          result[item.node_key] = true;
          changed = true;
        }
      });
    }
    return result;
  }
  function onMove(ev) {
    var dx = (ev.clientX - startX) / scale;
    var dy = (ev.clientY - startY) / scale;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
    moved = true;
    node.pos_x = Math.round(Math.min(MAP_POS_LIMIT, Math.max(-MAP_POS_LIMIT, baseX + dx)) * 100) / 100;
    node.pos_y = Math.round(Math.min(MAP_POS_LIMIT, Math.max(-MAP_POS_LIMIT, baseY + dy)) * 100) / 100;
    var hit = document.elementFromPoint(ev.clientX, ev.clientY);
    var targetEl = hit ? hit.closest('[data-node-key]') : null;
    var targetKey = targetEl ? targetEl.getAttribute('data-node-key') : null;
    var banned = descendantsOf(nodeKey);
    if (!targetKey || banned[targetKey] || targetKey === nodeKey) targetKey = null;
    if (targetKey !== dropKey) {
      dropKey = targetKey;
      state.mapDropTargetKey = targetKey;
    }
    mapMarkDirty();
    renderCanvas();
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    state.mapDropTargetKey = null;
    if (!moved) return;
    mapPushUndo(before);
    if (dropKey && !isRoot && dropKey !== nodeKey) {
      node.parent_key = dropKey;
      node.pos_x = null;
      node.pos_y = null;
      delete state.mapCollapsed[dropKey];
      state.mapSelectedKey = nodeKey;
      setMapStatus('已改挂到「' + ((mapNodeByKey(dropKey) || {}).title || dropKey) + '」下，记得保存。');
    }
    mapMarkDirty();
    renderCanvas();
    renderMapEditPanel();
    updateMapButtons();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function beginMapTextDrag(textId, startEvent) {
  if (!state.mapData) return;
  var text = null;
  (state.mapLayout.texts || []).forEach(function (item) { if (item.id === textId) text = item; });
  if (!text) return;
  var scale = mapViewport && mapViewport.scale ? mapViewport.scale : 1;
  var startX = startEvent.clientX;
  var startY = startEvent.clientY;
  var baseX = Number(text.x) || 0;
  var baseY = Number(text.y) || 0;
  var before = mapSnapshot();
  var moved = false;
  startEvent.preventDefault();
  function onMove(ev) {
    var dx = (ev.clientX - startX) / scale;
    var dy = (ev.clientY - startY) / scale;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
    moved = true;
    text.x = Math.round(Math.min(MAP_POS_LIMIT, Math.max(-MAP_POS_LIMIT, baseX + dx)));
    text.y = Math.round(Math.min(MAP_POS_LIMIT, Math.max(-MAP_POS_LIMIT, baseY + dy)));
    mapMarkDirty();
    renderCanvas();
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if (moved) mapPushUndo(before);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function mapSnapshot() {
  return JSON.stringify({
    theme: state.mapTheme,
    layout: state.mapLayout,
    nodes: state.mapData ? state.mapData.nodes : [],
    selectedKey: state.mapSelectedKey,
    selectedTextId: state.mapSelectedTextId,
    selectedEdgeId: state.mapSelectedEdgeId
  });
}

function mapPushUndo(snapshot) {
  if (!state.mapData) return;
  state.mapUndo.push(snapshot || mapSnapshot());
  if (state.mapUndo.length > 50) state.mapUndo.shift();
  state.mapRedo = [];
  updateMapButtons();
}

function mapApplySnapshot(json) {
  var data;
  try { data = JSON.parse(json); } catch (err) { return; }
  state.mapTheme = data.theme || 'fresh';
  var layout = data.layout || {};
  state.mapLayout = {
    texts: Array.isArray(layout.texts) ? layout.texts : [],
    edges: Array.isArray(layout.edges) ? layout.edges : [],
    strokes: Array.isArray(layout.strokes) ? layout.strokes : []
  };
  if (state.mapData) state.mapData.nodes = Array.isArray(data.nodes) ? data.nodes : [];
  state.mapSelectedKey = data.selectedKey || null;
  state.mapSelectedTextId = data.selectedTextId || null;
  state.mapSelectedEdgeId = data.selectedEdgeId || null;
  state.mapDirty = true;
  setMapStatus(FIXED.unsaved);
  renderCanvas();
  renderMapEditPanel();
  updateMapButtons();
}

function mapUndo() {
  if (!state.mapUndo.length || !state.mapData) return;
  var current = mapSnapshot();
  var snapshot = state.mapUndo.pop();
  state.mapRedo.push(current);
  mapApplySnapshot(snapshot);
}

function mapRedo() {
  if (!state.mapRedo.length || !state.mapData) return;
  var current = mapSnapshot();
  var snapshot = state.mapRedo.pop();
  state.mapUndo.push(current);
  mapApplySnapshot(snapshot);
}

function mapWordCounts(nodes) {
  var stop = { '的': 1, '了': 1, '和': 1, '与': 1, '及': 1, '或': 1, '是': 1, '在': 1, '对': 1, '中': 1,
    '可以': 1, '进行': 1, '以及': 1, '通过': 1, '使用': 1, '主要': 1, '包括': 1, '一个': 1, '这个': 1, '我们': 1 };
  var counts = {};
  (nodes || []).forEach(function (node) {
    var text = String(node.title || '') + ' ' + String(node.note || '');
    var latin = text.match(/[A-Za-z][A-Za-z0-9_]{1,}/g) || [];
    latin.forEach(function (word) {
      word = word.toLowerCase();
      if (word.length < 3) return;
      counts[word] = (counts[word] || 0) + 1;
    });
    var cjk = text.replace(/[^\u3400-\u9fff]/g, '');
    for (var i = 0; i < cjk.length - 1; i += 1) {
      var bigram = cjk.slice(i, i + 2);
      if (stop[bigram]) continue;
      counts[bigram] = (counts[bigram] || 0) + 1;
    }
  });
  return Object.keys(counts).map(function (word) {
    return { word: word, count: counts[word] };
  }).filter(function (item) {
    return item.count >= 2;
  }).sort(function (a, b) {
    return b.count - a.count;
  }).slice(0, 30);
}

function renderMapWordCloudHtml(nodes) {
  var items = mapWordCounts(nodes);
  if (!items.length) {
    return '<div class="map-wordcloud"><div class="map-wordcloud-head"><span>词云</span>'
      + '<button type="button" class="map-wordcloud-close" data-wordcloud-close="1">×</button></div>'
      + '<div class="muted small">节点文字太少，暂无法生成词云。</div></div>';
  }
  var max = items[0].count;
  var min = items[items.length - 1].count;
  var palette = ['#146c60', '#2f6fa8', '#b06a12', '#4a5568', '#8a5510'];
  var buttons = items.map(function (item, index) {
    var size = 12 + Math.round((item.count - min) / Math.max(1, max - min) * 18);
    var key = '';
    (nodes || []).some(function (node) {
      if ((String(node.title || '') + String(node.note || '')).indexOf(item.word) >= 0) {
        key = node.node_key;
        return true;
      }
      return false;
    });
    return '<button type="button" class="map-word" data-word-key="' + esc(key)
      + '" style="font-size:' + size + 'px;color:' + palette[index % palette.length] + '">'
      + esc(item.word) + '</button>';
  }).join('');
  return '<div class="map-wordcloud"><div class="map-wordcloud-head"><span>词云（点击定位节点）</span>'
    + '<button type="button" class="map-wordcloud-close" data-wordcloud-close="1">×</button></div>'
    + '<div class="map-wordcloud-body">' + buttons + '</div></div>';
}

function updateMinimap() {
  var box = $('#mapMinimap');
  if (!box) return;
  if (!state.mapMinimap || !state.mapData || !mapViewport || !mapViewport.width) {
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  box.hidden = false;
  var nodes = visibleMapNodes(state.mapData.nodes || []);
  var layout = computeMapLayout(nodes);
  var W = 168;
  var H = 118;
  var pad = 6;
  var scale = Math.min((W - pad * 2) / layout.width, (H - pad * 2) / layout.height);
  var parts = ['<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">',
    '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="6" fill="rgba(255,255,255,.94)" stroke="#d7e2dd"/>'];
  Object.keys(layout.positions).forEach(function (key) {
    var point = layout.positions[key];
    parts.push('<rect x="' + (pad + point.x * scale) + '" y="' + (pad + point.y * scale)
      + '" width="' + Math.max(2, point.w * scale) + '" height="' + Math.max(2, point.h * scale)
      + '" rx="1.4" fill="#8ba9a0"/>');
  });
  var view = mapViewport;
  var vx = pad + (-view.x / view.scale) * scale;
  var vy = pad + (-view.y / view.scale) * scale;
  var vw = (view.viewport.clientWidth / view.scale) * scale;
  var vh = (view.viewport.clientHeight / view.scale) * scale;
  parts.push('<rect x="' + vx + '" y="' + vy + '" width="' + vw + '" height="' + vh
    + '" fill="rgba(20,108,96,.12)" stroke="#146c60" stroke-width="1.2"/>');
  parts.push('</svg>');
  box.innerHTML = parts.join('');
}

function startMapPenStroke(startEvent) {
  if (!state.mapData || !mapViewport) return;
  startEvent.preventDefault();
  var view = mapViewport;
  var rect = $('#mapViewport').getBoundingClientRect();
  var scale = view.scale || 1;
  function toCanvasPoint(ev) {
    return {
      x: Math.round(((ev.clientX - rect.left) - view.x) / scale),
      y: Math.round(((ev.clientY - rect.top) - view.y) / scale)
    };
  }
  var before = mapSnapshot();
  state.mapStrokeDraft = {
    color: '#b06a12',
    width: 2,
    points: [toCanvasPoint(startEvent)]
  };
  function onMove(ev) {
    if (!state.mapStrokeDraft) return;
    state.mapStrokeDraft.points.push(toCanvasPoint(ev));
    renderCanvas();
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    var draft = state.mapStrokeDraft;
    state.mapStrokeDraft = null;
    if (!draft || draft.points.length < 2) {
      renderCanvas();
      return;
    }
    mapPushUndo(before);
    state.mapLayout.strokes = state.mapLayout.strokes || [];
    state.mapLayout.strokes.push({
      id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4),
      color: draft.color,
      width: draft.width,
      points: draft.points
    });
    mapMarkDirty();
    renderCanvas();
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function bindPaperEvents() {
  var uploadBtn = $('#paperUploadBtn');
  if (uploadBtn) uploadBtn.addEventListener('click', uploadPaper);
  var checkBtn = $('#paperCheckBtn');
  if (checkBtn) checkBtn.addEventListener('click', checkPaper);
  var executeBtn = $('#paperExecuteBtn');
  if (executeBtn) executeBtn.addEventListener('click', executePaper);
  $$('input[name="paperProfileMode"]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      state.paperProfileMode = radio.value;
      state.paperError = '';
      renderPaperTab();
    });
  });
  var profileFile = $('#paperProfileFile');
  if (profileFile) {
    profileFile.addEventListener('change', function (ev) {
      var file = ev.target.files ? ev.target.files[0] : null;
      if (!file) { state.paperTemplate = null; return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(String(reader.result || ''));
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
            throw new Error('模板必须是 JSON 对象');
          }
          state.paperTemplate = { name: file.name, json: parsed };
          state.paperError = '';
        } catch (err) {
          state.paperTemplate = null;
          state.paperError = '模板 JSON 解析失败：' + (err && err.message ? err.message : '格式不正确');
        }
        renderPaperTab();
      };
      reader.readAsText(file, 'utf-8');
    });
  }
}

async function uploadPaper() {
  var input = $('#paperFileInput');
  var file = input && input.files ? input.files[0] : null;
  if (!file) {
    state.paperError = '请选择要上传的 DOCX 文件。';
    renderPaperTab();
    return;
  }
  if (!/\.docx$/i.test(file.name)) {
    state.paperError = '论文仅支持 .docx 文件。';
    renderPaperTab();
    return;
  }
  state.paperBusy = true;
  state.paperError = '';
  renderPaperTab();
  try {
    var form = new FormData();
    form.append('file', file);
    var result = await apiForm('/papers', form);
    state.paper = result;
    state.paperCheck = null;
    state.paperResult = null;
    toast('论文已上传。', 'ok');
  } catch (err) {
    state.paperError = failMessage(err);
  } finally {
    state.paperBusy = false;
    renderPaperTab();
  }
}

async function checkPaper() {
  if (!state.paper || state.paperBusy) return;
  var payload = { profile_mode: state.paperProfileMode };
  if (state.paperProfileMode === 'upload') {
    if (!state.paperTemplate || !state.paperTemplate.json) {
      state.paperError = '请先导入合法的模板 JSON。';
      renderPaperTab();
      return;
    }
    payload.profile_json = state.paperTemplate.json;
  }
  state.paperBusy = true;
  state.paperError = '';
  renderPaperTab();
  try {
    state.paperCheck = await apiPost('/papers/' + encodeURIComponent(state.paper.paper_id) + '/check', payload);
    state.paperResult = null;
  } catch (err) {
    state.paperCheck = null;
    state.paperError = failMessage(err);
  } finally {
    state.paperBusy = false;
    renderPaperTab();
  }
}

async function executePaper() {
  if (!state.paper || !state.paperCheck || state.paperBusy) return;
  state.paperBusy = true;
  state.paperError = '';
  renderPaperTab();
  try {
    state.paperResult = await apiPost('/papers/' + encodeURIComponent(state.paper.paper_id) + '/execute', {});
    toast('修正完成。', 'ok');
  } catch (err) {
    state.paperError = failMessage(err);
  } finally {
    state.paperBusy = false;
    renderPaperTab();
  }
}
